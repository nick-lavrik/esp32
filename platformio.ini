; RGB332 -  8bit / 255 colors
; RGB565 - 16bit / 65 536 colors
; RGB888 - 24bit / True Color (16.7 millions)
; RGBA8888 - 32bit / True Color + Alpha Channel (прозорість)
;
; CORE_DEBUG_LEVEL
;   0 None — логів немає
;   1 Error
;   2 Warn
;   3 Info
;   4 Debug
;   5 Verbose
;
; debug_tool 
[platformio]
; default_envs = esp32-c6
extra_configs = secrets.ini 
; secrets-${PIOENV}.ini
data_dir = data

[common]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; УВАГА: -std=gnu++17 вище фактично НЕ діє - фреймворк (arduino-esp32) додає
    ; свій -std=gnu++2a ПІСЛЯ цих флагів у тій самій команді компіляції, а gcc
    ; бере останній. Перевірити реальний стандарт можна в compile_commands.json.
    ; Прибирати не стали: якщо фреймворк колись перестане задавати -std, цей
    ; флаг знову стане робочим дефолтом.
    ;
    ; Діагностика компілятора. Без -Wall gcc не вмикає -Wformat, тому
    ; неспівпадіння format-рядка й аргументів (класика для Logger::info/printf)
    ; проходили в збірку молча. -Wformat-security ловить виклики виду
    ; log(buffer) - тобто змінну як format-рядок.
    ; Тут ЛИШЕ попередження, без -Werror: сторонні бібліотеки в lib_deps
    ; шумлять, і збірка не має від цього падати.
    ;
    ; -Wundef свідомо НЕ вмикаємо глобально: сам arduino-esp32 core рясно
    ; використовує "#if CONFIG_IDF_TARGET_*" для незаданих макросів, і його
    ; шум повністю ховає наш власний.
    -Wall
    -Wextra
    -Wformat
    -Wformat-security
    -Wno-unused-parameter
    ; include/ PlatformIO додає в include path лише для src/, НЕ для lib/*.
    ; Явний -I робить include/ видимим і бібліотекам: lib/Display підключає
    ; звідти фасади бекендів (Setup_*.h) і features.h.
    -I include
    ; -I lib/EventDispatcher/
    -D DEFAULT_LOG_LEVEL=3
    ; Відповідь на MQTT-команду (lib/CommandResponse): розмір однієї порції в
    ; байтах і скільки порцій максимум на команду. Ліміт - захист від команди,
    ; що зациклилась у виводі; понад нього рядки відкидаються, а фінальна
    ; порція містить маркер "...(truncated, N more lines)".
    -D COMMAND_RESPONSE_CHUNK_BYTES=512
    -D COMMAND_RESPONSE_MAX_CHUNKS=8
    ; Дзеркало консолі в MQTT (lib/ConsoleMqtt): дефолтний стан (перекривається
    ; командою "console-mqtt on|off" і зберігається в NVS), ліміт швидкості й
    ; розмір кожного зі списків правил. HAS_CONSOLE_MQTT тут навмисно немає -
    ; явний прапорець лежить у environment.h кожного env (розділ 2), поруч із
    ; HAS_MQTT_CLIENT.
    -D CONSOLE_MQTT_ACTIVE=0
    -D CONSOLE_MQTT_RATE_PER_SEC=10
    -D CONSOLE_MQTT_MAX_RULES=8
    -D PIO_PIOENV=\"${PIOENV}\"
    -D SYSENV_BOARD_VERSION=\"${sysenv.BOARD_VERSION}\"
    ; Дефолтний DHCP hostname (NetworkSupervisorConfig::hostname, src/main.cpp
    ; setupNetworkSupervisor()). Runtime-перевизначення - NVS, команда
    ; 'net general hostname <name>' (лишається компільований дефолт, поки
    ; в NVS нічого не збережено).
    -D WIFI_HOSTNAME=\"${secrets.wifi_hostname}\"
    # Перелік мереж живе в src/WifiNetworks.hpp; сюди приходить лише те, що не
    # можна тримати в git (secrets.ini у .gitignore, WifiNetworks.hpp - ні).
    #
    # _SEED - змінна мережа "тут і зараз": підміняється в secrets.ini без
    # правки коду, у таблиці стоїть останньою з пріоритетом 0.
    -D WIFI_SSID_SEED=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD_SEED=\"${secrets.wifi_password}\"
    # Спільний пароль постійних мереж (Asus / 5G.nick.lavrik).
    -D WIFI5_PASSWORD=\"${secrets.wifi5_password}\"
    -D GMAIL_EMAIL=\"${secrets.gmail_email}\"
    -D GMAIL_PASSWORD=\"${secrets.gmail_password}\"
    # gmail_smtp лежав у secrets.ini з самого початку, але хост був прошитий
    # у GmailSender.cpp і цей ключ ніхто не читав.
    #
    # Порт свідомо НЕ береться з secrets.gmail_port: 587 (STARTTLS) з ядровим
    # WiFiClientSecure заміряно неробочим (див. GmailSender.hpp), і підстановка
    # звідти давала поламаний дефолт. Дефолт 465 (implicit SSL) стоїть у
    # GmailSender.hpp під #ifndef - хто хоче інший, додає -D GMAIL_SMTP_PORT.
    -D GMAIL_SMTP_HOST=\"${secrets.gmail_smtp}\"
    -D MQTT_HOST=\"${secrets.mqtt_host}\"
    -D MQTT_PORT=${secrets.mqtt_port}
    -D MQTT_CLIENT_ID=\"${secrets.mqtt_client_id}\"
    -D MQTT_USERNAME=\"${secrets.mqtt_username}\"
    -D MQTT_PASSWORD=\"${secrets.mqtt_password}\"
    -D MQTT_LWT_TOPIC=\"${secrets.mqtt_lwt_topic}\"
    -D MQTT_LWT_MSG_ONLINE=\"${secrets.mqtt_lwt_msg_online}\"
    -D MQTT_LWT_MSG_OFFLINE=\"${secrets.mqtt_lwt_msg_offline}\"
    ; default topic prefix (eg. dev/prod/qa/local, регіон) for MqttKeyGenerator; runtime
    ; override - ConfigStorage key CFG_MQTT_TOPIC_PREFIX (see. src/main.cpp)
    -D MQTT_TOPIC_PREFIX=\"${secrets.mqtt_topic_prefix}\"
    -D ROUTER_HOST=\"${secrets.router_host}\"
    -D ROUTER_LOGIN_AUTHORIZATION=\"${secrets.router_login_authorization}\"
    ; EcoFlow Open Platform (developer-eu.ecoflow.com).
    ; MQTT-креденшели (host/port/username/password) - це готова відповідь
    ; GET /iot-open/sign/certification, знята вручну; username там же
    ; certificateAccount, тобто {account} у схемі топіків /open/{account}/{sn}/...
    ; access/secret key потрібні окремо - для REST-запитів (список пристроїв,
    ; перевипуск креденшелів), див. src/Ecoflow/EcoflowAuthClient.
    -D ECOFLOW_MQTT_HOST=\"${secrets.ecoflow_mqtt_host}\"
    -D ECOFLOW_MQTT_PORT=${secrets.ecoflow_mqtt_port}
    -D ECOFLOW_MQTT_USERNAME=\"${secrets.ecoflow_mqtt_username}\"
    -D ECOFLOW_MQTT_PASSWORD=\"${secrets.ecoflow_mqtt_password}\"
    -D ECOFLOW_ACCESS_KEY=\"${secrets.ecoflow_access_key}\"
    -D ECOFLOW_SECRET_KEY=\"${secrets.ecoflow_secret_key}\"
    ; Приватний API застосунку (api.ecoflow.com) - потрібен там, де Open
    ; Platform віддає обрізаний набір полів: DELTA mini через /open/ шле
    ; 23 поля з нулевими ваттами, а через /app/device/property - 201, з
    ; inv.acInVol та inv.inputWatts. Канал обирається ПРЕФІКСОМ акаунта:
    ; "open-..." -> Open Platform, "app-..." -> приватний.
    ; user_id обовʼязковий для app-каналу: брокер вимагає clientId у
    ; форматі ANDROID_<будь-що>_<userId>, інакше not authorised.
    -D ECOFLOW_USER_ID=\"${secrets.ecoflow_user_id}\"
    -D ECOFLOW_LOGIN=\"${secrets.ecoflow_login}\"
    -D ECOFLOW_PASSWORD=\"${secrets.ecoflow_password}\"

# ESP32-S3 (QFN56) - JC3248W535C
# прямоугольний, в чорному корпусі, з дінаміком (поки не в цьому проекті)
# https://spotpear.com/wiki/ESP32-S3-3.5-inch-LCD-Captive-TouchScreen-Display-480x320-Tablet-MP3-Video-Weather-Clock.html
# ffmpeg -i your_video.mp4 -vcodec mjpeg -s 480x320 -r 20 -an boot.mpeg

; --- Спільні налаштування ---
[env]
platform = espressif32
framework = arduino
; Перегенерувати вшиту статику порталу, якщо assets/www/ змінився, і
; стемпити короткий git-sha (GIT_REVISION) у прошивку й sapi/revision.js.
extra_scripts =
    pre:tools/pio_web_assets.py
    pre:tools/pio_sapi_revision.py
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
monitor_echo = yes

# ESP32-S3 Arduino LVGL WIFI and Bluetooth development board 4.0 inch 480 * 480 
# великий квадратний в корпусі
# Crystal 40 MHz
# CPU Cores: 2 (Dual)
# Max CPU Frequency: 240 MHz
# Embedded PSRAM: 8MB (AP Memory 3.3 V)
# Flash ID: 0x182085
# Flash Device: 16 MB
#
# CONFIGURATION: https://docs.platformio.org/page/boards/espressif32/esp32-s3-devkitc-1.html
# PLATFORM: Espressif 32 (55.3.39+sha.cbc3349) > Espressif ESP32-S3-DevKitC-1-N8 (8 MB QD, No PSRAM)
# HARDWARE: ESP32S3 240MHz, 320KB RAM, 16MB Flash
#
# Connected to ESP32-S3 on /dev/ttyUSB0:
# Chip type:          ESP32-S3 (QFN56) (revision v0.2)
# Features:           Wi-Fi, BT 5 (LE), Dual Core + LP Core, 240MHz, Embedded PSRAM 8MB (AP_3v3)
# Crystal frequency:  40MHz
# MAC:                8c:bf:ea:0e:d0:10
[env:esp32-4848s040]
extends = env
; upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
; board_build.partitions = default.csv
board_build.partitions = partitions_4848s040.csv
; Без цього рядка дефолт платформи - spiffs: 'uploadfs' залив би SPIFFS-образ,
; а прошивка відкриває розділ як LittleFS (і LittleFS.begin(true) його форматує).
board_build.filesystem = littlefs
build_type = debug
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_unflags = ${common.build_unflags}
build_src_filter = +<*> +<../src-4848s040/>
lib_deps = 
    lovyan03/LovyanGFX @ ^1.1.16
    tamctec/TAMC_GT911 @ ^1.0.2
    dvarrel/ESPping @ ^1.0.5
    ; lvgl/lvgl@^8.3.11
    ; mobizt/ESP Mail Client @ ^3.4.17
    mobizt/ReadyMail @ ^0.4.1
    bodmer/TJpg_Decoder
    bblanchon/ArduinoJson
    ; knolleary/PubSubClient @ ^2.8
    mlesniew/PicoMQTT @ ^1.3.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
# esp32-4848s040
build_flags =
    -include src-4848s040/environment.h
    ${common.build_flags}
    ; Реальні компіляторні прапорці (не -D/макроси) - лишаються тут, у
    ; environment.h піти не можуть. Обидва інертні (закомментовані) -
    ; експериментальний workaround для PSRAM cache issue, не був потрібен.
    ; -mfix-esp32-psram-cache-issue
    ; -DARDUINO_USB_CDC_ON_BOOT=1


# ESP32-S3-LCD-1.47
# Waveshare ESP32-S3 1.47inch LCD Screen Display 172×320 Development Board 262K Color Supports WiFi & Bluetooth
# Display - 1.47", 172x320, colors ~262k
# ESP32-S3R8 / ME6217C33M5G - Low dropout LDO, current (max) 800mA
# ЖК-дисплей (SPI): MOSI — GPIO45, SCLK — GPIO40, CS — GPIO42, DC — GPIO41, RESET — GPIO39, Подсветка (Backlight) — GPIO48.
# Слот MicroSD / TF-карты: подключен по интерфейсу SPI (зависит от ревизии, обычно задействует линии SDIO/SPI).
# Встроенный RGB-светодиод (WS2812) - GPIO38
 
# Waveshare ESP32-S3-LCD-1.47 (ESP32-S3, ST7789 SPI 172x320, PSRAM, SD, без touch)
# https://www.waveshare.com/wiki/ESP32-S3-LCD-1.47
# https://www.aliexpress.com/item/1005008271028531.html
# Чіп той самий клас, що й esp32-4848s040 (ESP32-S3, PSRAM), але дисплей —
# звичайний SPI ST7789 (як esp32-st7789), тому lib_deps/build_flags дисплею
# скопійовано з env:esp32-st7789, а chip-налаштування (board/psram/flash) —
# з env:esp32-4848s040.
#
# TF-карта на платі підключена через SD_MMC (4-bit: D0/D1/D2/D3/CLK/CMD),
# а не через SPI CS/MOSI/MISO/SCK, як в інших env. lib/SDCardInspector
# розрахований на SPI SD.begin(cs) — тому SD тут поки що вимкнена
# (BOARD_HAS_SD=0). Підключення SD_MMC — окрема задача на майбутнє.
#
# Touch на цій моделі відсутній (non-touch версія ESP32-S3-LCD-1.47).
[env:esp32-s3-lcd147]
extends = env
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.partitions = partitions_esp32_s3_lcd147.csv
; Без цього рядка дефолт платформи - spiffs: 'uploadfs' залив би SPIFFS-образ,
; а прошивка відкриває розділ як LittleFS (і LittleFS.begin(true) його форматує).
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_unflags = ${common.build_unflags}
build_src_filter = +<*> +<../src-esp32-s3-lcd147/>
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    dvarrel/ESPping @ ^1.0.5
    ; mobizt/ESP Mail Client @ ^3.4.17
    mobizt/ReadyMail @ ^0.4.1
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson
    ; knolleary/PubSubClient @ ^2.8
    mlesniew/PicoMQTT @ ^1.3.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0

# esp32-s3-lcd147
#
# ARDUINO_USB_MODE=0 (OTG/TinyUSB, потрібен для USB Mass Storage,
# src-esp32-s3-lcd147/SdMassStorage.cpp) МАЄ бути тут, а не в environment.h:
# плата esp32-s3-devkitc-1 підмішує власний -DARDUINO_USB_MODE=1 через
# board manifest, і SCons ставить його в командному рядку компілятора ПІСЛЯ
# усіх -include заголовків - #ifndef у environment.h фізично не встигає його
# перехопити. Побити board-флаг може лише інший -D тут, у build_flags.
#
# Звідси й "ARDUINO_USB_MODE redefined" на кожен .cpp при збірці - очікуваний
# побічний ефект самого перебивання, не помилка. -UARDUINO_USB_MODE перед -D
# у build_flags не рятує: PlatformIO розбирає build_flags по внутрішніх
# списках (CPPDEFINES окремо) і збирає їх назад у своєму порядку, тому
# взаємне розташування -U/-D із build_flags до фактичного виклику gcc не
# доживає.
build_flags =
    -include include/Setup_ST7789_lcd147.h
    -include src-esp32-s3-lcd147/environment.h
    -DARDUINO_USB_MODE=0
    ${common.build_flags}
  

# NodeMCU ESP8266 Development Board With 0.96 Inch OLED Display CH340G ESP-12F WiFi Module
# монохромний I2C OLED (SSD1306, 128x64). Повна інтеграція: WiFi/NTP/Ping/MQTT/Gmail/EventDispatcher/TaskController.
#
# NodeMCU ESP8266 Development Board With 0.96 Inch OLED Display CH340G ESP-12F WiFi Module
# монохромний I2C OLED (SSD1306, 128x64). Спільний src/main.cpp - усі відмінності
# від ESP32 інкапсульовані через #if defined(BOARD_ESP8266) (WiFi/ConfigStorage(NVS)/
# SystemReset - недоступні на ESP8266 core) та вже наявні BOARD_HAS_SD=0 /
# BOARD_HAS_TOUCHSCREEN=0 / BOARD_HAS_DISPLAY=1. EspPartitionInspector сам розгалужується
# всередині через #if defined(ESP8266) (немає esp_partition.h - фіксований layout
# з лінкер-символів + ESP.h) і тепер бере участь у зборці й тут.
#
# CONFIGURATION: https://docs.platformio.org/page/boards/espressif8266/nodemcuv2.html
# PLATFORM: Espressif 8266 (4.2.1) > NodeMCU 1.0 (ESP-12E Module)
# HARDWARE: ESP8266 80MHz, 80KB RAM, 4MB Flash
#
# Chip is ESP8266EX
# Features: WiFi
# Crystal is 26MHz
# MAC: bc:ff:4d:e6:e0:0d
#
# жовта = 128×16, синя = 128×48 (сумарно 128×64).
[env:esp8266]
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
build_src_filter = +<*> -<Ecoflow/> +<../src-esp8266/>
; lib_ldf_mode = deep+
build_unflags = ${common.build_unflags}
lib_ignore =
    AsyncTCP
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    ; mobizt/ESP Mail Client @ ^3.4.17
    mobizt/ReadyMail @ ^0.4.1
    bodmer/TJpg_Decoder
    bblanchon/ArduinoJson
    knolleary/PubSubClient @ ^2.8
    ; mlesniew/PicoMQTT @ ^1.3.0
    esphome/ESPAsyncTCP-esphome @ ^2.0.0
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0

# esp8266
build_flags =
    -include src-esp8266/environment.h
    ${common.build_flags}

# ST7789 ESP32 WiFi Bluetooth Development Board 2.8-inch Driver Intelligent Display Color Screen Onboard ESP32-32E Module
# в прозорому корпусі (дві кришки)
# ESP32-D0WD-V3 (revision 3)
# Crystal 26 MHz
# CPU Cores: 2 (Dual)
# Max CPU Frequency: 240 MHz
# Flash ID: 0x16405E
# Flash Device : 4 MB
#
# CONFIGURATION: https://docs.platformio.org/page/boards/espressif32/esp32dev.html
# PLATFORM: Espressif 32 (55.3.39+sha.cbc3349) > Espressif ESP32 Dev Module
# HARDWARE: ESP32 240MHz, 320KB RAM, 4MB Flash
#
# Connected to ESP32 on /dev/ttyUSB1:
# Chip type:          ESP32-D0WD-V3 (revision v3.1)
# Features:           Wi-Fi, BT, Dual Core + LP Core, 240MHz, Vref calibration in eFuse, Coding Scheme None
# Crystal frequency:  40MHz
# MAC:                b4:bf:e9:de:1d:58
[env:esp32-st7789]
extends = env
; upload_port = /dev/ttyUSB0
; upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
upload_speed = 921600
; upload_speed = 115200
board = esp32dev
; board_build.partitions = default.csv
; board_build.partitions = min_spiffs.csv
; board_build.partitions = no_ota.csv # minimal
board_build.partitions = partitions_st7789.csv
; board_upload.offset_address = 0x90000
board_build.filesystem = littlefs
board_build.embed_txtfiles = 
board_upload.flash_size = 4MB
; board_build.data_dir = data-st7789
build_src_filter = +<*> +<../src-st7789/>
; Force PlatformIO to build in debug mode
build_type = debug
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    ; dvarrel/ESPping @ ^1.0.5
    ; mobizt/ESP Mail Client @ ^3.4.17
    ; mobizt/ReadyMail @ ^0.4.1
    bodmer/TJpg_Decoder @ ^1.1.0
