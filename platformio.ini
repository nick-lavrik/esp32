[env:esp32-c3]
extends = env
board = esp32-c3-devkitm-1
upload_speed = 921600
monitor_filters = esp32_exception_decoder
# Те саме застереження, що й в env:esp32-c6 / env:esp32-c6-lcd096: на C3
# теж USB-Serial/JTAG (не native USB OTG), і DTR/RTS toggle при відкритті
# порту ресетить плату та вішає pio-монітор.
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = qio
board_build.partitions = partitions_c3.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_unflags = ${common.build_unflags}
build_src_filter = +<*> +<../src-esp32-c3/>
# Графічної бібліотеки тут НЕМА свідомо: BOARD_HAS_DISPLAY=0 підключає
# заглушку include/Setup_Headless.h (див. lib/Display/DisplayDriver.hpp), тож ні
# Arduino_GFX, ні TFT_eSPI не потрібні. JPEGDEC лишено тому, що
# src/main.cpp беззастережно тримає глобальний JpegImage; при
# BACKGROUND_IMAGES_COUNT=0 декодер жодного разу не викликається.
lib_deps =
    ; mobizt/ESP Mail Client @ ^3.4.17
    mobizt/ReadyMail @ ^0.4.1
    bitbank2/JPEGDEC @ ^1.8.2
    bblanchon/ArduinoJson
    mlesniew/PicoMQTT @ ^1.3.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
# esp32-c3
build_flags =
    -include src-esp32-c3/environment.h
    ${common.build_flags}
    -D ECOFLOW_MQTT_PROXY_HOST=\"${secrets.ecoflow_proxy_host}\"
    # ЛОКАЛЬНІ LAN-креденшли proxy-listener'а, НЕ облікові дані EcoFlow - ACL
    # на rpi5 дозволяє цьому користувачу лише subscribe на
    # /app/device/property/#, publish заборонено.
    -D ECOFLOW_MQTT_PROXY_USERNAME=\"${secrets.ecoflow_proxy_username}\"
    -D ECOFLOW_MQTT_PROXY_PASSWORD=\"${secrets.ecoflow_proxy_password}\"
