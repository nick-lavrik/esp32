; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
extra_configs = secrets.ini

; --- Спільні налаштування ---
[env]
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
build_flags = -v
    -DWIFI_SSID=\"${secrets.wifi_ssid}\"
    -DWIFI_PASSWORD=\"${secrets.wifi_password}\"

# ESP32-S3 Arduino LVGL WIFI and Bluetooth development board 4.0 inch 480 * 480 
# великий квадратний в корпусі
[env:esp32-4848s040]
upload_port = /dev/ttyUSB0
upload_speed = 921600
platform = espressif32
monitor_filters = esp32_exception_decoder
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags = 
    -DBOARD_HAS_PSRAM
    -DLGFX_USE_V1
    -DBOARD_4848S040
    -DTFT_BL=38
    -DTFT_ROTATION=2
    ; -mfix-esp32-psram-cache-issue
    ; -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<../src-4848s040/>
lib_deps = 
    lovyan03/LovyanGFX@^1.1.16
    tamctec/TAMC_GT911@^1.0.2
    ; lvgl/lvgl@^8.3.11
    ; bodmer/TFT_eSPI
    bodmer/TJpg_Decoder
    bblanchon/ArduinoJson

# ST7789 ESP32 WiFi Bluetooth Development Board 2.8-inch Driver Intelligent Display Color Screen Onboard ESP32-32E Module
# в прозорому корпусі (дві кришки)
[env:esp32-st7789]
upload_port = /dev/ttyUSB1
upload_speed = 921600
platform = espressif32
board = esp32dev
board_build.partitions = default.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = 
board_upload.flash_size = 4MB
; board_build.data_dir = data-st7789
framework = arduino
build_src_filter = +<*> +<../src-st7789/>
; Force PlatformIO to build in debug mode
; build_type = debug
lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    marian-craciunescu/ESP32Ping@^1.7
    bodmer/TJpg_Decoder@^1.1.0
build_flags =
    -include include/Setup_ST7789.h
    -DUSER_SETUP_LOADED=1
    -DBOARD_ST7789=1
    -DST7789_DRIVER=1
    -DTFT_ROTATION=3
    -DTFT_INVERSION_OFF=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=40000000
    -DTFT_RGB_ORDER=TFT_BGR
    -DTOUCH_CS=33
