# -----------------------------------------------------------------------
# [env:ttgo-t1]
# CH9102F - ESP32-TTGO-T1
# LillyGo T-Display (ESP32)
# TENSTAR T-Display ESP32 WiFi And Bluetooth-Compatible Module Development Board 1.14 Inch LCD Control
# type-c, невеличкий екран
# https://www.aliexpress.com/item/1005005970553639.html
#
# TFT Display - 
# Touch - NO
# -----------------------------------------------------------------------
#
#
#
# -*- EspConnect can't connect -*-
#
#
#




#
# Дисплей — JD9853 (172x320), НЕ ST7789, але командно-сумісний з ним у
# ST7789-режимі (офіційна демка Waveshare, moononournation/Arduino_GFX
# issue #693). LovyanGFX і TFT_eSPI (вже в проєкті) не мають драйвера
# JD9853, тому тут — moononournation/Arduino_GFX, обгорнутий у
# TFT_eSPI-сумісний фасад: include/Setup_ArduinoGFX_C6.h (той самий підхід,
# що й Setup_SSD1306_NodeMCU.h для esp8266).
#
# Перший прохід по платі: дисплей + WiFi/NTP/MQTT/SD/serial.
# Touch (AXS5106L) і IMU (QMI8658A, планується для lib/ImuSensor) —
# НЕ підключені в цьому коміті, окрема задача на майбутнє.
#
# ESP32-C6 — RISC-V, одне ядро, БЕЗ PSRAM (на відміну від esp32-4848s040 /
# esp32-s3-lcd147) — тому DISPLAY_SPLIT_COUNT тут високий (аналогічно
# esp32-st7789), значення потребує уточнення на реальному залізі за вільною
# памʼяттю (ESP.getFreeHeap() в рантаймі).
#
# TF-картка — звичайний SPI, ШИНА СПІЛЬНА З ДИСПЛЕЄМ (SCK=1, MOSI=2,
# окремі MISO=3, CS=4) — на відміну від esp32-s3-lcd147 (там SD_MMC).
#
# Піни, TFT_ROTATION і фінальна коректність offset'ів JD9853 потребують
# валідації на реальному пристрої.
# -----------------------------------------------------------------------
[env:esp32-c6]
extends = env
board = esp32-c6-devkitc-1
upload_speed = 921600 # 460800
monitor_filters = esp32_exception_decoder
# ESP32-C6 має USB-Serial/JTAG (не native USB OTG, як на S3) - типова
# проблема на Linux: після ресету плати host-side serial-порт
# "зникає/з'являється" і pio-монітор може зависнути в непереривному
# читанні (навіть kill -9 не допомагає, треба re-plug USB). Вимикаємо
# DTR/RTS toggle при відкритті монітора - основна причина зависань
# на платах з USB-Serial/JTAG (порт має власний ресет-механізм,
# зайвий DTR/RTS тільки заважає).
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = qio
board_build.partitions = partitions_c6.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
build_type = debug
build_unflags = ${common.build_unflags}
build_src_filter = +<*> +<../src-esp32-c6/>
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    ; dvarrel/ESPping @ ^1.0.5
    ; mobizt/ESP Mail Client @ ^3.4.17
    mobizt/ReadyMail @ ^0.4.1
    ; bodmer/TJpg_Decoder @ ^1.1.0
    bitbank2/JPEGDEC @ ^1.8.2
    bblanchon/ArduinoJson
    ; knolleary/PubSubClient @ ^2.8
    mlesniew/PicoMQTT @ ^1.3.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
# esp32-c6
build_flags =
    ; Піни й фіч-прапорці цієї плати - в src-esp32-c6/environment.h. -include
    ; підключає його до КОЖНОГО TU ще до першого рядка джерела (як і -D), тож
    ; зміна цього файлу не чіпає build_flags/сигнатуру збірки інших env.
    -include src-esp32-c6/environment.h
    ${common.build_flags}
    -D ECOFLOW_MQTT_PROXY_HOST=\"${secrets.ecoflow_proxy_host}\"
    -D ECOFLOW_MQTT_PROXY_USERNAME=\"${secrets.ecoflow_proxy_username}\"
    -D ECOFLOW_MQTT_PROXY_PASSWORD=\"${secrets.ecoflow_proxy_password}\"

# -----------------------------------------------------------------------
# ESP32-C6-LCD-0.96
# "ESP32-C6 LCD Development Board 0.96 inch Display 0.96inch Screen ST7789
# 160x80 Mini TV SD-Port QST" (назва товару - ST7789, ОМАНЛИВО, реально
# ST7735S - див. Setup_ST7735_C6_LCD096.h)
# https://www.aliexpress.com/item/1005012568785967.html
#
# Найменша плата серед C6 в проєкті: 4MB flash (не 8MB, як esp32-c6),
# без PSRAM, без touch. Дисплей і SD - на одній SPI-шині (SCK=7/MOSI=6,
# окремі MISO=5(SD)/CS=4(SD)/14(LCD)).
#
# Init-послідовність дисплея, піни і 2Mb littlefs у
# partitions_c6_lcd096.csv - підтверджені тестовим кодом і схемою плати,
# наданими Миколою; TFT_ROTATION/фінальна орієнтація - НЕ перевірені на
# реальному пристрої.
# -----------------------------------------------------------------------
[env:esp32-c6-lcd096]
extends = env
board = esp32-c6-devkitc-1
upload_speed = 921600
monitor_filters = esp32_exception_decoder
# Те саме застереження, що й в env:esp32-c6 - USB-Serial/JTOG на C6,
# DTR/RTS toggle заважає стабільній роботі pio-монітора.
monitor_rts = 0
monitor_dtr = 0
board_build.flash_mode = qio
board_build.partitions = partitions_c6_lcd096.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
# НЕ debug (на відміну від esp32-c6) - на 4MB flash app-розділ лише
# 1.5Mb (див. коментар у partitions_c6_lcd096.csv), debug build з тим
# самим набором бібліотек, що й на esp32-c6 (2Mb app на 8MB flash), може
# не влізти. Перевірити фактичний розмір firmware.bin після build.
build_unflags = ${common.build_unflags}
build_src_filter = +<*> +<../src-esp32-c6-lcd096/>
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.0
    ; bodmer/TFT_eSPI @ ^2.5.43
    ; dvarrel/ESPping @ ^1.0.5
    ; mobizt/ESP Mail Client @ ^3.4.17
    mobizt/ReadyMail @ ^0.4.1
    ; bodmer/TJpg_Decoder @ ^1.1.0
    bitbank2/JPEGDEC @ ^1.8.2
    bblanchon/ArduinoJson
    ; knolleary/PubSubClient @ ^2.8
    mlesniew/PicoMQTT @ ^1.3.0
    mathieucarbou/AsyncTCP @ ^3.3.2
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
# esp32-c6-lcd096
build_flags =
    -include src-esp32-c6-lcd096/environment.h
    ${common.build_flags}
    -D ECOFLOW_MQTT_PROXY_HOST=\"${secrets.ecoflow_proxy_host}\"
    -D ECOFLOW_MQTT_PROXY_USERNAME=\"${secrets.ecoflow_proxy_username}\"
    -D ECOFLOW_MQTT_PROXY_PASSWORD=\"${secrets.ecoflow_proxy_password}\"

