; #define ARDUHAL_LOG_LEVEL_NONE    (0)
; #define ARDUHAL_LOG_LEVEL_ERROR   (1)
; #define ARDUHAL_LOG_LEVEL_WARN    (2)
; #define ARDUHAL_LOG_LEVEL_INFO    (3)
; #define ARDUHAL_LOG_LEVEL_DEBUG   (4)
; #define ARDUHAL_LOG_LEVEL_VERBOSE (5)

[platformio]
extra_configs = secrets.ini
data_dir = data

[common]
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; -I lib/EventDispatcher/
    -D PIO_PIOENV=\"${PIOENV}\"
    -D SYSENV_BOARD_VERSION=\"${sysenv.BOARD_VERSION}\"
    -D WIFI_SSID=\"${secrets.wifi_ssid}\"
    -D WIFI_PASSWORD=\"${secrets.wifi_password}\"
    -D GMAIL_EMAIL=\"${secrets.gmail_email}\"
    -D GMAIL_PASSWORD=\"${secrets.gmail_password}\"
    -D MQTT_HOST=\"${secrets.mqtt_host}\"
    -D MQTT_PORT=${secrets.mqtt_port}
    -D MQTT_CLIENT_ID=\"${secrets.mqtt_client_id}\"
    -D MQTT_USERNAME=\"${secrets.mqtt_username}\"
    -D MQTT_PASSWORD=\"${secrets.mqtt_password}\"
    -D MQTT_LWT_TOPIC=\"${secrets.mqtt_lwt_topic}\"
    -D MQTT_LWT_MSG_ONLINE=\"${secrets.mqtt_lwt_msg_online}\"
    -D MQTT_LWT_MSG_OFFLINE=\"${secrets.mqtt_lwt_msg_offline}\"

# ESP32-S3 (QFN56) - JC3248W535C
# прямоугольний, в чорному корпусі, з дінаміком (поки не в цьому проекті)
# https://spotpear.com/wiki/ESP32-S3-3.5-inch-LCD-Captive-TouchScreen-Display-480x320-Tablet-MP3-Video-Weather-Clock.html
# ffmpeg -i your_video.mp4 -vcodec mjpeg -s 480x320 -r 20 -an boot.mpeg

; --- Спільні налаштування ---
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1
monitor_echo = yes

# ESP32-S3 Arduino LVGL WIFI and Bluetooth development board 4.0 inch 480 * 480 
# великий квадратний в корпусі
# Crystal 40 MHz
# CPU Cores: 2 (Dual)
# Max CPU Frequency: 240 MHz
# Embedded PSRAM: 8MB (AP Memory 3.3 V)
# Flash ID: 0x182085
# Flash Device: 16 MB
#
# CONFIGURATION: https://docs.platformio.org/page/boards/espressif32/esp32-s3-devkitc-1.html
# PLATFORM: Espressif 32 (55.3.39+sha.cbc3349) > Espressif ESP32-S3-DevKitC-1-N8 (8 MB QD, No PSRAM)
# HARDWARE: ESP32S3 240MHz, 320KB RAM, 16MB Flash
#
# Connected to ESP32-S3 on /dev/ttyUSB0:
# Chip type:          ESP32-S3 (QFN56) (revision v0.2)
# Features:           Wi-Fi, BT 5 (LE), Dual Core + LP Core, 240MHz, Embedded PSRAM 8MB (AP_3v3)
# Crystal frequency:  40MHz
# MAC:                8c:bf:ea:0e:d0:10
[env:esp32-4848s040]
extends = env
upload_port = /dev/ttyUSB0
upload_speed = 921600
monitor_filters = esp32_exception_decoder
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
; board_build.partitions = default.csv
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_unflags = ${common.build_unflags}
build_src_filter = +<*> +<../src-4848s040/>
lib_deps = 
    lovyan03/LovyanGFX @ ^1.1.16
    tamctec/TAMC_GT911 @ ^1.0.2
    dvarrel/ESPping @ ^1.0.5
    ; lvgl/lvgl@^8.3.11
    mobizt/ESP Mail Client @ ^3.4.17
    bodmer/TJpg_Decoder
    bblanchon/ArduinoJson
    knolleary/PubSubClient @ ^2.8
build_flags =
    ${common.build_flags}
    -D CONFIG_HEAP_POISONING_COMPREHENSIVE=1
    -D BOARD_HAS_PSRAM=1
    -D LGFX_USE_V1
    -D BOARD_4848S040
    -D BOARD_HAS_DISPLAY=1
    -D BOARD_HAS_TOUCH=1
    -D BOARD_HAS_SD=1

    # esp32-4848s040 - CS=42, SCK=48, MOSI=47, MISO=41
    -D SD_CS=42
    -D SD_MOSI=47
    -D SD_MISO=41
    -D SD_SCK=48
    -D SD_FREQ=4000000

    -D TFT_WIDTH=480
    -D TFT_HEIGHT=480
    -D TFT_BL=38
    -D TFT_ROTATION=2
    -D SPRITE_COLOR_DEPTH=16
    ; -mfix-esp32-psram-cache-issue
    ; -DARDUINO_USB_CDC_ON_BOOT=1
    -D BACKGROUND_IMAGES_COUNT=0
    -D LITTLEFS_BACKGROUND_IMAGE=\"/moon-480x480.jpg\"


; --- Класична LillyGo T-Display (ESP32) ---
# єкран і чіп - на різних сторонах
#
# CONFIGURATION: https://docs.platformio.org/page/boards/espressif32/ttgo-t1.html
# PLATFORM: Espressif 32 (55.3.39+sha.cbc3349) > TTGO T1
# HARDWARE: ESP32 240MHz, 320KB RAM, 4MB Flash
#
# Connected to ESP32 on /dev/ttyACM0:
# Chip type:          ESP32-D0WDQ6 (revision v1.1)
# Features:           Wi-Fi, BT, Dual Core + LP Core, 240MHz, Vref calibration in eFuse, Coding Scheme None
# Crystal frequency:  40MHz
# MAC:                88:13:bf:97:c1:fc
[env:ttgo-t1]
platform = espressif32
framework = arduino
board = ttgo-t1
; upload_speed = 115200
; platform_packages = platformio/tool-esptoolpy@~1.40801.0
upload_port = /dev/ttyACM0
upload_speed = 115200 ; success!
; upload_speed = 230400 ; fail! 230400/460800/921600
monitor_speed = 115200
; board_build.flash_mode = dio ; Баг esptool з XMC-перевіркою на деяких клонах чіпа
build_src_filter = +<*> +<../src-ttgo-t1/>
; lib_ldf_mode = chain
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    dvarrel/ESPping @ ^1.0.5
    bodmer/TJpg_Decoder
    bblanchon/ArduinoJson
    knolleary/PubSubClient @ ^2.8
build_flags = 
    ${common.build_flags}
    -D CONFIG_ESP32_DEFAULT_CPU_FREQ_240=y ; вирішуємо проблему сміття в моніторі
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    -D CGRAM_OFFSET=1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=1
    -D TFT_ROTATION=3
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT3=1
    -D LOAD_FONT4=1
    -D LOAD_FONT5=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_FONT9=1
    -D SPI_FREQUENCY=40000000
    -D TOUCH_CS=0
    ; -D BOOT_BUTTON_PIN=35   # button is tied to GPIO 35 (збоку від USB type-c)
    -D BOOT_BUTTON_PIN=0      # BOOT button is tied to GPIO 0
    -D BOARD_TTGO_T1
    -D BOARD_HAS_DISPLAY=1
    -D BOARD_HAS_TOUCH=0
    -D BOARD_HAS_SD=0
    -D BACKGROUND_IMAGES_COUNT=0
    -D LITTLEFS_BACKGROUND_IMAGE=\"/space-240x135.jpg\"
    -D SPRITE_COLOR_DEPTH=16

# NodeMCU ESP8266 Development Board With 0.96 Inch OLED Display CH340G ESP-12F WiFi Module
# монохромний I2C OLED (SSD1306, 128x64). Повна інтеграція: WiFi/NTP/Ping/MQTT/Gmail/EventDispatcher/TaskController.
# Власний src-esp8266/ (НЕ спільний src/) - src/main.cpp і src/Display.h жорстко зав'язані на
# ESP32-only API (<WiFi.h>, ESP.getChipModel(), TFT_eSPI-спрайт), тому для ESP8266 - окрема реалізація
# з тим самим публічним інтерфейсом Display/wifi/ntp/ping, що й у src/.
# NodeMCU ESP8266 Development Board With 0.96 Inch OLED Display CH340G ESP-12F WiFi Module
# монохромний I2C OLED (SSD1306, 128x64). Спільний src/main.cpp - усі відмінності
# від ESP32 інкапсульовані через #if defined(BOARD_ESP8266) (WiFi/ConfigStorage(NVS)/
# SystemReset/EspPartitionInspector - недоступні на ESP8266 core) та вже наявні
# BOARD_HAS_SD=0 / BOARD_HAS_TOUCH=0 / BOARD_HAS_DISPLAY=1.
#
# CONFIGURATION: https://docs.platformio.org/page/boards/espressif8266/nodemcuv2.html
# PLATFORM: Espressif 8266 (4.2.1) > NodeMCU 1.0 (ESP-12E Module)
# HARDWARE: ESP8266 80MHz, 80KB RAM, 4MB Flash
#
# Chip is ESP8266EX
# Features: WiFi
# Crystal is 26MHz
# MAC: bc:ff:4d:e6:e0:0d
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
board_build.filesystem = littlefs
build_src_filter = +<*> -<EcoFlow/> +<../src-esp8266/>
build_unflags = ${common.build_unflags}
lib_ignore =
    ConfigStorage
    SystemReset
    EspPartitionInspector
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    mobizt/ESP Mail Client @ ^3.4.17
    bodmer/TJpg_Decoder
    bblanchon/ArduinoJson
    knolleary/PubSubClient @ ^2.8
build_flags =
    ${common.build_flags}
    -D BOARD_ESP8266
    -D BOARD_HAS_DISPLAY=1
    -D BOARD_HAS_TOUCH=0
    -D BOARD_HAS_SD=0
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=64
    -D OLED_WIDTH=128
    -D OLED_HEIGHT=64
    -D OLED_RESET_PIN=-1
    -D OLED_I2C_ADDR=0x3C
    -D TFT_ROTATION=0
    -D SPRITE_COLOR_DEPTH=1
    -D BOOT_BUTTON_PIN=0      # The BOOT button is tied to GPIO 0
    
# ST7789 ESP32 WiFi Bluetooth Development Board 2.8-inch Driver Intelligent Display Color Screen Onboard ESP32-32E Module
# в прозорому корпусі (дві кришки)
# ESP32-D0WD-V3 (revision 3)
# Crystal 26 MHz
# CPU Cores: 2 (Dual)
# Max CPU Frequency: 240 MHz
# Flash ID: 0x16405E
# Flash Device : 4 MB
#
# CONFIGURATION: https://docs.platformio.org/page/boards/espressif32/esp32dev.html
# PLATFORM: Espressif 32 (55.3.39+sha.cbc3349) > Espressif ESP32 Dev Module
# HARDWARE: ESP32 240MHz, 320KB RAM, 4MB Flash
#
# Connected to ESP32 on /dev/ttyUSB1:
# Chip type:          ESP32-D0WD-V3 (revision v3.1)
# Features:           Wi-Fi, BT, Dual Core + LP Core, 240MHz, Vref calibration in eFuse, Coding Scheme None
# Crystal frequency:  40MHz
# MAC:                b4:bf:e9:de:1d:58
[env:esp32-st7789]
extends = env
upload_port = /dev/ttyUSB0
upload_speed = 921600
; upload_speed = 115200
board = esp32dev
; board_build.partitions = default.csv
; board_build.partitions = min_spiffs.csv
; board_build.partitions = no_ota.csv # minimal
board_build.partitions = partitions_st7789.csv
; board_upload.offset_address = 0x90000
board_build.filesystem = littlefs
board_build.embed_txtfiles = 
board_upload.flash_size = 4MB
; board_build.data_dir = data-st7789
build_src_filter = +<*> +<../src-st7789/>
; Force PlatformIO to build in debug mode
; build_type = debug
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    dvarrel/ESPping @ ^1.0.5
    mobizt/ESP Mail Client @ ^3.4.17
    bodmer/TJpg_Decoder @ ^1.1.0
    bblanchon/ArduinoJson
    knolleary/PubSubClient @ ^2.8
build_unflags = ${common.build_unflags}
build_flags =
    -include include/Setup_ST7789.h
    ${common.build_flags}
    -Os
    ; -Wl,-Map,${platformio.build_dir}/${this.__env__}/firmware.map
    -Wl,-Map,firmware.map
    ; -D CONFIG_BT_ENABLED=0
    -D CORE_DEBUG_LEVEL=2
    -D USER_SETUP_LOADED=1
    -D BOARD_ST7789=1
    -D BOARD_HAS_DISPLAY=1
    -D BOARD_HAS_TOUCH=1
    -D BOARD_HAS_SD=1
    -D ST7789_DRIVER=1

    -D SPRITE_COLOR_DEPTH=8

    -D USE_HSPI_PORT=1      ; принудительно заставляем дисплей использовать 

    -D TFT_ROTATION=3
    -D TFT_INVERSION_OFF=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=1

    # // esp32-st7789 - CS=5, SCK=18, MISO=19, MOSI=23, freq=400000
    -D SD_CS=5
    -D SD_MOSI=23
    -D SD_MISO=19
    -D SD_SCK=18
    ; -D SD_FREQ=400000 # success
    ; -D SD_FREQ=800000 # success
    -D SD_FREQ=400000

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D SPI_FREQUENCY=40000000 # 20000000 / 27000000 / 40000000
    -D TFT_RGB_ORDER=TFT_BGR
    -D TOUCH_CS=33
    -D LIGHT_SENSOR_PIN=34
    -D BOOT_BUTTON_PIN=0      # The BOOT button is tied to GPIO 0
    -D BACKGROUND_IMAGES_COUNT=1
