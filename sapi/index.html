<script>
(() => {
  'use strict';

  // Пре-альфа allowlist - той самий, що в src/main.cpp (kJsonApi*). Коли
  // з'явиться discovery-маніфест (фаза 2), цей список замінить сам себе на
  // дані з брокера, а не буде жорстко зашитим тут.
  const COMMANDS = ['system-info', 'wifi-status', 'ecoflow-status', 'mqtt-status'];
  const AUTO_BASE_MS = 5000;
  const AUTO_BACKOFF_MAX = 8; // множник база: 5с -> 40с максимум при busy
  const LOG_MAX_LINES = 500;
  const ECO_PARAMS_TIMEOUT_MS = 10000; // ecoflow-params/<sn> - явний timeout, а не вічний спінер
  const COMMANDS_LIST_TIMEOUT_MS = 10000; // commands-list - той самий підхід, що ecoflow-params
  const CMD_REQUEST_TIMEOUT_MS = 10000; // panels[cmd] - той самий підхід, без нього getInFlightSlot() лишався б зайнятим навічно, якщо пристрій не відповість

  // SAPI_MAX_INFLIGHT - скільки запитів панелей COMMANDS може одночасно
  // чекати відповіді пристрою. Це і є фактичний троттлінг - НЕ дзеркало
  // COMMAND_QUEUE_SLOTS у environment.h плати: та ємність навмисно більша
  // за це число там, де вистачає RAM (лишає запас на serial/cron/портал -
  // докладніше, docs/mqtt-web-handoff.md, "SAPI: обмеження одночасних
  // запитів"), тому пряме дзеркалення тут було б неправильним. Число тут
  // захардкоджене, не згенероване build-скриптом (на відміну від
  // sapi/revision.js): ця сторінка - один статичний файл, під'єднується в
  // рантаймі до довільної плати, а не збирається per-env, і сама не читає
  // COMMAND_QUEUE_SLOTS жодної з них.
  //
  // Пул навмисно НЕ покриває ecoflow-params/commands-list/command-run:
  // це поодинокі, керовані користувачем запити (клік по кнопці, Run), а не
  // джерело сплеску - на відміну від COMMANDS, які всі летять разом на
  // конекті й на кожному Auto-тіку (докладніше - docs/mqtt-web-handoff.md,
  // "SAPI: обмеження одночасних запитів"). Обидва вже мають власний
  // timeout (ECO_PARAMS_TIMEOUT_MS/COMMANDS_LIST_TIMEOUT_MS) і власну
  // обробку "busy"/переповненої черги - гіршого стану, ніж "рідкісний busy",
  // це не додає.
  const SAPI_MAX_INFLIGHT = 2;
  let sapiInFlightCount = 0;
  const sapiInFlightQueue = []; // FIFO відкладених публікацій (thunків), понад SAPI_MAX_INFLIGHT

  function withInFlightSlot(publish) {
    if (sapiInFlightCount < SAPI_MAX_INFLIGHT) {
      sapiInFlightCount++;
      publish();
    } else {
      sapiInFlightQueue.push(publish);
    }
  }

  function releaseInFlightSlot() {
    if (sapiInFlightCount > 0) sapiInFlightCount--;
    const next = sapiInFlightQueue.shift();
    if (next) {
      sapiInFlightCount++;
      next();
    }
  }
  // command/<client-id> (докладна довільна команда, docs/mqtt-topics.md) не несе кореляційного
  // "id" у відповіді - на відміну від devices/.../api/<cmd>, це текстовий канал, спільний з
  // serial/cron/іншими MQTT-клієнтами (docs/mqtt-web-handoff.md, "чи command/<id> теж переїжджає
  // під devices/" - ні, свідомо). Тому "команда завершилась" тут - евристика, не факт: тиша по
  // reply-топіку довше CMD_RUN_SILENCE_MS - той самий компроміс, що вже прийнятий для
  // ecoflow-params (ECO_PARAMS_TIMEOUT_MS вище), лише для потоку порцій, а не одної відповіді.
  const CMD_RUN_SILENCE_MS = 2000;
  const CMD_RUN_HARD_TIMEOUT_MS = 60000; // страховка - як CAPTURE_TIMEOUT_MS на порталі

  const STORAGE_KEY = 'sapi.connection.v1';

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  // localStorage - лише зручність цього браузера (форма підключення "як
  // минулого разу"), не критичний стан: обгортаємо в try/catch, бо приватні
  // вікна/заблоковане сховище кидають виняток, а не повертають null.
  function loadConn() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch (e) {
      return {};
    }
  }
  function saveConn(conn) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conn));
    } catch (e) { /* ігнор - форма й так лишається заповненою в DOM */ }
  }
  function forgetConn() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) { /* нічого критичного */ }
  }

  // Shortcuts вкладки Commands - на відміну від порталу (NVS одним ключем на
  // ВСІХ клієнтів пристрою), тут нема серверного сховища, до якого пише
  // браузер: SAPI не має жодного HTTP/flash-запису, лише MQTT-запити з
  // фіксованого allowlist (command/<id> виконує, але нічого не зберігає).
  // Тому shortcuts - суто зручність ЦЬОГО браузера, localStorage, як і форма
  // підключення вище (STORAGE_KEY) - не переживають перехід на інший
  // комп'ютер, і це прийнятно для того самого пре-альфа духу.
  const CMD_SHORTCUTS_KEY = 'sapi.commandShortcuts.v1';
  function loadCmdShortcuts() {
    try {
      const list = JSON.parse(localStorage.getItem(CMD_SHORTCUTS_KEY) || '[]');
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }
  function saveCmdShortcuts(list) {
    try {
      localStorage.setItem(CMD_SHORTCUTS_KEY, JSON.stringify(list));
    } catch (e) { /* нічого критичного - список лишається в поточному DOM-стані */ }
  }

  // Персист UI-чекбоксів/перемикачів сторінки (ПРАВИЛО НА МАЙБУТНЄ: якщо
  // з'являється контрол, що керує ВИГЛЯДОМ/поведінкою сторінки - будь-який
  // чекбокс, перемикач, збережений порядок тощо - він має пережити
  // refresh і re-connect, а не скидатись до дефолту щоразу). Один спільний
  // ключ (не по одному localStorage-ключу на кожен контрол, як раніше було
  // для "Newest first" саме собою) - новий контрол просто додає своє поле в
  // той самий об'єкт, без нового STORAGE_KEY і без правок тут.
  //
  // Пишемо ОДРАЗУ на зміну (saveUiToggle нижче, викликається з кожного
  // change-обробника). Читаємо - НЕ одразу при завантаженні сторінки, а
  // саме при connected (applyPersistedToggles(), викликається з
  // client.on('connect') нижче): для "Auto" це єдиний момент, коли
  // відновлення взагалі має сенс (requestCmd()/scheduleAuto() всередині
  // change-обробника нічого не зроблять без живого client) - тому й решта
  // контролів (Newest first, Pause) читаються в той самий момент, а не
  // раніше, заради ОДНОГО правила для всіх, а не для кожного свого часу
  // відновлення.
  const UI_TOGGLES_KEY = 'sapi.uiToggles.v1';
  function loadUiToggles() {
    try {
      return JSON.parse(localStorage.getItem(UI_TOGGLES_KEY) || '{}');
    } catch (e) {
      return {};
    }
  }
  function saveUiToggle(key, value) {
    try {
      const all = loadUiToggles();
      all[key] = value;
      localStorage.setItem(UI_TOGGLES_KEY, JSON.stringify(all));
    } catch (e) { /* нічого критичного - контрол лишається в поточному DOM-стані */ }
  }
  // Будь-який <input type="checkbox" data-persist="..."> - автоматично: за
  // ключ править сам data-persist (унікальний, тому кілька контролів не
  // затирають одне одного в тому самому об'єкті). Новий чекбокс у
  // майбутньому - лише додати data-persist у розмітці (чи виставити його
  // програмно, як autoToggle.dataset.persist нижче) - без правок цієї функції.
  //
  // ФУНКЦІЯ, не одразу виконаний цикл: .auto-toggle отримує свій
  // data-persist ПРОГРАМНО, у циклі створення панелей (нижче за файлом,
  // ще не виконаний у цій точці скрипта) - querySelectorAll() тут одразу
  // впіймав би лише "Newest first" (data-persist у статичній розмітці) і
  // жоден .auto-toggle, бо в них атрибута ще нема. Викликається explicit
  // одним рядком одразу ПІСЛЯ циклу створення панелей нижче.
  function wireAllPersistedCheckboxes() {
    for (const el of $$('input[type="checkbox"][data-persist]')) {
      el.addEventListener('change', () => saveUiToggle(el.dataset.persist, el.checked));
    }
  }
  // Pause - кнопка, не чекбокс (розділ нижче, "Log pause/resume"), тому не
  // підхоплюється циклом вище - той самий ключ у тому самому об'єкті,
  // записується/читається окремим викликом saveUiToggle()/loadUiToggles()
  // поруч із setLogPaused() (визначена нижче, після #log-newest-first).
  function applyPersistedToggles() {
    const saved = loadUiToggles();
    for (const el of $$('input[type="checkbox"][data-persist]')) {
      const key = el.dataset.persist;
      if (key in saved && el.checked !== saved[key]) {
        el.checked = saved[key];
        // dispatchEvent, не пряме присвоєння - той самий change-обробник, що
        // й на ручний клік, сам застосовує ефект (перемальовка порядку логу,
        // requestCmd()+scheduleAuto() для "Auto") - другого місця з тією
        // самою логікою не заводимо (DRY).
        el.dispatchEvent(new Event('change'));
      }
    }
    if ('log-paused' in saved) setLogPaused(saved['log-paused']);
  }

  function readForm() {
    return {
      host: $('#f-host').value.trim(),
      port: $('#f-port').value.trim() || '9001',
      prefix: $('#f-prefix').value.trim() || 'mykola-lavryk',
      username: $('#f-user').value.trim(),
      password: $('#f-pass').value,
      clientId: $('#f-client').value.trim(),
      autoLogin: $('#f-autologin').checked,
    };
  }
  function fillForm(conn) {
    $('#f-host').value = conn.host || '';
    $('#f-port').value = conn.port || '9001';
    $('#f-prefix').value = conn.prefix || 'mykola-lavryk';
    $('#f-user').value = conn.username || '';
    $('#f-pass').value = conn.password || '';
    $('#f-client').value = conn.clientId || '';
    // Дефолт - вимкнено: автоконект без явної згоди користувача - це те, що
    // могло б непомітно з'єднатись із чужим брокером на чужому Wi-Fi
    // (ноутбук з локальним файлом сторінки в кишені). Увімкнено лише якщо
    // користувач сам поставив галочку минулого разу (autoLogin===true).
    $('#f-autologin').checked = conn.autoLogin === true;
  }
  // Чекбокс autoLogin зберігається одразу на зміну (merge в збережений
  // об'єкт, не перезапис усієї форми) - незалежно від того, чи користувач
  // потім натисне Connect, Disconnect, чи взагалі нічого. Раніше значення
  // зберігалось лише всередині connect() (readForm() там же) - тому знята
  // під час перегляду попапу галочка губилась на Disconnect, який форму не
  // читав узагалі.
  $('#f-autologin').addEventListener('change', () => {
    const conn = loadConn();
    conn.autoLogin = $('#f-autologin').checked;
    saveConn(conn);
  });

  fillForm(loadConn());

  // --- лог (вкладка Log) ---
  // Один DOM-рядок на подію (не textContent-блоб, як було раніше) -
  // time/dir/topic/payload у grid-колонках з ellipsis, тому подія завжди
  // лишається одним рядком, навіть коли payload - кілька КБ JSON
  // (system-info). Pretty-друк JSON - лише по кліку на рядок (`has-json`).
  //
  // Запит і відповідь з тим самим `id` (кореляція SAPI, docs/
  // mqtt-web-handoff.md, "Погоджені рішення фази 1") зводяться в ОДИН
  // рядок, а не два: `pendingRequests` тримає щойно залогований запит, поки
  // не прийде відповідь із тим самим id (mergeReply() дописує її в ТОЙ
  // САМИЙ рядок) або поки рядок не витіснеться зі старості
  // (evictOldestRow() прибирає його з мапи теж - інакше вона росла б без
  // обмеження на пристрої, що ніколи не відповідає).
  const DIR_LABEL = { out: '>', in: '<', info: 'i', err: '!', io: '⇄' };
  // logRows - завжди хронологічний порядок (push = найновіший в кінці),
  // незалежно від того, як його показано - "порядок зберігання" і "порядок
  // показу" свідомо розведені: evictOldestRow() (найстаріший - завжди
  // logRows[0]) і кореляція id в pendingRequests не залежать від чекбокса
  // "Newest first" нижче, лише DOM-вставка (logEvent) на нього зважає.
  const logRows = [];
  const pendingRequests = new Map(); // id -> рядок запиту, що ще чекає на reply
  // id -> рядок, для якого reply вже прийшов і змапився. Тримаємо його й
  // ПІСЛЯ merge (доки рядок не витіснеться зі старості, evictOldestRow()
  // нижче) - повторна доставка того самого reply (трапляється після
  // reconnect, якщо брокер не чистить стару підписку - той самий id, той
  // самий вміст) інакше не знаходить збігу в pendingRequests (він уже
  // видалений) і показувалась би як "невідомий" рядок з дублем даних, які
  // насправді вже показані змапленими вище.
  const answeredRows = new Map();

  // Дефолт - вгору (checked у розмітці нема, але JS-стан і чекбокс
  // синхронізовані рядком нижче): сторінка сама росте (без внутрішнього
  // скролу #log, розділ вище), тож найновіший рядок одразу видно, не
  // гортаючи вниз через екрани вже накопиченого логу. Персист - НЕ окремий
  // ключ (як було) - `data-persist="newest-first"` у розмітці, той самий
  // спільний механізм, що описаний вище ("Персист UI-чекбоксів"):
  // відновлюється при connected (applyPersistedToggles()), не тут.
  let logNewestFirst = true;
  const logOrderCheckbox = $('#log-newest-first');
  logOrderCheckbox.checked = logNewestFirst;
  logOrderCheckbox.addEventListener('change', () => {
    logNewestFirst = logOrderCheckbox.checked;
    // Перевпорядкувати вже наявні рядки теж, не лише майбутні - append() з
    // уже прикріпленими вузлами ПЕРЕСУВАЄ їх (Node лишається єдиним в DOM),
    // повторного створення рядків не треба.
    const ordered = logNewestFirst ? [...logRows].reverse() : logRows;
    $('#log').append(...ordered);
  });

  // Pause/resume ЛИШЕ показу логу, не самого MQTT-трафіку: підписки й
  // request/reply (renderReply(), System-панель) працюють незалежно від
  // цього прапорця - client.on('message') і далі викликає обробку команд,
  // логу торкається лише сам logEvent() нижче. Події під час паузи
  // ПРОПУСКАЮТЬСЯ, не буферизуються - той самий принцип, що й для решти
  // логів проєкту (CLAUDE.md - "лог можна губити, команду - ні"): показати
  // назад усе, що трапилось "поки дивився", ускладнило б і код, і сприйняття
  // (розрив у часі рядків був би непомітним), а сама мета паузи - просто
  // зафіксувати вигляд на екрані на хвилину, не архів.
  let logPaused = false;
  const logPauseBtn = $('#btn-log-pause');
  // Окрема функція (не лише інлайн у click) - той самий сеттер викликає й
  // клік користувача, і відновлення при connected (applyPersistedToggles()
  // вище, "Персист UI-чекбоксів") - друге місце з тією самою логікою
  // (текст/клас кнопки) не заводимо (DRY).
  function setLogPaused(paused) {
    logPaused = paused;
    logPauseBtn.textContent = logPaused ? 'Resume' : 'Pause';
    logPauseBtn.classList.toggle('paused', logPaused);
  }
  logPauseBtn.addEventListener('click', () => {
    setLogPaused(!logPaused);
    saveUiToggle('log-paused', logPaused);
  });

  function prettyBlock(rawText) {
    const pre = document.createElement('pre');
    try {
      const v = JSON.parse(rawText);
      pre.textContent = (v && typeof v === 'object') ? JSON.stringify(v, null, 2) : rawText;
    } catch (e) {
      pre.textContent = rawText; // не JSON (heartbeat тощо) - як є
    }
    return pre;
  }
  function prettyLabeled(label, timeStr, rawText) {
    const frag = document.createDocumentFragment();
    const lab = document.createElement('div');
    lab.className = 'log-pretty-label';
    lab.textContent = `${label} · ${timeStr}`;
    frag.appendChild(lab);
    frag.appendChild(prettyBlock(rawText));
    return frag;
  }

  // Ручка зміни висоти .log-pretty - Pointer Events, не нативний CSS
  // `resize` (той на iOS Safari не працює тачем узагалі). setPointerCapture
  // прив'язує подальші move/up до САМОЇ ручки, незалежно від того, куди
  // фізично зʼїхав палець/курсор - document-рівневих слухачів не треба.
  // Стартова висота - поточна відрендерена (getBoundingClientRect), а не
  // CSS max-height - працює однаково, чи вміст був "своєю" висотою, чи вже
  // раз розтягнутий користувачем раніше. maxTotal - висота, за якою body
  // вже показує ввесь вміст без власного скролу (body.scrollHeight) - ручка
  // тепер overlay (CSS, position:absolute), не власний flex-рядок, тому
  // додавати її висоту зверху не треба (padding-bottom body вже несе запас
  // під неї). Рахується ОДИН раз на pointerdown (не на кожен pointermove -
  // зайвий reflow), далі drag просто клемпиться нею - розтягнути блок
  // більше, ніж є реального вмісту, не можна.
  function attachResizeHandle(pretty, body) {
    const handle = document.createElement('div');
    handle.className = 'log-pretty-resize';
    handle.title = 'потягнути - змінити висоту блока';
    let startY = 0;
    let startH = 0;
    let maxTotal = Infinity;
    handle.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); // не тягнути виділення тексту під час драгу
      handle.setPointerCapture(ev.pointerId);
      startY = ev.clientY;
      startH = pretty.getBoundingClientRect().height;
      maxTotal = body.scrollHeight;
      handle.classList.add('dragging');
    });
    handle.addEventListener('pointermove', (ev) => {
      if (!handle.classList.contains('dragging')) return;
      pretty.style.maxHeight = 'none'; // інакше CSS max-height:320px ріже ріст
      const h = Math.max(60, startH + (ev.clientY - startY));
      pretty.style.height = Math.min(h, maxTotal) + 'px';
    });
    handle.addEventListener('pointerup', (ev) => {
      handle.classList.remove('dragging');
      handle.releasePointerCapture(ev.pointerId);
    });
    pretty.appendChild(handle);
  }
  // Спільний шлях наповнення .log-pretty (одиночне повідомлення й
  // mergeReply) - завжди чистить і заново кладе вміст у .log-pretty-body +
  // ручку одним викликом, щоб жодне місце не забуло причепити ручку після
  // innerHTML=''. Body - окремий скрольований елемент (не сам .log-pretty) -
  // саме це розводить вміст і ручку по різних flex-дітях (CSS вище).
  function setPrettyContent(pretty, ...nodes) {
    pretty.innerHTML = '';
    const body = document.createElement('div');
    body.className = 'log-pretty-body';
    for (const n of nodes) body.appendChild(n);
    pretty.appendChild(body);
    attachResizeHandle(pretty, body);
  }

  function evictOldestRow() {
    const old = logRows.shift();
    if (old._reqId !== undefined && pendingRequests.get(old._reqId) === old) {
      pendingRequests.delete(old._reqId);
    }
    if (old._reqId !== undefined && answeredRows.get(old._reqId) === old) {
      answeredRows.delete(old._reqId);
    }
    old.remove();
  }

  function mergeReply(reqRow, replyTime, replyRaw, replyParsed) {
    reqRow.classList.remove('dir-out');
    reqRow.classList.add('dir-io', replyParsed.ok === false ? 'reply-err' : 'reply-ok');

    const line = $('.log-line', reqRow);
    const dirEl = $('.log-dir', line);
    dirEl.className = 'log-dir dir-io';
    dirEl.textContent = DIR_LABEL.io;

    const dtMs = Math.round(performance.now() - (reqRow._reqT0 || performance.now()));
    const statusText = replyParsed.ok === false ? `error: ${replyParsed.error || '?'}` : 'ok';
    $('.log-payload', line).textContent = `id ${replyParsed.id} · ${statusText} · ${dtMs} ms`;

    // Pretty з одного повідомлення (запиту, залогованого раніше) стає
    // pretty з ДВОХ підписаних частин - request/reply - у тому самому
    // елементі, той самий click-toggle (line нижче), що вже навішаний.
    const pretty = $('.log-pretty', reqRow);
    setPrettyContent(pretty,
      prettyLabeled('→ request', reqRow._reqTime, reqRow._reqRaw),
      prettyLabeled('← reply', replyTime, replyRaw));
  }

  // Повторна доставка id, для якого reply вже змаплено (answeredRows) -
  // дописується в ТОЙ САМИЙ рядок (лічильник у payload, ще один підписаний
  // pretty-блок), а не заводить новий "невідомий" рядок з тим самим вмістом.
  function appendDuplicateReply(row, replyTime, replyRaw, replyParsed) {
    row._dupCount = (row._dupCount || 1) + 1;
    const line = $('.log-line', row);
    const statusText = replyParsed.ok === false ? `error: ${replyParsed.error || '?'}` : 'ok';
    $('.log-payload', line).textContent = `id ${replyParsed.id} · ${statusText} · ×${row._dupCount} delivered`;
    const body = $('.log-pretty-body', $('.log-pretty', row));
    body.appendChild(prettyLabeled(`← reply (duplicate #${row._dupCount})`, replyTime, replyRaw));
  }

  function logEvent(dir, topic, payloadText, note) {
    if (logPaused) return; // показ призупинено - подія не записується (не буферизується на потім)
    const el = $('#log');
    const t = new Date().toLocaleTimeString();
    const raw = payloadText != null ? payloadText : (note || '');

    let parsed = null;
    if (payloadText != null) {
      try {
        const v = JSON.parse(payloadText);
        if (v && typeof v === 'object') parsed = v;
      } catch (e) { /* не JSON - heartbeat тощо, лишається простим текстом */ }
    }

    if (dir === 'in' && parsed && parsed.id !== undefined && pendingRequests.has(parsed.id)) {
      const reqRow = pendingRequests.get(parsed.id);
      pendingRequests.delete(parsed.id);
      mergeReply(reqRow, t, raw, parsed);
      answeredRows.set(parsed.id, reqRow);
      return;
    }

    if (dir === 'in' && parsed && parsed.id !== undefined && answeredRows.has(parsed.id)) {
      appendDuplicateReply(answeredRows.get(parsed.id), t, raw, parsed);
      return;
    }

    const row = document.createElement('div');
    row.className = 'log-row dir-' + dir + (parsed ? ' has-json' : '');

    // shortTopic() ховає повторюваний devices/<client-id>-префікс за
    // "<client-id>" (розділ нижче, біля reqTopic/replyTopic) - повний топік
    // лишається в title (hover), нічого не втрачено, лише не в кожному рядку.
    const topicShort = topic ? shortTopic(topic) : '';
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML =
      `<span class="log-expand">${parsed ? '▸' : ''}</span>` +
      `<span class="log-t">${t}</span>` +
      `<span class="log-dir dir-${dir}">${DIR_LABEL[dir] || '?'}</span>` +
      `<span class="log-topic"${topic ? ` title="${esc(topic)}"` : ''}>${esc(topicShort)}</span>` +
      `<span class="log-payload">${esc(raw)}</span>`;
    row.appendChild(line);

    if (parsed) {
      const pretty = document.createElement('div');
      pretty.className = 'log-pretty';
      pretty.hidden = true;
      setPrettyContent(pretty, prettyBlock(raw));
      row.appendChild(pretty);
      line.addEventListener('click', () => {
        pretty.hidden = !pretty.hidden;
        $('.log-expand', line).textContent = pretty.hidden ? '▸' : '▾';
      });
    }

    if (dir === 'out' && parsed && parsed.id !== undefined) {
      row._reqId = parsed.id;
      row._reqTime = t;
      row._reqRaw = raw;
      row._reqT0 = performance.now();
      pendingRequests.set(parsed.id, row);
    }

    // Вставка - за поточним порядком показу; logRows.push() лишається
    // хронологічним завжди (коментар при оголошенні logRows вище).
    if (logNewestFirst) el.insertBefore(row, el.firstChild);
    else el.appendChild(row);
    logRows.push(row);
    if (logRows.length > LOG_MAX_LINES) evictOldestRow();
  }

  // --- вкладки (system-info/wifi-status/ecoflow-status/log) - видимі й
  // перемикаються незалежно від стану з'єднання, той самий каркас, що й у
  // порталі (nav button.active / section.active), а не дві різні "сторінки"
  // до і після конекту. ---
  const tabButtons = $$('nav button');
  const tabSections = $$('main > section');
  function activateTab(name) {
    for (const b of tabButtons) b.classList.toggle('active', b.dataset.tab === name);
    for (const s of tabSections) s.classList.toggle('active', s.dataset.tab === name);
  }
  for (const b of tabButtons) b.addEventListener('click', () => activateTab(b.dataset.tab));

  // --- стан панелей команд ---
  const panels = {};
  for (const cmd of COMMANDS) {
    const el = $(`.cmd-section[data-cmd="${cmd}"]`);
    panels[cmd] = {
      el,
      out: $('.out', el),
      status: $('.cmd-status', el),
      refreshBtn: $('.btn-refresh', el),
      autoToggle: $('.auto-toggle', el),
      pendingId: null,
      backoffFactor: 1,
      timer: null,
      inFlightTimeoutTimer: null, // CMD_REQUEST_TIMEOUT_MS - звільняє слот withInFlightSlot(), якщо пристрій не відповів
    };
    // data-persist - програмно, не в статичній розмітці: ключ ("auto-<cmd>")
    // іде з того самого COMMANDS, тому 5-та команда в майбутньому підхопить
    // персист автоматично, без правки розмітки під неї (розділ "Персист
    // UI-чекбоксів" нижче).
    panels[cmd].autoToggle.dataset.persist = 'auto-' + cmd;
  }
  // Саме тут, не раніше - усі data-persist (і статичні, і щойно виставлені
  // programmatically рядком вище) уже на місці, wireAllPersistedCheckboxes()
  // (розділ "Персист UI-чекбоксів" вище) підписує їх усі одним проходом.
  wireAllPersistedCheckboxes();

  function setPanelStatus(cmd, text, cls) {
    const p = panels[cmd];
    p.status.textContent = text;
    p.status.className = 'cmd-status' + (cls ? ' ' + cls : '');
  }

  // --- EcoFlow "Raw parameters" drill-down (devices/<client-id>/api/
  // ecoflow-params/<sn>, docs/mqtt-topics.md) - окремий request/reply поза
  // panels[cmd]: ecoflow-params/<sn> не одна з чотирьох команд COMMANDS
  // (вкладок), а per-device підзапит УСЕРЕДИНІ вкладки ecoflow-status. Своя
  // назва команди (не суфікс на ecoflow-status) - навмисно: повертає інше
  // (сирі params, не статус), і жодна відповідь ecoflow-status тепер не
  // може випадково збігтись із цим префіксом (був саме такий баг з
  // "порожнім sn", коли тут стояв reqTopic('ecoflow-status')).
  // pendingEcoParamsIds: серійник -> {id, timeoutTimer} очікуваної відповіді
  // - той самий принцип, що panels[cmd].pendingId, лише поза panels (ключ -
  // серійник, не ім'я команди) і з власним timeoutTimer (нижче) - той
  // самий контракт, що job()/finally на порталі: спінер (.busy) не лишається
  // вічним, якщо пристрій ніколи не відповість (offline, підписку відхилено).
  const pendingEcoParamsIds = new Map();
  // reqTopic() - оголошена нижче (розділ "топіки"), function-декларація
  // хойститься в межах цього <script>, тому виклик звідси безпечний.
  function ecoParamsReqTopic(sn) { return `${reqTopic('ecoflow-params')}/${sn}`; }

  // details.eco-params[data-sn] - обидва стани (кнопка "Load"/"Refresh")
  // лежать у ньому, тож .busy на самому details (а не лише на кнопці)
  // притлумлює й таблицю під ним, не тільки контрол - той самий принцип, що
  // portal's #wifi-form-block/#scan-block (CSS вище, ".busy - буквальний
  // порт з порталу").
  function ecoParamsDetailsEl(sn) {
    return panels['ecoflow-status'].out.querySelector(`.eco-params[data-sn="${CSS.escape(sn)}"]`);
  }
  function setEcoParamsBusy(sn, busy) {
    const details = ecoParamsDetailsEl(sn);
    if (!details) return; // перемальовано/закрито до відповіді - нема на чому показувати спінер, і не треба
    details.classList.toggle('busy', busy);
    const btn = details.querySelector('.eco-params-btn');
    if (btn) btn.disabled = busy; // той самий "if ('disabled' in el)" з setBusy() порталу, тут - завжди кнопка
  }

  function requestEcoflowDeviceParams(sn) {
    if (!client || !client.connected) return;
    const id = Math.floor(Math.random() * 1e9);
    // Попередній необроблений запит на той самий sn (подвійний клік, ручний
    // Refresh поки чекали timeout) - його таймер більше нікому не потрібен,
    // інакше стрельнув би пізніше й міг би скинути busy вже ПІСЛЯ нового
    // запиту, що щойно стартував.
    const prev = pendingEcoParamsIds.get(sn);
    if (prev) clearTimeout(prev.timeoutTimer);
    const timeoutTimer = setTimeout(() => {
      pendingEcoParamsIds.delete(sn);
      setEcoParamsBusy(sn, false);
      logEvent('err', ecoParamsReqTopic(sn), null, `timeout ${ECO_PARAMS_TIMEOUT_MS / 1000}s - no reply`);
    }, ECO_PARAMS_TIMEOUT_MS);
    pendingEcoParamsIds.set(sn, { id, timeoutTimer });
    setEcoParamsBusy(sn, true);
    const topic = ecoParamsReqTopic(sn);
    const payload = JSON.stringify({ id });
    client.publish(topic, payload);
    logEvent('out', topic, payload);
  }

  // Періодичний ecoflow-status (auto-refresh) присилає СВІЖИЙ агрегат БЕЗ
  // "params" (агрегат їх свідомо не несе, розділ "Провайдер ≠ форматер",
  // docs/mqtt-web-handoff.md) - без цього злиття кожен наступний тик стирав
  // би раніше довантажені raw parameters, і кнопка "Load" виглядала б так,
  // ніби нічого не запам'ятала.
  function mergeEcoflowParams(newData) {
    if (!lastEcoflowStatus || !Array.isArray(newData.devices)) return;
    const bySerial = new Map(lastEcoflowStatus.devices.map((d) => [d.serialNumber, d]));
    for (const d of newData.devices) {
      const prev = bySerial.get(d.serialNumber);
      if (prev && prev.params) d.params = prev.params;
    }
  }

  // Той самий патерн, що renderSystemPanel() (System-картка EcoFlow): відкриті
  // <details> сканується з DOM ПЕРЕД перемальовкою (innerHTML= знищує вузли,
  // "open" сам по собі не переживає перемальовку).
  function renderEcoflowPanel() {
    if (!lastEcoflowStatus) return;
    const openParamsSerials = new Set(
      Array.from(panels['ecoflow-status'].out.querySelectorAll('.eco-params[open]')).map((el) => el.dataset.sn));
    // "open" на #ecoflow-devices-wrap теж не переживає innerHTML= - той самий
    // скан ПЕРЕД перемальовкою, що openParamsSerials вище. Немає вузла ще
    // (перший рендер) - лишається дефолтне "open" з render.js.
    const devicesWrap = panels['ecoflow-status'].out.querySelector('#ecoflow-devices-wrap');
    const devicesOpen = devicesWrap ? devicesWrap.open : true;
    panels['ecoflow-status'].out.innerHTML =
      buildPanelHtml('ecoflow-status', lastEcoflowStatus, { openParamsSerials, devicesOpen });
  }

  // Делегування - картки пристроїв перемальовуються цілком на кожен reply
  // (innerHTML=), кнопка ".eco-params-btn" щоразу нова: слухач на статичному
  // .out (переживає перемальовку), не на самій кнопці.
  panels['ecoflow-status'].out.addEventListener('click', (ev) => {
    const btn = ev.target.closest('.eco-params-btn');
    if (!btn) return;
    requestEcoflowDeviceParams(btn.dataset.sn);
  });

  // Рендер-функції (esc/kv/RENDERERS/...) підключені окремим <script
  // src="render.js"> вище - той самий код прогонить headless test/render.test.js
  // (Node, без DOM). Сирий JSON лишається поруч у <details> в самому
  // renderReply() - рендер не показує все (напр. partitions/params на
  // портальному боці).

  // Остання відома відповідь кожної команди - System-картки Network/EcoFlow
  // (render.js: renderSystemInfo(data, extra)) читають wifi-status/
  // ecoflow-status, не роблячи власного другого MQTT-запиту (той самий
  // принцип, що statusRows() у порталі малює і вкладку Wi-Fi, і System-картку
  // з ОДНОГО /api/wifi/status). lastSystemInfo - чи взагалі вже приходив
  // system-info (renderSystemPanel() нічого не малює, поки нема бодай одного).
  let lastSystemInfo = null;
  let lastWifiStatus = null;
  let lastEcoflowStatus = null;
  let lastMqttStatus = null;

  function buildPanelHtml(cmd, data, extra) {
    let html;
    try {
      html = extra !== undefined ? RENDERERS[cmd](data, extra) : RENDERERS[cmd](data);
    } catch (e) {
      return `<p class="muted">render error: ${esc(e.message)}</p>`;
    }
    return html + `<details class="raw"><summary>raw JSON</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
  }

  // Розгорнуті пристрої EcoFlow (System-картка) - сканується з DOM ПЕРЕД
  // кожною перемальовкою (той самий патерн, що ecoSysOpenDetails у порталі):
  // innerHTML= нижче знищує й перестворює вузли, тому "open" на <details>
  // сам по собі не переживає перемальовку - треба явно прочитати й повернути.
  function renderSystemPanel() {
    if (!lastSystemInfo) return; // ще жодної відповіді system-info - нема що перемальовувати
    const openSerials = new Set(
      Array.from(panels['system-info'].out.querySelectorAll('.sys-eco-device[open]'))
        .map((el) => el.dataset.sn));
    panels['system-info'].out.innerHTML = buildPanelHtml('system-info', lastSystemInfo,
      { wifi: lastWifiStatus, ecoflow: lastEcoflowStatus, ecoflowOpenSerials: openSerials, mqtt: lastMqttStatus });
  }

  function renderReply(cmd, msg) {
    const p = panels[cmd];
    if (msg.ok) {
      if (cmd === 'wifi-status') lastWifiStatus = msg.data;
      else if (cmd === 'ecoflow-status') {
        mergeEcoflowParams(msg.data); // раніше довантажені raw parameters - не стерти свіжим агрегатом
        lastEcoflowStatus = msg.data;
      }
      else if (cmd === 'mqtt-status') lastMqttStatus = msg.data;
      else if (cmd === 'system-info') lastSystemInfo = msg.data;

      if (cmd === 'system-info') {
        renderSystemPanel();
      } else if (cmd === 'ecoflow-status') {
        renderEcoflowPanel(); // openParamsSerials-скан DOM, не голий buildPanelHtml (як решта команд нижче)
        renderSystemPanel();
      } else {
        p.out.innerHTML = buildPanelHtml(cmd, msg.data);
        // wifi-status/mqtt-status теж тримають відповідні System-картки
        // свіжими - без чекання наступного system-info-поллу.
        renderSystemPanel();
      }
      setPanelStatus(cmd, `ok (id ${msg.id})`, 'ok');
      p.backoffFactor = 1;
    } else {
      setPanelStatus(cmd, `error: ${msg.error || 'unknown'}`, 'err');
      p.backoffFactor = Math.min(p.backoffFactor * 2, AUTO_BACKOFF_MAX);
    }
  }

  // --- топіки ---
  let conn = null; // {host, port, prefix, username, password, clientId} - активне з'єднання
  function reqTopic(cmd) { return `${conn.prefix}/devices/${conn.clientId}/api/${cmd}`; }
  function replyTopic(cmd) { return `${conn.prefix}/devices/${conn.clientId}/api/${cmd}/reply`; }
  function statusTopic() { return `${conn.prefix}/devices/${conn.clientId}/status`; }
  // command/<client-id> - окремий корінь топіка, НЕ під devices/ (докладна
  // довільна команда, docs/mqtt-topics.md - "чи command/<id> теж переїжджає
  // під devices/" - ні, свідомо: це канал ручного виклику, а не структурований
  // API-запит за allowlist).
  function cmdReqTopic() { return `${conn.prefix}/command/${conn.clientId}`; }
  function cmdReplyTopic() { return `${conn.prefix}/command/${conn.clientId}/reply`; }
  // Лог (logEvent) показує топік у кожному рядку - сьогодні всі підписки й
  // публікації скоуплені на ОДИН пристрій, лише під двома різними коренями
  // (devices/<client-id>/... і command/<client-id>/...), тому
  // <prefix>/devices/<client-id> і <prefix>/command/<client-id> - це 99%
  // символів, не інформація. shortTopic() ховає обидва повторювані префікси
  // за "<client-id>" (сам clientId, не слово "device" - той самий
  // ідентифікатор, що й у формі підключення/f-client, легше зіставити з
  // кількома пристроями, якби колись знадобилось), лишає лише змінний хвіст
  // (api/system-info, status, command тощо) - повний топік і далі доступний
  // через title (hover) у .log-topic.
  function shortTopic(topic) {
    if (!conn) return topic;
    const short = `<${conn.clientId}>`;
    for (const root of [`${conn.prefix}/devices/${conn.clientId}`, `${conn.prefix}/command/${conn.clientId}`]) {
      if (topic === root) return short;
      if (topic.startsWith(root + '/')) return short + topic.slice(root.length);
    }
    return topic;
  }

  // --- вкладка Commands (docs/mqtt-topics.md: command/<client-id>, JSON API
  // commands-list) - той самий намір, що lib/WebPortal/WebCommandsModule на
  // порталі (запустити будь-яку зареєстровану команду, тримати shortcuts), але
  // інший транспорт: команда виконується через command/<client-id> (текстовий
  // канал, спільний з serial/cron - без кореляційного "id" у відповіді), а
  // перелік доступних команд - через ОКРЕМУ JSON API команду commands-list
  // (devices/<client-id>/api/commands-list), дзеркало /api/commands/list. ---

  // -- перелік зареєстрованих команд (commands-list, одноразовий запит поза
  // COMMANDS/panels[cmd] - той самий підхід, що ecoflow-params вище). --
  let availableCommands = [];
  let commandsListPendingId = null;
  let commandsListTimeoutTimer = null;

  function renderCommandsList() {
    const q = $('#cmd-list-filter').value.trim().toLowerCase();
    const list = q
      ? availableCommands.filter((c) => (c.name + ' ' + c.description).toLowerCase().includes(q))
      : availableCommands;

    $('#cmd-list-count').textContent = availableCommands.length
      ? (q ? `${list.length} of ${availableCommands.length}` : `${availableCommands.length} total`)
      : '';

    const body = $('#cmd-list-table tbody');
    body.innerHTML = list.length
      ? list.map((c) => `
        <tr data-pick="${esc(c.name)}">
          <td class="n">${esc(c.name)}</td>
          <td class="d">${esc(c.description)}</td>
        </tr>`).join('')
      : `<tr><td class="d">${availableCommands.length
          ? 'Nothing matches.' : 'Not loaded yet — connect and open this tab.'}</td></tr>`;

    // Той самий перелік - автодоповненням для поля Run (портал: #cmd-list).
    $('#commands-datalist').innerHTML = availableCommands
      .map((c) => `<option value="${esc(c.name)}">${esc(c.description)}</option>`)
      .join('');
  }

  function requestCommandsList() {
    if (!client || !client.connected) return;
    const id = Math.floor(Math.random() * 1e9);
    commandsListPendingId = id;
    clearTimeout(commandsListTimeoutTimer);
    commandsListTimeoutTimer = setTimeout(() => {
      commandsListPendingId = null;
      logEvent('err', reqTopic('commands-list'), null, `timeout ${COMMANDS_LIST_TIMEOUT_MS / 1000}s - no reply`);
    }, COMMANDS_LIST_TIMEOUT_MS);
    const topic = reqTopic('commands-list');
    const payload = JSON.stringify({ id });
    client.publish(topic, payload);
    logEvent('out', topic, payload);
  }

  // -- запуск довільної команди (command/<client-id>) і захоплення виводу --
  //
  // На відміну від requestCmd()/requestEcoflowDeviceParams() вище, тут немає
  // жодного кореляційного "id": command/<id> - текстовий канал, спільний з
  // serial/cron/іншими MQTT-клієнтами (docs/mqtt-topics.md), і "команда
  // завершилась" тут - евристика тиші по reply-топіку (CMD_RUN_SILENCE_MS),
  // а не факт із протоколу. Якщо в цей самий момент команду ввели ще й з
  // serial - вивід панелі покаже суміш, так само, як показав би /dev/ttyACM0
  // поруч із веб-консоллю порталу; для пре-альфа-інструмента одного оператора
  // це прийнятний компроміс, не прихована вада.
  let cmdRunActive = false;
  let cmdRunLabel = '';
  let cmdRunSilenceTimer = null;
  let cmdRunHardTimer = null;

  function setCmdRunState(text, cls) {
    const el = $('#cmd-run-state');
    el.textContent = text;
    el.className = 'cmd-status' + (cls ? ' ' + cls : '');
  }

  function endCmdRunCapture(label) {
    cmdRunActive = false;
    clearTimeout(cmdRunSilenceTimer);
    clearTimeout(cmdRunHardTimer);
    setCmdRunState(label, '');
  }

  function armCmdRunTimers() {
    clearTimeout(cmdRunSilenceTimer);
    cmdRunSilenceTimer = setTimeout(
      () => endCmdRunCapture(`no more output for ${CMD_RUN_SILENCE_MS / 1000}s: ${cmdRunLabel}`), CMD_RUN_SILENCE_MS);
  }

  function runCommand(cmd) {
    if (!client || !client.connected) return;
    cmd = cmd.trim();
    if (!cmd) return;
    clearTimeout(cmdRunSilenceTimer);
    clearTimeout(cmdRunHardTimer);
    cmdRunLabel = cmd;
    cmdRunActive = true;
    $('#cmd-run-out').textContent = '';
    setCmdRunState(`running: ${cmd}`, '');
    cmdRunHardTimer = setTimeout(
      () => endCmdRunCapture(`stopped: no reply for ${CMD_RUN_HARD_TIMEOUT_MS / 1000}s`), CMD_RUN_HARD_TIMEOUT_MS);
    armCmdRunTimers();
    const topic = cmdReqTopic();
    client.publish(topic, cmd);
    logEvent('out', topic, cmd);
  }

  // -- shortcuts (localStorage - CMD_SHORTCUTS_KEY вище, без серверного
  // сховища: SAPI не пише в NVS пристрою, на відміну від порталу). --
  function renderCmdShortcuts() {
    const list = loadCmdShortcuts();
    const box = $('#cmd-shortcuts');
    box.innerHTML = list.length
      ? list.map((s, i) => `
        <span class="chip" draggable="true" data-index="${i}">
          <button class="act ghost" data-run-shortcut="${esc(s.command)}"
                  title="${esc(s.command)}">${esc(s.name)}</button>
          <button class="act ghost" data-drop-shortcut="${i}" title="Remove shortcut">×</button>
        </span>`).join('')
      : '<span class="muted">No shortcuts yet — type a command and press “Save as shortcut”.</span>';
  }

  // Перетягування міняє порядок ОДРАЗУ в localStorage (на відміну від
  // /shortcuts-reorder порталу - тут нема сервера, якому це можна доручити,
  // і чекати на відповідь нема на що).
  let _dragCmdShortcutIndex = null;

  function _clearCmdShortcutDropMarks() {
    $$('#cmd-shortcuts .chip.drag-before, #cmd-shortcuts .chip.drag-after')
      .forEach((el) => el.classList.remove('drag-before', 'drag-after'));
  }
  function _cmdShortcutDropSide(chip, clientX) {
    const rect = chip.getBoundingClientRect();
    return clientX < rect.left + rect.width / 2 ? 'before' : 'after';
  }

  $('#cmd-shortcuts').addEventListener('dragstart', (ev) => {
    const chip = ev.target.closest('.chip');
    if (!chip) return;
    _dragCmdShortcutIndex = chip.dataset.index;
    chip.classList.add('dragging');
    ev.dataTransfer.effectAllowed = 'move';
  });
  $('#cmd-shortcuts').addEventListener('dragover', (ev) => {
    const chip = ev.target.closest('.chip');
    if (!chip) return;
    ev.preventDefault();
    _clearCmdShortcutDropMarks();
    chip.classList.add(_cmdShortcutDropSide(chip, ev.clientX) === 'before' ? 'drag-before' : 'drag-after');
  });
  $('#cmd-shortcuts').addEventListener('dragleave', (ev) => {
    if (!ev.currentTarget.contains(ev.relatedTarget)) _clearCmdShortcutDropMarks();
  });
  $('#cmd-shortcuts').addEventListener('drop', (ev) => {
    const chip = ev.target.closest('.chip');
    ev.preventDefault();
    _clearCmdShortcutDropMarks();
    if (!chip || _dragCmdShortcutIndex === null) return;

    const from = Number(_dragCmdShortcutIndex);
    _dragCmdShortcutIndex = null;
    // "to" - позиція ПІСЛЯ видалення from, той самий розрахунок, що на
    // порталі (assets/www/index.html).
    const target = Number(chip.dataset.index);
    let to = _cmdShortcutDropSide(chip, ev.clientX) === 'after' ? target + 1 : target;
    if (from < to) to -= 1;
    if (to === from) return;

    const list = loadCmdShortcuts();
    const [moved] = list.splice(from, 1);
    list.splice(to, 0, moved);
    saveCmdShortcuts(list);
    renderCmdShortcuts();
  });
  $('#cmd-shortcuts').addEventListener('dragend', () => {
    $$('#cmd-shortcuts .chip.dragging').forEach((el) => el.classList.remove('dragging'));
    _clearCmdShortcutDropMarks();
    _dragCmdShortcutIndex = null;
  });

  // Клік по назві команди зі списку ліворуч не запускає її одразу - майже всі
  // беруть аргументи, тому назва лише потрапляє в поле Run (той самий підхід,
  // що data-pick на порталі).
  $('section[data-tab="commands"]').addEventListener('click', (ev) => {
    const pick = ev.target.closest('[data-pick]');
    if (pick) {
      const input = $('#cmd-run-input');
      input.value = pick.dataset.pick + ' ';
      input.focus();
      return;
    }

    const run = ev.target.closest('[data-run-shortcut]');
    if (run) { runCommand(run.dataset.runShortcut); return; }

    const drop = ev.target.closest('[data-drop-shortcut]');
    if (drop && confirm('Remove this shortcut?')) {
      const list = loadCmdShortcuts();
      list.splice(Number(drop.dataset.dropShortcut), 1);
      saveCmdShortcuts(list);
      renderCmdShortcuts();
    }
  });

  $('#cmd-run-form').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const cmd = $('#cmd-run-input').value.trim();
    if (cmd) runCommand(cmd);
  });

  $('#btn-cmd-save-shortcut').addEventListener('click', () => {
    const cmd = $('#cmd-run-input').value.trim();
    if (!cmd) { alert('Type a command first'); return; }
    const name = prompt('Shortcut name:', cmd.split(' ')[0]);
    if (name === null || !name.trim()) return;
    const list = loadCmdShortcuts();
    list.push({ name: name.trim(), command: cmd });
    saveCmdShortcuts(list);
    renderCmdShortcuts();
  });

  $('#cmd-list-filter').addEventListener('input', renderCommandsList);
  $('#btn-cmd-list-refresh').addEventListener('click', requestCommandsList);

  // localStorage не залежить від з'єднання - на відміну від решти вкладок,
  // shortcuts малюються одразу при завантаженні сторінки, а не при connect().
  renderCmdShortcuts();

  function requestCmd(cmd) {
    if (!client || !client.connected) return;
    const p = panels[cmd];
    // Уже є запит у польоті на ЦЮ панель (надісланий чи ще в
    // sapiInFlightQueue) - не дублюємо. Це і є фікс "подвійного
    // requestCmd() при конекті": Auto-обробник applyPersistedToggles()
    // і безумовний цикл нижче в client.on('connect', ...) кличуть
    // requestCmd(cmd) для того самого cmd підряд - другий виклик тепер
    // просто no-op, а не другий publish з іншим id.
    if (p.pendingId !== null) return;
    const id = Math.floor(Math.random() * 1e9);
    p.pendingId = id;
    setPanelStatus(cmd, 'queued...', '');
    withInFlightSlot(() => {
      setPanelStatus(cmd, 'loading...', '');
      clearTimeout(p.inFlightTimeoutTimer);
      p.inFlightTimeoutTimer = setTimeout(() => {
        p.pendingId = null;
        setPanelStatus(cmd, `error: timeout ${CMD_REQUEST_TIMEOUT_MS / 1000}s - no reply`, 'err');
        p.backoffFactor = Math.min(p.backoffFactor * 2, AUTO_BACKOFF_MAX);
        releaseInFlightSlot();
      }, CMD_REQUEST_TIMEOUT_MS);
      const payload = JSON.stringify({ id });
      client.publish(reqTopic(cmd), payload);
      logEvent('out', reqTopic(cmd), payload);
    });
  }

  function scheduleAuto(cmd) {
    const p = panels[cmd];
    clearTimeout(p.timer);
    if (!p.autoToggle.checked) return;
    const wait = AUTO_BASE_MS * p.backoffFactor;
    p.timer = setTimeout(() => {
      requestCmd(cmd);
      scheduleAuto(cmd);
    }, wait);
  }

  for (const cmd of COMMANDS) {
    panels[cmd].refreshBtn.addEventListener('click', () => requestCmd(cmd));
    panels[cmd].autoToggle.addEventListener('change', () => {
      if (panels[cmd].autoToggle.checked) {
        requestCmd(cmd);
      }
      scheduleAuto(cmd);
    });
  }

  // --- попап підключення ---
  const connWrap = $('.conn-wrap');
  const connPopover = $('#conn-popover');
  const connActionBtn = $('#btn-conn-action');
  const navEl = $('nav');
  const mainEl = $('main');
  // Поля форми - readonly, поки з'єднання активне: редагувати host/port/...
  // "під живим з'єднанням" однаково нічого не змінює (client уже підключений
  // зі старими значеннями), а виглядає так, ніби зміна щось робить. Спершу
  // Disconnect - тоді форма знову редагована. btn-forget/btn-conn-action -
  // не тут: це самі дії керування з'єднанням, вони мають лишатись активними.
  const connFields = $$('.conn-popover input');
  function setConnFieldsDisabled(disabled) {
    for (const el of connFields) el.disabled = disabled;
  }
  function openPopover() { connPopover.hidden = false; }
  function closePopover() { connPopover.hidden = true; }
  function togglePopover() { connPopover.hidden = !connPopover.hidden; }
  // Клік поза попапом закриває його - той самий очікуваний патерн, що й
  // ▾-меню порталу, інакше форма лишається висіти, поки її не закриють
  // повторним кліком по тій самій кнопці.
  document.addEventListener('click', (ev) => {
    if (connPopover.hidden) return;
    if (connWrap.contains(ev.target)) return;
    closePopover();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !connPopover.hidden) closePopover();
  });

  // --- з'єднання ---
  let client = null;
  let connState = 'off'; // 'off' | 'connecting' | 'on'

  function setConnState(state) {
    connState = state;
    const dot = $('#conn-dot');
    const label = $('#conn-label');
    dot.className = state === 'off' ? '' : state;
    label.textContent = { off: 'disconnected', connecting: 'connecting...', on: 'connected' }[state];
    for (const cmd of COMMANDS) panels[cmd].refreshBtn.disabled = state !== 'on';

    // Вкладки System/Wi-Fi/EcoFlow/Log мають сенс лише з живими даними -
    // поки не connected, показувати їх порожніми ("-" у кожній) створює
    // враження, що сторінка чекає на якесь диво. Замість цього - взагалі
    // ховаємо nav/main, лишається тільки шапка з попапом підключення.
    navEl.hidden = state !== 'on';
    mainEl.hidden = state !== 'on';

    // Поля форми - readonly під активним з'єднанням (розділ вище,
    // setConnFieldsDisabled): змінити host/port/... на льоту й так нічого не
    // означає, поки client не переперепідключений - спершу Disconnect.
    setConnFieldsDisabled(state === 'on');

    // Один видимий контрол на дію: connect/disconnect - та сама кнопка,
    // підпис і поведінка змінюються з станом, а не дві кнопки, з яких
    // одна завжди задизейблена. Попап відкривається сам, коли з'єднання
    // немає (перше завантаження сторінки і будь-яке розірвання з'єднання -
    // той самий випадок, форма підключення завжди під рукою), і ховається,
    // коли з'єднання встановлено, звільняючи місце під вкладки.
    if (state === 'off') {
      connActionBtn.textContent = 'Connect';
      connActionBtn.disabled = false;
      openPopover();
    } else if (state === 'connecting') {
      connActionBtn.textContent = 'Connecting...';
      connActionBtn.disabled = true;
    } else {
      connActionBtn.textContent = 'Disconnect';
      connActionBtn.disabled = false;
      closePopover();
    }
  }

  function disconnect() {
    for (const cmd of COMMANDS) {
      clearTimeout(panels[cmd].timer);
      panels[cmd].autoToggle.checked = false;
    }
    for (const pending of pendingEcoParamsIds.values()) clearTimeout(pending.timeoutTimer);
    pendingEcoParamsIds.clear();
    clearTimeout(commandsListTimeoutTimer);
    commandsListPendingId = null;
    endCmdRunCapture('');
    if (client) {
      client.end(true);
      client = null;
    }
    setConnState('off');
    $('#device-state').textContent = '';
  }

  function connect() {
    conn = readForm();
    if (!conn.host || !conn.clientId) {
      alert('Host і device client-id обов’язкові');
      return;
    }
    saveConn(conn);

    const url = `ws://${conn.host}:${conn.port}`;
    logEvent('info', null, null, `connecting to ${url} as '${conn.username}', device '${conn.clientId}'`);
    setConnState('connecting');

    client = mqtt.connect(url, {
      username: conn.username,
      password: conn.password,
      clientId: 'sapi-web-' + Math.random().toString(16).slice(2, 10),
      reconnectPeriod: 4000,
      connectTimeout: 8000,
    });

    client.on('connect', () => {
      setConnState('on');
      logEvent('info', null, null, 'connected');
      client.subscribe(`${conn.prefix}/devices/${conn.clientId}/api/+/reply`);
      // "+/reply" вище ловить лише ОДИН листовий сегмент (api/<cmd>/reply) -
      // devices/<client-id>/api/ecoflow-params/<sn>/reply має на сегмент
      // більше (docs/mqtt-topics.md), окрема підписка на нього.
      client.subscribe(`${conn.prefix}/devices/${conn.clientId}/api/ecoflow-params/+/reply`);
      client.subscribe(statusTopic());
      client.subscribe(cmdReplyTopic());
      // Відновлення персистентних UI-контролів - ПІСЛЯ підписки, ПЕРЕД
      // безумовним циклом нижче (розділ "Персист UI-чекбоксів" вище):
      // "Auto" без живого client однаково нічого не зробив би, а зроблений
      // ДО subscribe() ризикував би загубити відповідь на власний запит
      // (publish раніше за subscribe на топік reply). Раніше це давало
      // зайвий дублікат requestCmd() для команд з увімкненим Auto
      // (change-обробник усередині сам робить один запит, а безумовний
      // цикл нижче - ще один) - requestCmd() тепер сам ігнорує повторний
      // виклик, поки попередній запит цієї ж панелі в польоті (див.
      // коментар усередині requestCmd()), тож другий виклик тут - no-op,
      // а не другий publish.
      applyPersistedToggles();
      for (const cmd of COMMANDS) requestCmd(cmd);
      requestCommandsList();
    });

    client.on('reconnect', () => setConnState('connecting'));
    client.on('close', () => setConnState('off'));
    client.on('error', (err) => logEvent('err', null, null, err.message || err));

    client.on('message', (topic, payloadBuf) => {
      const text = payloadBuf.toString();
      logEvent('in', topic, text);

      if (topic === statusTopic()) {
        $('#device-state').textContent = `device: ${text}`;
        return;
      }

      // command/<client-id>/reply - окремий корінь топіка (не devices/...),
      // тому перевіряємо його тут, до decision-дерева нижче, а не всередині
      // циклу COMMANDS (той шукає лише replyTopic(cmd) під devices/).
      if (topic === cmdReplyTopic()) {
        if (cmdRunActive) {
          const out = $('#cmd-run-out');
          out.textContent += text.endsWith('\n') ? text : text + '\n';
          out.scrollTop = out.scrollHeight;
          armCmdRunTimers();
        }
        return;
      }

      // commands-list - одноразовий запит поза COMMANDS (як ecoflow-params
      // нижче): це перелік СЕРІЙНИХ команд для вкладки Commands, не статус
      // пристрою, і не тягне auto-poll/panels[cmd].
      if (topic === replyTopic('commands-list')) {
        let msg;
        try {
          msg = JSON.parse(text);
        } catch (e) {
          return;
        }
        if (commandsListPendingId !== null && msg.id !== commandsListPendingId) return; // застаріла відповідь
        clearTimeout(commandsListTimeoutTimer);
        commandsListPendingId = null;
        if (msg.ok) {
          availableCommands = Array.isArray(msg.data) ? msg.data : [];
          renderCommandsList();
        } else {
          logEvent('err', topic, null, `commands-list error: ${msg.error || 'unknown'}`);
        }
        return;
      }

      // Device-specific drill-down (ecoflow-params/<sn>/reply) - ПЕРЕД
      // циклом COMMANDS нижче: той цикл шукає ТОЧНИЙ збіг replyTopic(cmd),
      // а тут топік має ще один сегмент (sn) понад будь-який replyTopic(cmd).
      // sn ПОРОЖНІЙ - захисна гілка, не мала б траплятись структурно (на
      // відміну від першої версії, де ecoParamsPrefix ділив префікс із
      // reqTopic('ecoflow-status') і базова відповідь ecoflow-status мовчки
      // ковталась тут із порожнім sn - System-картка EcoFlow лишалась на
      // "***" назавжди; окрема назва команди 'ecoflow-params' цю колізію
      // усуває структурно). Лишається як запобіжник - провал у звичайний
      // цикл COMMANDS нижче, не return.
      const ecoParamsPrefix = ecoParamsReqTopic('');
      const isEcoParamsReply = topic.startsWith(ecoParamsPrefix) && topic.endsWith('/reply');
      const ecoParamsSn = isEcoParamsReply ? topic.slice(ecoParamsPrefix.length, -'/reply'.length) : '';
      if (isEcoParamsReply && ecoParamsSn) {
        let msg;
        try {
          msg = JSON.parse(text);
        } catch (e) {
          return; // невалідний JSON - той самий випадок, що й COMMANDS нижче, але тут нема панелі для статусу помилки
        }
        const pending = pendingEcoParamsIds.get(ecoParamsSn);
        if (!pending || pending.id !== msg.id) return; // застаріла відповідь
        clearTimeout(pending.timeoutTimer);
        pendingEcoParamsIds.delete(ecoParamsSn);
        setEcoParamsBusy(ecoParamsSn, false); // ok:true й ok:false (busy/queue full) - обидва завершують очікування
        if (msg.ok && lastEcoflowStatus && Array.isArray(lastEcoflowStatus.devices)) {
          const device = lastEcoflowStatus.devices.find((d) => d.serialNumber === ecoParamsSn);
          if (device) {
            device.params = msg.data.params;
            device.droppedParams = msg.data.droppedParams;
            device.captureAll = msg.data.captureAll;
            renderEcoflowPanel();
          }
        }
        return;
      }

      for (const cmd of COMMANDS) {
        if (topic !== replyTopic(cmd)) continue;
        let msg;
        try {
          msg = JSON.parse(text);
        } catch (e) {
          setPanelStatus(cmd, 'invalid JSON from device', 'err');
          return;
        }
        const p = panels[cmd];
        // Ехо id - ігноруємо як застарілу відповідь (requestCmd() тепер не
        // дублює запит на ту саму панель, тому це трапляється лише при
        // повторній доставці того самого id брокером), так і будь-яку
        // відповідь, коли слот уже звільнено таймаутом (p.pendingId===null) -
        // в обох випадках releaseInFlightSlot() тут викликати не можна:
        // слот або чужий, або вже звільнений раніше.
        if (p.pendingId === null || msg.id !== p.pendingId) return;
        clearTimeout(p.inFlightTimeoutTimer);
        p.pendingId = null;
        renderReply(cmd, msg);
        releaseInFlightSlot();
        return;
      }
    });
  }

  // Індикатор стану - лише перемикач видимості попапу, незалежно від
  // з'єднання: розрив з'єднання - дія попапу (кнопка Disconnect нижче), а
  // не одного кліку по пілюлі - випадковий клік по шапці більше не рве
  // з'єднання без жодного проміжного кроку.
  $('#conn-toggle').addEventListener('click', togglePopover);
  connActionBtn.addEventListener('click', () => {
    if (connState === 'off') connect();
    else if (connState === 'on') disconnect();
  });
  $('#btn-forget').addEventListener('click', () => {
    forgetConn();
    fillForm({});
    logEvent('info', null, null, 'saved connection forgotten');
  });
  $('#btn-clear-log').addEventListener('click', () => {
    logRows.length = 0;
    pendingRequests.clear();
    $('#log').innerHTML = '';
  });

  // Короткий git-sha, з яким зібрана ЦЯ сторінка (revision.js, той самий
  // коміт, що й прошивка). Порівняння з живим "revision" пристрою (discovery,
  // фаза 2) тут ще нема - discovery-канал на платі не реалізований, це лише
  // видима мітка білда SAPI.
  if (typeof SAPI_EXPECTED_REVISION !== 'undefined') {
    $('#sapi-revision').textContent = 'build ' + SAPI_EXPECTED_REVISION;
  }

  setConnState('off');

  // Автологін - лише якщо є збережене підключення (host+client-id) І
  // користувач сам увімкнув чекбокс "Auto-connect on load" минулого разу
  // (дефолт - вимкнено, fillForm() вище) - тиснемо Connect самі, без
  // очікування ручного кліку. Попап усе одно щойно відкрився
  // (setConnState('off') вище) - користувач бачить "Connecting...", а не
  // миттєвий стрибок одразу у вкладки без пояснення, і на невдалому
  // конекті попап лишається відкритим із формою, як і зараз.
  const savedConn = loadConn();
  if (savedConn.host && savedConn.clientId && savedConn.autoLogin === true) {
    connect();
  }
})();
</script>
</body>
</html>
