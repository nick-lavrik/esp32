<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 SAPI</title>
<!--
  Браузерний SAPI-клієнт (docs/mqtt-web-handoff.md, фаза 1/2) - підключається
  НАПРЯМУ до MQTT-брокера (WebSockets), без жодного HTTP-запиту до плати.
  Не частина прошивки: pio run цю теку не бачить (поза src/lib/include),
  хоститься окремо (rpi5, GitHub Pages, локальний файл - будь-що статичне).

  Пре-альфа: маніфест discovery (фаза 2) ще не існує, тому список команд
  нижче (COMMANDS) - жорстко зашитий, той самий allowlist, що в src/main.cpp
  (kJsonApiSystemInfo/kJsonApiWifiStatus/kJsonApiEcoflowStatus/
  kJsonApiMqttStatus). Рендер під конкретні поля кожної команди (render.js:
  renderSystemInfo/renderWifiStatus/renderEcoflowStatus/renderMqttStatus) -
  жорстко прив'язаний до COMMANDS вище, той самий дух пре-альфи: коли
  з'явиться discovery-маніфест, він і замінить цей список разом із
  рендерами на щось, що будується з даних, а не з коду тут. Сирий JSON
  лишається поруч (<details class="raw">) - для діагностики полів, яких
  рендер ще не показує.

  Вкладка Commands (сесія 2026-09-26) - ПОЗА цим списком/рендерами: там не
  статус пристрою, а запуск довільної serial-команди через command/<id> +
  перелік команд через окрему JSON API commands-list, докладно -
  docs/mqtt-web-handoff.md, розділ "SAPI: вкладка Commands", і sapi/README.md.

  render.js винесений окремим файлом (не в цей інлайн-скрипт) свідомо - той
  самий код без змін прогонить test/render.test.js у Node, без браузера/DOM.

  Розмітка/стиль (header/nav/section/button.act) - буквально той самий
  словник, що й у assets/www/index.html (портал): за проханням користувача
  (сесія 2026-09-23) - форма підключення була "великою" формою по центру
  сторінки, що ховалась після конекту й лишала непослідовний вигляд між
  "до" і "після". Тепер підключення - компактний попап під заголовком
  (клік по індикатору стану), а System/Wi-Fi/EcoFlow/Log - вкладки nav,
  видимі одразу, незалежно від стану з'єднання - той самий каркас, що й
  портал, замість двох по-різному виглядаючих "сторінок".
-->
<style>
:root {
  --bg: #14171c; --panel: #1c2027; --line: #2b313b; --text: #e6e9ef;
  --muted: #8b94a3; --accent: #4da3ff; --ok: #4cc38a; --warn: #e0a33e; --err: #e5534b;
  --sig-bar: 8px; --sig-bar-gap: 3px;
  --font-size-base: 14px;
  --font-scale: 1.125;
  --font-size-small: calc(var(--font-size-base) / var(--font-scale));
  --font-size-medium: calc(var(--font-size-base) * var(--font-scale));
  --font-size-large: calc(var(--font-size-medium) * var(--font-scale));
  /* Шар поверх вмісту на час очікування MQTT-відповіді (.busy нижче) -
     буквальний порт з порталу (assets/www/index.html): світло-сірий, не тон
     --bg, інакше на темних кнопках/картках спінер лишався б єдиною ознакою. */
  --busy-overlay: rgba(230, 233, 239, .50);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* min-height (не height) - тіло росте вище за 100vh, коли вмісту більше за
   екран (Log-вкладка, розділ нижче), а не обрізається на рівні viewport;
   flex-колонка - щоб main (нижче) міг зайняти РЕШТУ висоти, а не лише
   власний вміст. header/nav лишаються без flex:none - дефолтний
   flex:0 1 auto їх і так не розтягує (жодного flex-grow), а стиснення
   ніколи не настає: тіло без фіксованої height, лише min-height, тому
   "дефіциту" простору для flex-shrink не буває в принципі. */
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font: var(--font-size-base)/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: var(--font-size-medium); margin: 0; font-weight: 600; }
header .spacer { flex: 1; }
#device-state { color: var(--muted); font-size: var(--font-size-small); }

/* Індикатор стану - сам кнопка (не декоративний текст): клік відкриває
   попап підключення, коли ми off/connecting, і одразу розриває з'єднання,
   коли on - той самий верхній правий кут, що й раніше показував лише
   напис, тепер ще й керує з'єднанням, без окремої постійної кнопки. */
.conn-wrap { position: relative; }
#conn-toggle { display: flex; align-items: center; gap: 6px; background: none;
  border: 1px solid transparent; border-radius: 6px; padding: 5px 10px;
  font: inherit; font-size: var(--font-size-small); color: var(--muted); cursor: pointer; }
#conn-toggle:hover { border-color: var(--line); color: var(--text); }
#conn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); flex: none; }
#conn-dot.on { background: var(--ok); }
#conn-dot.connecting { background: var(--warn); }

/* Попап підключення - той самий патерн, що ▾-меню порталу (.menu-wrap/.menu
   в assets/www/index.html): абсолютний блок під кнопкою, а не постійний
   розділ сторінки. Ширший за звичайне меню (форма, не список дій). */
.conn-popover { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px; min-width: 300px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 6px 20px #0009; }
.conn-popover h2 { margin: 0; font-size: var(--font-size-medium); }

nav { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
nav button { background: none; border: 1px solid transparent; border-bottom: none;
  color: var(--muted); padding: 7px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit;
  flex: none; white-space: nowrap; }
nav button.active { background: var(--panel); border-color: var(--line); color: var(--text); }
@media (max-width: 560px) {
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  nav button { padding: 8px 10px; }
}

/* Без max-width - той самий портал (assets/www/index.html: `main { padding:
   0 16px 24px; }`, нічого більше). Раніше тут стояв max-width:960px - лишав
   картки System удвічі вужчими, ніж дозволяє екран, і саме це, разом із
   .out нижче, робило вигляд "зовсім іншим", ніж на порталі (сесія
   2026-09-24). */
/* flex: 1 0 auto (не скорочена "flex:1" = "1 1 0%") - зростає, щоб
   заповнити решту висоти тіла, але НІКОЛИ не стискається нижче власного
   вмісту (shrink:0). Той самий патерн нижче - на Log-секції й на #log
   самому - три ланки одного ланцюга: тіло без фіксованої height (вище) ->
   main росте до решти екрана -> активна Log-секція росте до решти main ->
   #log росте до решти секції. Розтягування, вимкнене на shrink, означає:
   короткий лог - блок все одно на всю доступну висоту; довгий лог - блок
   росте понад екран, скролиться СТОРІНКА, не #log. */
main { padding: 0 16px 24px; flex: 1 0 auto; display: flex; flex-direction: column; }
section { display: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 0 8px 8px 8px; padding: 16px; }
section.active { display: block; }
/* Вужчий за .active селектор ([data-tab="log"] додає специфічність) - лише
   Log-секція стає flex-колонкою на всю решту main; System/Wi-Fi/EcoFlow
   лишаються звичайним display:block (їхня верстка карток/kv не потребує
   full-height розтягування, займають рівно стільки, скільки треба). */
section[data-tab="log"].active { display: flex; flex-direction: column; flex: 1 0 auto; }
section > h2:first-child, .card > h2:first-child { margin-top: 0; }
h2 { font-size: var(--font-size-large); text-transform: uppercase; letter-spacing: .05em;
  color: var(--text); margin: 24px 0 10px; font-weight: 600; }
h2 span { text-transform: none; letter-spacing: 0; }
h2.hrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2.hrow .act { margin-left: auto; font-size: var(--font-size-small); padding: 4px 10px;
  text-transform: none; letter-spacing: 0; }
/* Заголовок EcoFlow "Devices" - той самий вигляд, що h2 (font-size-large,
   uppercase, margin 24px 0 10px), плюс cursor/user-select - той самий портал
   (assets/www/index.html: #ecoflow-devices-wrap > summary): сам заголовок -
   перемикач розгорнути/згорнути картки (<details>), не звичайний <h2>. */
#ecoflow-devices-wrap > summary { font-size: var(--font-size-large); text-transform: uppercase;
  letter-spacing: .05em; color: var(--text); margin: 24px 0 10px; font-weight: 600; cursor: pointer;
  user-select: none; }
#ecoflow-devices-wrap > summary span { text-transform: none; letter-spacing: 0; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
/* Стековий підпис-над-полем - лише для форми підключення (6 різнорідних
   полів, короткий підпис над кожним читається швидше за самі плейсхолдери).
   Поза попапом (checkbox-row, майбутні форми) label лишається звичайним
   inline-рядком - раніше загальне правило "усі label - колонка" ламало
   .checkbox-row (AUTO переносився під чекбокс). */
.conn-popover label { display: flex; flex-direction: column; gap: 4px; font-size: var(--font-size-small);
  color: var(--muted); flex: 1; min-width: 140px; }
/* .checkbox-row (Auto-connect) усередині попапу - той самий чекбокс-поруч-
   з-текстом рядок, що й на System/Wi-Fi/EcoFlow (AUTO), не стековий підпис-
   над-полем: правило вище (.conn-popover label) інакше зламало б і цей
   чекбокс так само, як раніше ламало AUTO поза попапом. */
.conn-popover label.checkbox-row { flex-direction: row; align-items: center; min-width: 0; }
input, select { background: var(--bg); border: 1px solid var(--line); color: var(--text);
  border-radius: 6px; padding: 7px 10px; font: inherit; }
input:focus { outline: 1px solid var(--accent); }

button.act { background: var(--accent); border: none; color: #06121f; padding: 7px 14px;
  border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; }
button.act.ghost { background: none; border: 1px solid var(--line); color: var(--text); font-weight: 400; }
button.act:disabled { opacity: .5; cursor: default; }
button.act.ghost.danger { color: var(--err); }
button.act.ghost.danger:hover { border-color: var(--err); }
/* Стан "призупинено" (#btn-log-pause) - видима позначка, не лише зміна
   підпису (Pause -> Resume): той самий принцип, що hintIcon()/hint-mark -
   прихований стан, який видно лише прочитавши текст кнопки, легко
   пропустити на біглий погляд. */
button.act.ghost.paused { border-color: var(--warn); color: var(--warn); }

/* Спінер на час очікування MQTT-відповіді - буквальний порт .busy з порталу
   (assets/www/index.html: setBusy()/job()), лише джерело "завершення" інше:
   там - проміс job()/finally, тут - MQTT reply чи ECO_PARAMS_TIMEOUT_MS
   (index.html, setEcoParamsBusy()). Клас спільний для кнопки й цілого блоку
   (details.eco-params) - розмір/форму шару визначає сам елемент, якому його
   навісили. isolation:isolate - той самий коментар, що в порталі: без
   власного стекового контексту ::before/::after (z-index:1) програють будь-
   якому positioned-нащадку, доданому в розмітці ПІСЛЯ них. */
.busy { position: relative; pointer-events: none; isolation: isolate; }
.busy::before { content: ""; position: absolute; inset: -0.7ch; background: var(--busy-overlay);
  border-radius: 0.7ch; z-index: 1; }
.busy::after { content: ""; position: absolute; top: 50%; left: 50%; width: 14px; height: 14px;
  margin: -7px 0 0 -7px; border: 2px solid var(--line); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .6s linear infinite; z-index: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.busy button.act:not(.ghost), button.act.busy:not(.ghost) { background: var(--line); }

.cmd-status { font-size: var(--font-size-small); color: var(--muted); font-weight: 400; min-width: 10em; }
.cmd-status.ok { color: var(--ok); }
.cmd-status.err { color: var(--err); }
/* font-size тут НЕ small - портал жодного разу не зменшує кегль dl/картки,
   лише консольні/monospace блоки (#log нижче). Раніше .out форсував small
   на весь вміст, включно з картками System - звідси й "трохи менший за
   портал текст" (сесія 2026-09-24). */
.out { background: #0e1116; border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px; line-height: 1.5; max-height: 420px; overflow-y: auto; }
/* Картковий вивід (System/EcoFlow, renderSystemInfo/renderEcoflowStatus) не
   отримує темну рамку/власний скрол консолі - портал не кладе картки в жодну
   додаткову коробку, вони лежать просто на тлі секції (assets/www/
   index.html, #sys-cards/#ecoflow-devices). Раніше .out малював ще одну
   рамку НАВКОЛО карток і різав їх висоту скролом - саме "коробка в коробці"
   й відрізняла SAPI від порталу найбільше. :has() ловить БУДЬ-ЯКОГО нащадка
   з .cards (не лише прямий), тому й ecoflow-status (.cards лежить у
   вкладеному .section-group, не прямим дитям .out) підпадає під те саме
   правило автоматично. wifi-status - єдина команда, що поки лишається
   звичайним kv/badge-виводом у консольній рамці (наступний крок, не цей). */
.out:has(.cards) { background: none; border: none; padding: 0; max-height: none; overflow: visible; }
/* dl/dt/dd - той самий глобальний вигляд, що в assets/www/index.html
   (портал), не власний клас .kv: System-вкладка (render.js,
   renderSystemInfo) тепер емітить голий <dl>, як і портал. wifi-status
   поки лишається на .kv/badge - наступний крок, не цей. ecoflow-status/
   mqtt-status використовують .kv для верхнього блоку (Connection) свідомо
   (не голий dl) - та сама візуальна форма, простіше перевикористання
   наявного класу, не нова стилізація під голий dl заради буквальної
   відповідності розмітці порталу. */
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.section-group { margin-top: 12px; }
.section-group h3 { margin: 0 0 6px; font-size: var(--font-size-small); color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .03em; }
/* Картки System - той самий словник, що #sys-cards/.card у порталі:
   flex-wrap рядок карток, кожна росте до 300px, а не жорсткі 2 колонки -
   кількість карток (Device/Memory/LittleFS/SD/NVS/Modules) не ділиться
   рівно навпіл на жодній ширині. */
.cards { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 12px; flex: 1 1 330px; min-width: 260px; }
.card dl { grid-template-columns: max-content 1fr; }
/* Другорядне уточнення в значенні (кількість переходів, Гц, "(inferred)") -
   власним рядком під основним, не впритул через " · " (та сама причина, що
   в порталі: переносилось би посередині слова на вузькій картці). */
.eco-sub { display: block; color: var(--muted); font-size: var(--font-size-small); margin-top: 1px; }
.eco-counts { display: flex; flex-wrap: wrap; column-gap: 6px; row-gap: 2px; }
.eco-counts span:not(:last-child)::after { content: " ·"; color: var(--muted); }
/* Компактний перелік пристроїв EcoFlow у System-картці - 1:1 з порталом
   (assets/www/index.html, ecoSysDeviceRow()/renderEcoflowSystemSummary()):
   згорнутий рядок - охайна табличка (grid, не вільний текст через " · "),
   розгорнутий <details> додає ті самі поля, що повна картка вкладки
   EcoFlow (ecoDeviceDetailRows() - render.js, спільна з нею). */
.sys-eco-devices { margin-top: 16px; }
.sys-eco-device { padding: 3px 0; }
.sys-eco-device[open] { border-top: 0 solid var(--line); border-bottom: 1px solid var(--line);
  margin: 2px 0; padding: 3px 0 8px 0; }
.sys-eco-device summary { cursor: pointer; user-select: none; list-style: none; }
.sys-eco-device summary::-webkit-details-marker { display: none; }
/* Каретка - руками замість штатного трикутника <summary> (штатний живе лише
   при display:list-item, а рядок нижче - grid). */
.sys-eco-device summary { display: grid; grid-template-columns: 12px 1fr 62px 44px;
  column-gap: 8px; align-items: baseline; }
.sys-eco-device summary .eco-caret { color: var(--muted); transition: transform .15s; }
.sys-eco-device[open] summary .eco-caret { transform: rotate(90deg); }
.sys-eco-device summary .eco-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sys-eco-device summary .eco-charge, .sys-eco-device summary .eco-remain { text-align: right;
  font-variant-numeric: tabular-nums; }
.sys-eco-device summary .eco-remain { display: none; }
@media (min-width: 1300px) {
  .sys-eco-device summary { grid-template-columns: 12px 1fr 62px 44px 56px; }
  .sys-eco-device summary .eco-remain { display: inline; }
}
.sys-eco-device dl { margin-top: 8px; }
/* Базовий вигляд БУДЬ-якого <table> без .zebra - той самий портал
   (assets/www/index.html: `table { width:100%; border-collapse:collapse; }`).
   Потрібен ecoParamsTable() (render.js) - "Raw parameters" картки EcoFlow
   лишається буквальним, неприкрашеним <table>, як на порталі, а не .zebra
   (той стиль тут навмисно НЕ застосовано - "1:1 як на порталі", не "як решта
   SAPI"). */
table { width: 100%; border-collapse: collapse; }
/* Розділ "Raw parameters" картки пристрою - той самий портал
   (.ecoflow-device summary/table, assets/www/index.html): приглушений
   клікабельний summary, невеликий відступ над таблицею/кнопкою. */
.ecoflow-device summary { cursor: pointer; color: var(--muted); margin-top: 10px; user-select: none; }
.ecoflow-device .eco-params-body table { margin-top: 8px; }
.ecoflow-device .eco-params-body td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
/* Фото пристрою - той самий портал (assets/www/index.html: water-mark
   ::before, ECO_DEVICE_IMAGE_SLUG/data-model у render.js вище), лише
   url() відносний ("img/...", не "/img/..."): sapi - будь-який статичний
   http-сервер із цієї теки (sapi/README.md), не гарантовано корінь домену. */
.ecoflow-device { position: relative; z-index: 0; }
.ecoflow-device[data-model]::before {
  content: ""; position: absolute; z-index: -1; top: 48px; right: 10px; height: 130px;
  width: 40%; max-width: 150px; background-repeat: no-repeat; background-position: right center;
  background-size: contain; opacity: 0.5; pointer-events: none;
}
.ecoflow-device[data-model="delta2"]::before { background-image: url("img/delta2.webp"); }
.ecoflow-device[data-model="delta-mini"]::before { background-image: url("img/delta-mini.webp"); }
.ecoflow-device[data-model="delta-pro"]::before { background-image: url("img/delta-pro.webp"); }
table.zebra { width: 100%; border-collapse: collapse; margin-top: 6px; }
table.zebra th, table.zebra td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
/* th БІЛЬШОГО кегля за td, не меншого - той самий портал (assets/www/
   index.html): "заголовок стовпчика дрібнішим за власний вміст" - це саме
   те, що там свідомо виправили (CLAUDE.md-стиль коментаря на місці). */
table.zebra th { color: var(--muted); font-weight: 600; font-size: var(--font-size-medium);
  text-transform: uppercase; letter-spacing: .04em; }
table.zebra thead th { background: #ffffff05; }
table.zebra tbody tr:nth-child(even) { background: #ffffff05; }
table.zebra tbody tr:hover { background: #ffffff0f; }
/* table.zebra td/th (вище) - той самий клас у селекторі, що й тут (0,1,2)
   проти (0,1,1) - без "table.zebra td.num" зліва table.zebra перебивав би
   text-align:right однаковою специфічністю+пізнішим порядком лише випадково;
   явний дубль-селектор - гарантія, а не збіг порядку правил. */
table.zebra td.num, td.num { text-align: right; font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap; }
table.zebra th.num, th.num { text-align: right; }
td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (max-width: 560px) { .opt { display: none; } dl { grid-template-columns: 1fr; } }
/* Стовпчики Overview-таблиці вкладки EcoFlow (render.js: ecoTableRow) - той
   самий поріг/розподіл, що в порталі (assets/www/index.html): .opt2 ховає
   найдругорядніше вже на планшеті (≤900px, #/Serial/Age), .ecoflow-wide -
   навпаки, з'являється лише там, де вже й так порожньо (>1300px, Power/AC).
   Скоуп на .ecoflow-table (не голий .opt2) - той самий клас колись знадобиться
   іншій таблиці з іншим порогом (портал теж скоупить на #ecoflow-table). */
@media (max-width: 900px) { .ecoflow-table .opt2 { display: none; } }
.ecoflow-wide { display: none; }
@media (min-width: 1300px) { .ecoflow-wide { display: table-cell; } }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
.badge.ok { background: rgba(76,195,138,.18); color: var(--ok); }
.badge.err { background: rgba(229,83,75,.18); color: var(--err); }
.badge.warn { background: rgba(224,163,62,.18); color: var(--warn); }
.badge.muted { background: rgba(139,148,163,.18); color: var(--muted); }
/* Позначка "це значення несе title-хінт" - той самий портал (CLAUDE.md,
   "Видимість..."): курсор "help" непомітний сам по собі, тому кожен такий
   рядок (mqttDroppedText/mqttHeartbeatText, render.js) супроводжує hintIcon(). */
.hint-mark { color: var(--muted); font-size: .75em; margin-left: .3em; position: relative; top: -0.3em; }
/* Бар heap (System - Memory, render.js: heapBarHtml()) - НЕ з порталу, новий
   віджет цієї сесії. Під dl, не над ним - над dl рвало звичний вигляд
   картки (спершу заголовок, одразу dl, як у решти карток System). Трек
   (фон .heap-bar) - той самий колір, що й .heap-bar-free (порожній
   <div>, без власного фону) - лежить ЗВЕРХУ фону лише заради власного
   hover/title (кожен розмір - used/free/largest/min - окремий елемент із
   власним title, а не один title на увесь бар, за проханням користувача:
   "загальний... незрозуміло як відображати"). Marker - тонка вертикальна
   риска поверх усього (z-index не потрібен - вона останній child). */
.heap-bar { position: relative; height: 20px; border-radius: 4px; background: var(--line);
  overflow: hidden; margin: 10px 0 8px; }
.heap-bar-used, .heap-bar-largest, .heap-bar-free { position: absolute; top: 0; bottom: 0; }
.heap-bar-used { left: 0; background: var(--accent); }
.heap-bar-largest { background: var(--ok); opacity: .55; }
.heap-bar-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--warn); }
.heap-bar-legend { display: flex; flex-wrap: wrap; column-gap: 12px; row-gap: 4px;
  font-size: var(--font-size-small); color: var(--muted); }
/* Кожен пункт легенди - inline-flex, не голий <i> з vertical-align:middle:
   те вирівнювало квадратик до середини x-height ШРИФТУ (за формулою CSS
   "middle"), не до візуального центру рядка тексту поруч - на око виглядало
   "не по центру" (зауваження користувача). Flex-align:center центрує
   квадратик і текст по фактичній висоті обох, без цієї формули. */
.heap-bar-legend span { display: inline-flex; align-items: center; gap: 4px; }
.heap-bar-legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.heap-bar-legend .sw-used { background: var(--accent); }
.heap-bar-legend .sw-largest { background: var(--ok); opacity: .55; }
.heap-bar-legend .sw-free { background: var(--line); border: 1px solid var(--muted); }
.heap-bar-legend .sw-marker { background: var(--warn); }
/* Рівень сигналу - той самий вигляд/CSS, що signal()/.sig у порталі
   (assets/www/index.html): блоки фіксованого розміру, не гліфи ▮/▯ (різна
   ширина в system-ui хитала б шкалу). render.js: signal(rssi, quality). */
.sig { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.sig b { display: inline-flex; gap: var(--sig-bar-gap); margin-right: 4px; }
.sig i { width: var(--sig-bar); height: 11px; border-radius: 2px; background: var(--line); }
.sig i.on { background: var(--accent); }
.sig .q { min-width: 4ch; text-align: right; }
.sig .u, .sig .q { color: var(--muted); }
@media (max-width: 560px) {
  .sig { flex-direction: column; align-items: flex-start; gap: 2px; }
  .sig .val, .sig .q { min-width: 0; text-align: left; }
}
details.raw { margin-top: 10px; }
details.raw summary { cursor: pointer; font-size: var(--font-size-small); color: var(--muted); }
details.raw pre { margin: 6px 0 0; font-size: var(--font-size-small); line-height: 1.45; overflow-x: auto; }
/* Без max-height/overflow-y - навмисно (розділ вище, "flex: 1 0 auto"):
   #log росте разом із секцією/main/тілом, сторінка скролиться сама,
   власного внутрішнього скролу тут більше нема. */
#log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
  background: #0e1116; border: 1px solid var(--line); border-radius: 6px; padding: 4px 0;
  flex: 1 0 auto; }
/* Один DOM-рядок на подію (не textContent-блоб) - grid тримає колонки
   вирівняними, а text-overflow:ellipsis на topic/payload не дає жодній події
   розповзтись на другий рядок, навіть коли payload - кілька КБ JSON
   (система-info). ::before-стрілку тут не тримаємо - для .has-json рядків
   JS сам пише "▸"/"▾" у .log-expand при кожному toggle. */
.log-row { border-bottom: 1px solid #ffffff08; }
.log-row:last-child { border-bottom: none; }
.log-line { display: grid; grid-template-columns: 12px 78px 12px minmax(0,1fr) minmax(0,1.6fr);
  gap: 8px; align-items: baseline; padding: 3px 12px; }
.log-row.has-json .log-line { cursor: pointer; }
.log-row.has-json .log-line:hover { background: #ffffff08; }
.log-expand { color: var(--muted); }
.log-t { color: var(--muted); white-space: nowrap; }
.log-dir { text-align: center; font-weight: 700; }
.log-dir.dir-out { color: var(--accent); }
.log-dir.dir-in { color: var(--text); }
.log-dir.dir-info { color: var(--muted); }
.log-dir.dir-err { color: var(--err); }
/* dir-io - об'єднаний рядок запит+відповідь (mergeReply): 'ok' зелений,
   'error' той самий колір, що й звичайна err-подія. */
.log-dir.dir-io { color: var(--ok); }
.log-row.reply-err .log-dir.dir-io { color: var(--err); }
.log-row.reply-err .log-payload { color: var(--err); }
.log-topic { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-payload { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-row.dir-err .log-payload { color: var(--err); }
/* Pretty JSON - лише для рядків, де payload розпарсився в об'єкт (не для
   "heartbeat" і подібного простого тексту), розгортається кліком по
   .log-line, схований за замовчуванням (`hidden`). Для об'єднаного рядка
   (mergeReply) - дві підписані частини (request/reply) в тому самому блоці. */
/* .log-pretty-body - єдиний реальний flex-child (скрол вмісту, на всю
   висоту .log-pretty). .log-pretty-resize - НЕ flex-child, а
   position:absolute overlay поверх body (position:relative тут же) - не
   position:sticky (той зависав посеред JSON під час скролу, виглядав як
   баг) і не окремий flex-рядок під вмістом (той з'їдав 14px власної
   висоти - під ручкою просто не лишалось тексту, щоб крізь неї щось
   бачити). Overlay напівпрозорий (.log-pretty-resize нижче) - останній
   рядок під ним видно, притлумленим, а не відрізаним. */
.log-pretty { position: relative; margin: 0 12px 8px 38px; background: #00000030;
  border: 1px solid var(--line); border-radius: 4px; max-height: 320px;
  display: flex; flex-direction: column; overflow: hidden; }
/* padding-bottom (22, не 8) - запас під overlay-ручку (14px): реальний
   текст завжди можна доскролити ВИЩЕ ручки, вона перекриває лише цей
   запасний "хвіст", не останній рядок даних. */
.log-pretty-body { padding: 8px 10px 22px; overflow: auto; flex: 1 1 auto;
  font-size: 11.5px; line-height: 1.45; }
.log-pretty-body pre { margin: 0; white-space: pre-wrap; }
.log-pretty-label { color: var(--muted); font-weight: 600; margin: 8px 0 2px; }
.log-pretty-label:first-child { margin-top: 0; }
/* Ручка зміни висоти - Pointer Events (JS, attachResizeHandle), а не
   нативний CSS `resize`: той на тач-браузерах (iOS Safari) підтримується
   неповно/зовсім, Pointer Events працюють однаково для миші, тача й пера.
   Напівпрозорий фон (не лише сама смужка-хват) - текст під ручкою
   лишається читабельним, притлумленим; максимальна висота драгу обмежена
   в JS повною висотою вмісту (body.scrollHeight) - розтягнути порожнечу
   понад те, що реально є в блоці, не можна. */
.log-pretty-resize { position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
  cursor: ns-resize; touch-action: none; display: flex; align-items: center; justify-content: center;
  background: rgba(14, 17, 22, .55); }
.log-pretty-resize:hover, .log-pretty-resize.dragging { background: rgba(14, 17, 22, .8); }
.log-pretty-resize::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .8; }
.log-pretty-resize:hover::before, .log-pretty-resize.dragging::before { opacity: 1; }
.muted { color: var(--muted); }
.checkbox-row { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-small); color: var(--muted); }
.checkbox-row input { width: auto; }

/* Вкладка Commands - той самий словник, що на порталі (assets/www/
   index.html: .cols/.col/.fill/.chip/#cmd-table), тут раніше не потрібний -
   перша вкладка SAPI з двоколонковою розкладкою. */
.fill { flex: 1; min-width: 0; }
.cols { display: flex; gap: 20px; align-items: flex-start; }
.cols > .col { flex: 1; min-width: 0; }
@media (max-width: 900px) { .cols { flex-direction: column; } }
#cmd-run-out { white-space: pre-wrap; word-break: break-word; min-height: 22vh;
  font: var(--font-size-small)/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#cmd-run-input { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#cmd-list-filter { width: 100%; }
#cmd-list-box { max-height: 40vh; overflow-y: auto; margin-top: 8px;
  border: 1px solid var(--line); border-radius: 6px; }
#cmd-list-table td { padding: 4px 10px; vertical-align: baseline; }
#cmd-list-table tr[data-pick] { cursor: pointer; }
#cmd-list-table tr[data-pick]:hover { background: #ffffff0f; }
#cmd-list-table td.n { width: 1%; white-space: nowrap; color: var(--accent);
  font: var(--font-size-small)/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#cmd-list-table td.d { color: var(--muted); font-size: var(--font-size-small); }
/* Пара "запустити / видалити" виглядає й поводиться як одна кнопка -
   буквальний порт .chip з порталу. */
.chip { display: inline-flex; }
.chip button:first-child { border-radius: 6px 0 0 6px; }
.chip button:last-child { border-radius: 0 6px 6px 0; border-left: none; padding: 7px 10px; color: var(--muted); }
.chip[draggable="true"] { cursor: grab; }
.chip.dragging { opacity: .4; }
.chip.drag-before { box-shadow: -5px 0 0 0 var(--accent); }
.chip.drag-after { box-shadow: 5px 0 0 0 var(--accent); }
</style>
</head>
