<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 SAPI</title>
<!--
  Браузерний SAPI-клієнт (docs/mqtt-web-handoff.md, фаза 1/2) - підключається
  НАПРЯМУ до MQTT-брокера (WebSockets), без жодного HTTP-запиту до плати.
  Не частина прошивки: pio run цю теку не бачить (поза src/lib/include),
  хоститься окремо (rpi5, GitHub Pages, локальний файл - будь-що статичне).

  Пре-альфа: маніфест discovery (фаза 2) ще не існує, тому список команд
  нижче (COMMANDS) - жорстко зашитий, той самий allowlist, що в src/main.cpp
  (kJsonApiSystemInfo/kJsonApiWifiStatus/kJsonApiEcoflowStatus/
  kJsonApiMqttStatus). Рендер під конкретні поля кожної команди (render.js:
  renderSystemInfo/renderWifiStatus/renderEcoflowStatus/renderMqttStatus) -
  жорстко прив'язаний до COMMANDS вище, той самий дух пре-альфи: коли
  з'явиться discovery-маніфест, він і замінить цей список разом із
  рендерами на щось, що будується з даних, а не з коду тут. Сирий JSON
  лишається поруч (<details class="raw">) - для діагностики полів, яких
  рендер ще не показує.

  render.js винесений окремим файлом (не в цей інлайн-скрипт) свідомо - той
  самий код без змін прогонить test/render.test.js у Node, без браузера/DOM.

  Розмітка/стиль (header/nav/section/button.act) - буквально той самий
  словник, що й у assets/www/index.html (портал): за проханням користувача
  (сесія 2026-09-23) - форма підключення була "великою" формою по центру
  сторінки, що ховалась після конекту й лишала непослідовний вигляд між
  "до" і "після". Тепер підключення - компактний попап під заголовком
  (клік по індикатору стану), а System/Wi-Fi/EcoFlow/Log - вкладки nav,
  видимі одразу, незалежно від стану з'єднання - той самий каркас, що й
  портал, замість двох по-різному виглядаючих "сторінок".
-->
<style>
:root {
  --bg: #14171c; --panel: #1c2027; --line: #2b313b; --text: #e6e9ef;
  --muted: #8b94a3; --accent: #4da3ff; --ok: #4cc38a; --warn: #e0a33e; --err: #e5534b;
  --sig-bar: 8px; --sig-bar-gap: 3px;
  --font-size-base: 14px;
  --font-scale: 1.125;
  --font-size-small: calc(var(--font-size-base) / var(--font-scale));
  --font-size-medium: calc(var(--font-size-base) * var(--font-scale));
  --font-size-large: calc(var(--font-size-medium) * var(--font-scale));
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* min-height (не height) - тіло росте вище за 100vh, коли вмісту більше за
   екран (Log-вкладка, розділ нижче), а не обрізається на рівні viewport;
   flex-колонка - щоб main (нижче) міг зайняти РЕШТУ висоти, а не лише
   власний вміст. header/nav лишаються без flex:none - дефолтний
   flex:0 1 auto їх і так не розтягує (жодного flex-grow), а стиснення
   ніколи не настає: тіло без фіксованої height, лише min-height, тому
   "дефіциту" простору для flex-shrink не буває в принципі. */
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font: var(--font-size-base)/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: var(--font-size-medium); margin: 0; font-weight: 600; }
header .spacer { flex: 1; }
#device-state { color: var(--muted); font-size: var(--font-size-small); }

/* Індикатор стану - сам кнопка (не декоративний текст): клік відкриває
   попап підключення, коли ми off/connecting, і одразу розриває з'єднання,
   коли on - той самий верхній правий кут, що й раніше показував лише
   напис, тепер ще й керує з'єднанням, без окремої постійної кнопки. */
.conn-wrap { position: relative; }
#conn-toggle { display: flex; align-items: center; gap: 6px; background: none;
  border: 1px solid transparent; border-radius: 6px; padding: 5px 10px;
  font: inherit; font-size: var(--font-size-small); color: var(--muted); cursor: pointer; }
#conn-toggle:hover { border-color: var(--line); color: var(--text); }
#conn-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); flex: none; }
#conn-dot.on { background: var(--ok); }
#conn-dot.connecting { background: var(--warn); }

/* Попап підключення - той самий патерн, що ▾-меню порталу (.menu-wrap/.menu
   в assets/www/index.html): абсолютний блок під кнопкою, а не постійний
   розділ сторінки. Ширший за звичайне меню (форма, не список дій). */
.conn-popover { position: absolute; right: 0; top: calc(100% + 6px); z-index: 15;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px; min-width: 300px; display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 6px 20px #0009; }
.conn-popover h2 { margin: 0; font-size: var(--font-size-medium); }

nav { display: flex; gap: 4px; padding: 8px 16px 0; overflow-x: auto; }
nav button { background: none; border: 1px solid transparent; border-bottom: none;
  color: var(--muted); padding: 7px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit;
  flex: none; white-space: nowrap; }
nav button.active { background: var(--panel); border-color: var(--line); color: var(--text); }
@media (max-width: 560px) {
  nav { position: sticky; top: 0; z-index: 5; background: var(--bg); }
  nav button { padding: 8px 10px; }
}

/* Без max-width - той самий портал (assets/www/index.html: `main { padding:
   0 16px 24px; }`, нічого більше). Раніше тут стояв max-width:960px - лишав
   картки System удвічі вужчими, ніж дозволяє екран, і саме це, разом із
   .out нижче, робило вигляд "зовсім іншим", ніж на порталі (сесія
   2026-09-24). */
/* flex: 1 0 auto (не скорочена "flex:1" = "1 1 0%") - зростає, щоб
   заповнити решту висоти тіла, але НІКОЛИ не стискається нижче власного
   вмісту (shrink:0). Той самий патерн нижче - на Log-секції й на #log
   самому - три ланки одного ланцюга: тіло без фіксованої height (вище) ->
   main росте до решти екрана -> активна Log-секція росте до решти main ->
   #log росте до решти секції. Розтягування, вимкнене на shrink, означає:
   короткий лог - блок все одно на всю доступну висоту; довгий лог - блок
   росте понад екран, скролиться СТОРІНКА, не #log. */
main { padding: 0 16px 24px; flex: 1 0 auto; display: flex; flex-direction: column; }
section { display: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 0 8px 8px 8px; padding: 16px; }
section.active { display: block; }
/* Вужчий за .active селектор ([data-tab="log"] додає специфічність) - лише
   Log-секція стає flex-колонкою на всю решту main; System/Wi-Fi/EcoFlow
   лишаються звичайним display:block (їхня верстка карток/kv не потребує
   full-height розтягування, займають рівно стільки, скільки треба). */
section[data-tab="log"].active { display: flex; flex-direction: column; flex: 1 0 auto; }
section > h2:first-child, .card > h2:first-child { margin-top: 0; }
h2 { font-size: var(--font-size-large); text-transform: uppercase; letter-spacing: .05em;
  color: var(--text); margin: 24px 0 10px; font-weight: 600; }
h2 span { text-transform: none; letter-spacing: 0; }
h2.hrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2.hrow .act { margin-left: auto; font-size: var(--font-size-small); padding: 4px 10px;
  text-transform: none; letter-spacing: 0; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
/* Стековий підпис-над-полем - лише для форми підключення (6 різнорідних
   полів, короткий підпис над кожним читається швидше за самі плейсхолдери).
   Поза попапом (checkbox-row, майбутні форми) label лишається звичайним
   inline-рядком - раніше загальне правило "усі label - колонка" ламало
   .checkbox-row (AUTO переносився під чекбокс). */
.conn-popover label { display: flex; flex-direction: column; gap: 4px; font-size: var(--font-size-small);
  color: var(--muted); flex: 1; min-width: 140px; }
/* .checkbox-row (Auto-connect) усередині попапу - той самий чекбокс-поруч-
   з-текстом рядок, що й на System/Wi-Fi/EcoFlow (AUTO), не стековий підпис-
   над-полем: правило вище (.conn-popover label) інакше зламало б і цей
   чекбокс так само, як раніше ламало AUTO поза попапом. */
.conn-popover label.checkbox-row { flex-direction: row; align-items: center; min-width: 0; }
input, select { background: var(--bg); border: 1px solid var(--line); color: var(--text);
  border-radius: 6px; padding: 7px 10px; font: inherit; }
input:focus { outline: 1px solid var(--accent); }

button.act { background: var(--accent); border: none; color: #06121f; padding: 7px 14px;
  border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; }
button.act.ghost { background: none; border: 1px solid var(--line); color: var(--text); font-weight: 400; }
button.act:disabled { opacity: .5; cursor: default; }
button.act.ghost.danger { color: var(--err); }
button.act.ghost.danger:hover { border-color: var(--err); }
/* Стан "призупинено" (#btn-log-pause) - видима позначка, не лише зміна
   підпису (Pause -> Resume): той самий принцип, що hintIcon()/hint-mark -
   прихований стан, який видно лише прочитавши текст кнопки, легко
   пропустити на біглий погляд. */
button.act.ghost.paused { border-color: var(--warn); color: var(--warn); }

.cmd-status { font-size: var(--font-size-small); color: var(--muted); font-weight: 400; }
.cmd-status.ok { color: var(--ok); }
.cmd-status.err { color: var(--err); }
/* font-size тут НЕ small - портал жодного разу не зменшує кегль dl/картки,
   лише консольні/monospace блоки (#log нижче). Раніше .out форсував small
   на весь вміст, включно з картками System - звідси й "трохи менший за
   портал текст" (сесія 2026-09-24). */
.out { background: #0e1116; border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 12px; line-height: 1.5; max-height: 420px; overflow-y: auto; }
/* Картковий вивід (System, renderSystemInfo) не отримує темну рамку/власний
   скрол консолі - портал не кладе картки в жодну додаткову коробку, вони
   лежать просто на тлі секції (assets/www/index.html, #sys-cards). Раніше
   .out малював ще одну рамку НАВКОЛО карток і різав їх висоту скролом -
   саме "коробка в коробці" й відрізняла SAPI від порталу найбільше. Інші
   команди (wifi-status/ecoflow-status) поки лишаються звичайним kv/badge-
   виводом у консольній рамці - :has() відрізняє один випадок від іншого
   без додаткового класу в розмітці чи в JS. */
.out:has(.cards) { background: none; border: none; padding: 0; max-height: none; overflow: visible; }
/* dl/dt/dd - той самий глобальний вигляд, що в assets/www/index.html
   (портал), не власний клас .kv: System-вкладка (render.js,
   renderSystemInfo) тепер емітить голий <dl>, як і портал. wifi-status/
   ecoflow-status поки лишаються на .kv/badge - наступний крок, не цей. */
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 5px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.section-group { margin-top: 12px; }
.section-group h3 { margin: 0 0 6px; font-size: var(--font-size-small); color: var(--muted); font-weight: 600;
  text-transform: uppercase; letter-spacing: .03em; }
/* Картки System - той самий словник, що #sys-cards/.card у порталі:
   flex-wrap рядок карток, кожна росте до 300px, а не жорсткі 2 колонки -
   кількість карток (Device/Memory/LittleFS/SD/NVS/Modules) не ділиться
   рівно навпіл на жодній ширині. */
.cards { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 12px; flex: 1 1 300px; min-width: 260px; }
.card dl { grid-template-columns: max-content 1fr; }
/* Другорядне уточнення в значенні (кількість переходів, Гц, "(inferred)") -
   власним рядком під основним, не впритул через " · " (та сама причина, що
   в порталі: переносилось би посередині слова на вузькій картці). */
.eco-sub { display: block; color: var(--muted); font-size: var(--font-size-small); margin-top: 1px; }
.eco-counts { display: flex; flex-wrap: wrap; column-gap: 6px; row-gap: 2px; }
.eco-counts span:not(:last-child)::after { content: " ·"; color: var(--muted); }
/* Компактний перелік пристроїв EcoFlow у System-картці - 1:1 з порталом
   (assets/www/index.html, ecoSysDeviceRow()/renderEcoflowSystemSummary()):
   згорнутий рядок - охайна табличка (grid, не вільний текст через " · "),
   розгорнутий <details> додає ті самі поля, що повна картка вкладки
   EcoFlow (ecoDeviceDetailRows() - render.js, спільна з нею). */
.sys-eco-devices { margin-top: 16px; }
.sys-eco-device { padding: 3px 0; }
.sys-eco-device[open] { border-top: 0 solid var(--line); border-bottom: 1px solid var(--line);
  margin: 2px 0; padding: 3px 0 8px 0; }
.sys-eco-device summary { cursor: pointer; user-select: none; list-style: none; }
.sys-eco-device summary::-webkit-details-marker { display: none; }
/* Каретка - руками замість штатного трикутника <summary> (штатний живе лише
   при display:list-item, а рядок нижче - grid). */
.sys-eco-device summary { display: grid; grid-template-columns: 12px 1fr 62px 44px;
  column-gap: 8px; align-items: baseline; }
.sys-eco-device summary .eco-caret { color: var(--muted); transition: transform .15s; }
.sys-eco-device[open] summary .eco-caret { transform: rotate(90deg); }
.sys-eco-device summary .eco-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sys-eco-device summary .eco-charge, .sys-eco-device summary .eco-remain { text-align: right;
  font-variant-numeric: tabular-nums; }
.sys-eco-device summary .eco-remain { display: none; }
@media (min-width: 1300px) {
  .sys-eco-device summary { grid-template-columns: 12px 1fr 62px 44px 56px; }
  .sys-eco-device summary .eco-remain { display: inline; }
}
.sys-eco-device dl { margin-top: 8px; }
table.zebra { width: 100%; border-collapse: collapse; margin-top: 6px; }
table.zebra th, table.zebra td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
/* th БІЛЬШОГО кегля за td, не меншого - той самий портал (assets/www/
   index.html): "заголовок стовпчика дрібнішим за власний вміст" - це саме
   те, що там свідомо виправили (CLAUDE.md-стиль коментаря на місці). */
table.zebra th { color: var(--muted); font-weight: 600; font-size: var(--font-size-medium);
  text-transform: uppercase; letter-spacing: .04em; }
table.zebra thead th { background: #ffffff05; }
table.zebra tbody tr:nth-child(even) { background: #ffffff05; }
td.num { text-align: right; font-variant-numeric: tabular-nums; width: 1%; white-space: nowrap; }
th.num { text-align: right; }
td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (max-width: 560px) { .opt { display: none; } dl { grid-template-columns: 1fr; } }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
.badge.ok { background: rgba(76,195,138,.18); color: var(--ok); }
.badge.err { background: rgba(229,83,75,.18); color: var(--err); }
.badge.warn { background: rgba(224,163,62,.18); color: var(--warn); }
.badge.muted { background: rgba(139,148,163,.18); color: var(--muted); }
/* Позначка "це значення несе title-хінт" - той самий портал (CLAUDE.md,
   "Видимість..."): курсор "help" непомітний сам по собі, тому кожен такий
   рядок (mqttDroppedText/mqttHeartbeatText, render.js) супроводжує hintIcon(). */
.hint-mark { color: var(--muted); font-size: .75em; margin-left: .3em; position: relative; top: -0.3em; }
/* Бар heap (System - Memory, render.js: heapBarHtml()) - НЕ з порталу, новий
   віджет цієї сесії. Під dl, не над ним - над dl рвало звичний вигляд
   картки (спершу заголовок, одразу dl, як у решти карток System). Трек
   (фон .heap-bar) - той самий колір, що й .heap-bar-free (порожній
   <div>, без власного фону) - лежить ЗВЕРХУ фону лише заради власного
   hover/title (кожен розмір - used/free/largest/min - окремий елемент із
   власним title, а не один title на увесь бар, за проханням користувача:
   "загальний... незрозуміло як відображати"). Marker - тонка вертикальна
   риска поверх усього (z-index не потрібен - вона останній child). */
.heap-bar { position: relative; height: 20px; border-radius: 4px; background: var(--line);
  overflow: hidden; margin: 10px 0 8px; }
.heap-bar-used, .heap-bar-largest, .heap-bar-free { position: absolute; top: 0; bottom: 0; }
.heap-bar-used { left: 0; background: var(--accent); }
.heap-bar-largest { background: var(--ok); opacity: .55; }
.heap-bar-marker { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--warn); }
.heap-bar-legend { display: flex; flex-wrap: wrap; column-gap: 12px; row-gap: 4px;
  font-size: var(--font-size-small); color: var(--muted); }
/* Кожен пункт легенди - inline-flex, не голий <i> з vertical-align:middle:
   те вирівнювало квадратик до середини x-height ШРИФТУ (за формулою CSS
   "middle"), не до візуального центру рядка тексту поруч - на око виглядало
   "не по центру" (зауваження користувача). Flex-align:center центрує
   квадратик і текст по фактичній висоті обох, без цієї формули. */
.heap-bar-legend span { display: inline-flex; align-items: center; gap: 4px; }
.heap-bar-legend .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; flex: none; }
.heap-bar-legend .sw-used { background: var(--accent); }
.heap-bar-legend .sw-largest { background: var(--ok); opacity: .55; }
.heap-bar-legend .sw-free { background: var(--line); border: 1px solid var(--muted); }
.heap-bar-legend .sw-marker { background: var(--warn); }
/* Рівень сигналу - той самий вигляд/CSS, що signal()/.sig у порталі
   (assets/www/index.html): блоки фіксованого розміру, не гліфи ▮/▯ (різна
   ширина в system-ui хитала б шкалу). render.js: signal(rssi, quality). */
.sig { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.sig b { display: inline-flex; gap: var(--sig-bar-gap); margin-right: 4px; }
.sig i { width: var(--sig-bar); height: 11px; border-radius: 2px; background: var(--line); }
.sig i.on { background: var(--accent); }
.sig .q { min-width: 4ch; text-align: right; }
.sig .u, .sig .q { color: var(--muted); }
@media (max-width: 560px) {
  .sig { flex-direction: column; align-items: flex-start; gap: 2px; }
  .sig .val, .sig .q { min-width: 0; text-align: left; }
}
details.raw { margin-top: 10px; }
details.raw summary { cursor: pointer; font-size: var(--font-size-small); color: var(--muted); }
details.raw pre { margin: 6px 0 0; font-size: var(--font-size-small); line-height: 1.45; overflow-x: auto; }
/* Без max-height/overflow-y - навмисно (розділ вище, "flex: 1 0 auto"):
   #log росте разом із секцією/main/тілом, сторінка скролиться сама,
   власного внутрішнього скролу тут більше нема. */
#log { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px;
  background: #0e1116; border: 1px solid var(--line); border-radius: 6px; padding: 4px 0;
  flex: 1 0 auto; }
/* Один DOM-рядок на подію (не textContent-блоб) - grid тримає колонки
   вирівняними, а text-overflow:ellipsis на topic/payload не дає жодній події
   розповзтись на другий рядок, навіть коли payload - кілька КБ JSON
   (система-info). ::before-стрілку тут не тримаємо - для .has-json рядків
   JS сам пише "▸"/"▾" у .log-expand при кожному toggle. */
.log-row { border-bottom: 1px solid #ffffff08; }
.log-row:last-child { border-bottom: none; }
.log-line { display: grid; grid-template-columns: 12px 78px 12px minmax(0,1fr) minmax(0,1.6fr);
  gap: 8px; align-items: baseline; padding: 3px 12px; }
.log-row.has-json .log-line { cursor: pointer; }
.log-row.has-json .log-line:hover { background: #ffffff08; }
.log-expand { color: var(--muted); }
.log-t { color: var(--muted); white-space: nowrap; }
.log-dir { text-align: center; font-weight: 700; }
.log-dir.dir-out { color: var(--accent); }
.log-dir.dir-in { color: var(--text); }
.log-dir.dir-info { color: var(--muted); }
.log-dir.dir-err { color: var(--err); }
/* dir-io - об'єднаний рядок запит+відповідь (mergeReply): 'ok' зелений,
   'error' той самий колір, що й звичайна err-подія. */
.log-dir.dir-io { color: var(--ok); }
.log-row.reply-err .log-dir.dir-io { color: var(--err); }
.log-row.reply-err .log-payload { color: var(--err); }
.log-topic { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-payload { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-row.dir-err .log-payload { color: var(--err); }
/* Pretty JSON - лише для рядків, де payload розпарсився в об'єкт (не для
   "heartbeat" і подібного простого тексту), розгортається кліком по
   .log-line, схований за замовчуванням (`hidden`). Для об'єднаного рядка
   (mergeReply) - дві підписані частини (request/reply) в тому самому блоці. */
/* .log-pretty-body - єдиний реальний flex-child (скрол вмісту, на всю
   висоту .log-pretty). .log-pretty-resize - НЕ flex-child, а
   position:absolute overlay поверх body (position:relative тут же) - не
   position:sticky (той зависав посеред JSON під час скролу, виглядав як
   баг) і не окремий flex-рядок під вмістом (той з'їдав 14px власної
   висоти - під ручкою просто не лишалось тексту, щоб крізь неї щось
   бачити). Overlay напівпрозорий (.log-pretty-resize нижче) - останній
   рядок під ним видно, притлумленим, а не відрізаним. */
.log-pretty { position: relative; margin: 0 12px 8px 38px; background: #00000030;
  border: 1px solid var(--line); border-radius: 4px; max-height: 320px;
  display: flex; flex-direction: column; overflow: hidden; }
/* padding-bottom (22, не 8) - запас під overlay-ручку (14px): реальний
   текст завжди можна доскролити ВИЩЕ ручки, вона перекриває лише цей
   запасний "хвіст", не останній рядок даних. */
.log-pretty-body { padding: 8px 10px 22px; overflow: auto; flex: 1 1 auto;
  font-size: 11.5px; line-height: 1.45; }
.log-pretty-body pre { margin: 0; white-space: pre-wrap; }
.log-pretty-label { color: var(--muted); font-weight: 600; margin: 8px 0 2px; }
.log-pretty-label:first-child { margin-top: 0; }
/* Ручка зміни висоти - Pointer Events (JS, attachResizeHandle), а не
   нативний CSS `resize`: той на тач-браузерах (iOS Safari) підтримується
   неповно/зовсім, Pointer Events працюють однаково для миші, тача й пера.
   Напівпрозорий фон (не лише сама смужка-хват) - текст під ручкою
   лишається читабельним, притлумленим; максимальна висота драгу обмежена
   в JS повною висотою вмісту (body.scrollHeight) - розтягнути порожнечу
   понад те, що реально є в блоці, не можна. */
.log-pretty-resize { position: absolute; left: 0; right: 0; bottom: 0; height: 14px;
  cursor: ns-resize; touch-action: none; display: flex; align-items: center; justify-content: center;
  background: rgba(14, 17, 22, .55); }
.log-pretty-resize:hover, .log-pretty-resize.dragging { background: rgba(14, 17, 22, .8); }
.log-pretty-resize::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--accent); opacity: .8; }
.log-pretty-resize:hover::before, .log-pretty-resize.dragging::before { opacity: 1; }
.muted { color: var(--muted); }
.checkbox-row { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-small); color: var(--muted); }
.checkbox-row input { width: auto; }
</style>
</head>
<body>

<header>
  <h1>ESP32 SAPI</h1>
  <span id="sapi-revision" class="muted"></span>
  <span class="spacer"></span>
  <span id="device-state"></span>
  <div class="conn-wrap">
    <button id="conn-toggle" type="button"><span id="conn-dot"></span><span id="conn-label">disconnected</span></button>
    <div id="conn-popover" class="conn-popover" hidden>
      <h2>Connection</h2>
      <div class="row">
        <label>Broker host<input id="f-host" placeholder="192.168.1.22" autocomplete="off"></label>
        <label>Port<input id="f-port" placeholder="9001" autocomplete="off"></label>

        <label>Device client-id<input id="f-client" placeholder="mqtt-esp32-c3" autocomplete="off"></label>
      </div>

      </div>
      <div class="row">

        <span class="spacer"></span>

    </div>
  </div>
</header>

<nav>
  <button class="active" data-tab="system-info">System</button>
  <button data-tab="wifi-status">Wi-Fi</button>
  <button data-tab="ecoflow-status">EcoFlow</button>
  <button data-tab="mqtt-status">MQTT</button>
  <button data-tab="log">Log</button>
</nav>

<main>

  <section class="active cmd-section" data-tab="system-info" data-cmd="system-info">
    <h2 class="hrow">system-info <span class="cmd-status muted">-</span><span class="spacer"></span>
      <label class="checkbox-row"><input type="checkbox" class="auto-toggle">auto</label>
      <button class="btn-refresh act ghost" disabled>Refresh</button>
    </h2>
    <div class="out">-</div>
  </section>

  <section class="cmd-section" data-tab="wifi-status" data-cmd="wifi-status">
    <h2 class="hrow">wifi-status <span class="cmd-status muted">-</span><span class="spacer"></span>
      <label class="checkbox-row"><input type="checkbox" class="auto-toggle">auto</label>
      <button class="btn-refresh act ghost" disabled>Refresh</button>
    </h2>
    <div class="out">-</div>
  </section>

  <section class="cmd-section" data-tab="ecoflow-status" data-cmd="ecoflow-status">
    <h2 class="hrow">ecoflow-status <span class="cmd-status muted">-</span><span class="spacer"></span>
      <label class="checkbox-row"><input type="checkbox" class="auto-toggle">auto</label>
      <button class="btn-refresh act ghost" disabled>Refresh</button>
    </h2>
    <div class="out">-</div>
  </section>

  <section class="cmd-section" data-tab="mqtt-status" data-cmd="mqtt-status">
    <h2 class="hrow">mqtt-status <span class="cmd-status muted">-</span><span class="spacer"></span>
      <label class="checkbox-row"><input type="checkbox" class="auto-toggle">auto</label>
      <button class="btn-refresh act ghost" disabled>Refresh</button>
    </h2>
    <div class="out">-</div>
  </section>

  <section data-tab="log">
    <h2 class="hrow">Log <span class="muted" style="font-weight:400; font-size:var(--font-size-small)">(останні 500 рядків)</span><span class="spacer"></span>
      <button id="btn-log-pause" class="act ghost">Pause</button>
      <label class="checkbox-row"><input type="checkbox" id="log-newest-first" data-persist="newest-first">Newest first</label>
      <button id="btn-clear-log" class="act ghost">Clear</button>
    </h2>
    <div id="log"></div>
  </section>

</main>

<script src="revision.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script src="render.js"></script>
<script>
(() => {
  'use strict';

  // Пре-альфа allowlist - той самий, що в src/main.cpp (kJsonApi*). Коли
  // з'явиться discovery-маніфест (фаза 2), цей список замінить сам себе на
  // дані з брокера, а не буде жорстко зашитим тут.
  const COMMANDS = ['system-info', 'wifi-status', 'ecoflow-status', 'mqtt-status'];
  const AUTO_BASE_MS = 5000;
  const AUTO_BACKOFF_MAX = 8; // множник база: 5с -> 40с максимум при busy
  const LOG_MAX_LINES = 500;

  const STORAGE_KEY = 'sapi.connection.v1';

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  // localStorage - лише зручність цього браузера (форма підключення "як
  // минулого разу"), не критичний стан: обгортаємо в try/catch, бо приватні
  // вікна/заблоковане сховище кидають виняток, а не повертають null.
  function loadConn() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    } catch (e) {
      return {};
    }
  }
  function saveConn(conn) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conn));
    } catch (e) { /* ігнор - форма й так лишається заповненою в DOM */ }
  }
  function forgetConn() {
    try {
      localStorage.removeItem(STORAGE_KEY);
    } catch (e) { /* нічого критичного */ }
  }

  // Персист UI-чекбоксів/перемикачів сторінки (ПРАВИЛО НА МАЙБУТНЄ: якщо
  // з'являється контрол, що керує ВИГЛЯДОМ/поведінкою сторінки - будь-який
  // чекбокс, перемикач, збережений порядок тощо - він має пережити
  // refresh і re-connect, а не скидатись до дефолту щоразу). Один спільний
  // ключ (не по одному localStorage-ключу на кожен контрол, як раніше було
  // для "Newest first" саме собою) - новий контрол просто додає своє поле в
  // той самий об'єкт, без нового STORAGE_KEY і без правок тут.
  //
  // Пишемо ОДРАЗУ на зміну (saveUiToggle нижче, викликається з кожного
  // change-обробника). Читаємо - НЕ одразу при завантаженні сторінки, а
  // саме при connected (applyPersistedToggles(), викликається з
  // client.on('connect') нижче): для "Auto" це єдиний момент, коли
  // відновлення взагалі має сенс (requestCmd()/scheduleAuto() всередині
  // change-обробника нічого не зроблять без живого client) - тому й решта
  // контролів (Newest first, Pause) читаються в той самий момент, а не
  // раніше, заради ОДНОГО правила для всіх, а не для кожного свого часу
  // відновлення.
  const UI_TOGGLES_KEY = 'sapi.uiToggles.v1';
  function loadUiToggles() {
    try {
      return JSON.parse(localStorage.getItem(UI_TOGGLES_KEY) || '{}');
    } catch (e) {
      return {};
    }
  }
  function saveUiToggle(key, value) {
    try {
      const all = loadUiToggles();
      all[key] = value;
      localStorage.setItem(UI_TOGGLES_KEY, JSON.stringify(all));
    } catch (e) { /* нічого критичного - контрол лишається в поточному DOM-стані */ }
  }
  // Будь-який <input type="checkbox" data-persist="..."> - автоматично: за
  // ключ править сам data-persist (унікальний, тому кілька контролів не
  // затирають одне одного в тому самому об'єкті). Новий чекбокс у
  // майбутньому - лише додати data-persist у розмітці (чи виставити його
  // програмно, як autoToggle.dataset.persist нижче) - без правок цієї функції.
  //
  // ФУНКЦІЯ, не одразу виконаний цикл: .auto-toggle отримує свій
  // data-persist ПРОГРАМНО, у циклі створення панелей (нижче за файлом,
  // ще не виконаний у цій точці скрипта) - querySelectorAll() тут одразу
  // впіймав би лише "Newest first" (data-persist у статичній розмітці) і
  // жоден .auto-toggle, бо в них атрибута ще нема. Викликається explicit
  // одним рядком одразу ПІСЛЯ циклу створення панелей нижче.
  function wireAllPersistedCheckboxes() {
    for (const el of $$('input[type="checkbox"][data-persist]')) {
      el.addEventListener('change', () => saveUiToggle(el.dataset.persist, el.checked));
    }
  }
  // Pause - кнопка, не чекбокс (розділ нижче, "Log pause/resume"), тому не
  // підхоплюється циклом вище - той самий ключ у тому самому об'єкті,
  // записується/читається окремим викликом saveUiToggle()/loadUiToggles()
  // поруч із setLogPaused() (визначена нижче, після #log-newest-first).
  function applyPersistedToggles() {
    const saved = loadUiToggles();
    for (const el of $$('input[type="checkbox"][data-persist]')) {
      const key = el.dataset.persist;
      if (key in saved && el.checked !== saved[key]) {
        el.checked = saved[key];
        // dispatchEvent, не пряме присвоєння - той самий change-обробник, що
        // й на ручний клік, сам застосовує ефект (перемальовка порядку логу,
        // requestCmd()+scheduleAuto() для "Auto") - другого місця з тією
        // самою логікою не заводимо (DRY).
        el.dispatchEvent(new Event('change'));
      }
    }
    if ('log-paused' in saved) setLogPaused(saved['log-paused']);
  }

  function readForm() {
    return {
      host: $('#f-host').value.trim(),
      port: $('#f-port').value.trim() || '9001',
      prefix: $('#f-prefix').value.trim() || 'mykola-lavryk',
      username: $('#f-user').value.trim(),
      password: $('#f-pass').value,
      clientId: $('#f-client').value.trim(),
      autoLogin: $('#f-autologin').checked,
    };
  }
  function fillForm(conn) {
    $('#f-host').value = conn.host || '';
    $('#f-port').value = conn.port || '9001';
    $('#f-prefix').value = conn.prefix || 'mykola-lavryk';
    $('#f-user').value = conn.username || '';
    $('#f-pass').value = conn.password || '';
    $('#f-client').value = conn.clientId || '';
    // Дефолт - вимкнено: автоконект без явної згоди користувача - це те, що
    // могло б непомітно з'єднатись із чужим брокером на чужому Wi-Fi
    // (ноутбук з локальним файлом сторінки в кишені). Увімкнено лише якщо
    // користувач сам поставив галочку минулого разу (autoLogin===true).
    $('#f-autologin').checked = conn.autoLogin === true;
  }
  // Чекбокс autoLogin зберігається одразу на зміну (merge в збережений
  // об'єкт, не перезапис усієї форми) - незалежно від того, чи користувач
  // потім натисне Connect, Disconnect, чи взагалі нічого. Раніше значення
  // зберігалось лише всередині connect() (readForm() там же) - тому знята
  // під час перегляду попапу галочка губилась на Disconnect, який форму не
  // читав узагалі.
  $('#f-autologin').addEventListener('change', () => {
    const conn = loadConn();
    conn.autoLogin = $('#f-autologin').checked;
    saveConn(conn);
  });

  fillForm(loadConn());

  // --- лог (вкладка Log) ---
  // Один DOM-рядок на подію (не textContent-блоб, як було раніше) -
  // time/dir/topic/payload у grid-колонках з ellipsis, тому подія завжди
  // лишається одним рядком, навіть коли payload - кілька КБ JSON
  // (system-info). Pretty-друк JSON - лише по кліку на рядок (`has-json`).
  //
  // Запит і відповідь з тим самим `id` (кореляція SAPI, docs/
  // mqtt-web-handoff.md, "Погоджені рішення фази 1") зводяться в ОДИН
  // рядок, а не два: `pendingRequests` тримає щойно залогований запит, поки
  // не прийде відповідь із тим самим id (mergeReply() дописує її в ТОЙ
  // САМИЙ рядок) або поки рядок не витіснеться зі старості
  // (evictOldestRow() прибирає його з мапи теж - інакше вона росла б без
  // обмеження на пристрої, що ніколи не відповідає).
  const DIR_LABEL = { out: '>', in: '<', info: 'i', err: '!', io: '⇄' };
  // logRows - завжди хронологічний порядок (push = найновіший в кінці),
  // незалежно від того, як його показано - "порядок зберігання" і "порядок
  // показу" свідомо розведені: evictOldestRow() (найстаріший - завжди
  // logRows[0]) і кореляція id в pendingRequests не залежать від чекбокса
  // "Newest first" нижче, лише DOM-вставка (logEvent) на нього зважає.
  const logRows = [];
  const pendingRequests = new Map(); // id -> рядок запиту, що ще чекає на reply

  // Дефолт - вгору (checked у розмітці нема, але JS-стан і чекбокс
  // синхронізовані рядком нижче): сторінка сама росте (без внутрішнього
  // скролу #log, розділ вище), тож найновіший рядок одразу видно, не
  // гортаючи вниз через екрани вже накопиченого логу. Персист - НЕ окремий
  // ключ (як було) - `data-persist="newest-first"` у розмітці, той самий
  // спільний механізм, що описаний вище ("Персист UI-чекбоксів"):
  // відновлюється при connected (applyPersistedToggles()), не тут.
  let logNewestFirst = true;
  const logOrderCheckbox = $('#log-newest-first');
  logOrderCheckbox.checked = logNewestFirst;
  logOrderCheckbox.addEventListener('change', () => {
    logNewestFirst = logOrderCheckbox.checked;
    // Перевпорядкувати вже наявні рядки теж, не лише майбутні - append() з
    // уже прикріпленими вузлами ПЕРЕСУВАЄ їх (Node лишається єдиним в DOM),
    // повторного створення рядків не треба.
    const ordered = logNewestFirst ? [...logRows].reverse() : logRows;
    $('#log').append(...ordered);
  });

  // Pause/resume ЛИШЕ показу логу, не самого MQTT-трафіку: підписки й
  // request/reply (renderReply(), System-панель) працюють незалежно від
  // цього прапорця - client.on('message') і далі викликає обробку команд,
  // логу торкається лише сам logEvent() нижче. Події під час паузи
  // ПРОПУСКАЮТЬСЯ, не буферизуються - той самий принцип, що й для решти
  // логів проєкту (CLAUDE.md - "лог можна губити, команду - ні"): показати
  // назад усе, що трапилось "поки дивився", ускладнило б і код, і сприйняття
  // (розрив у часі рядків був би непомітним), а сама мета паузи - просто
  // зафіксувати вигляд на екрані на хвилину, не архів.
  let logPaused = false;
  const logPauseBtn = $('#btn-log-pause');
  // Окрема функція (не лише інлайн у click) - той самий сеттер викликає й
  // клік користувача, і відновлення при connected (applyPersistedToggles()
  // вище, "Персист UI-чекбоксів") - друге місце з тією самою логікою
  // (текст/клас кнопки) не заводимо (DRY).
  function setLogPaused(paused) {
    logPaused = paused;
    logPauseBtn.textContent = logPaused ? 'Resume' : 'Pause';
    logPauseBtn.classList.toggle('paused', logPaused);
  }
  logPauseBtn.addEventListener('click', () => {
    setLogPaused(!logPaused);
    saveUiToggle('log-paused', logPaused);
  });

  function prettyBlock(rawText) {
    const pre = document.createElement('pre');
    try {
      const v = JSON.parse(rawText);
      pre.textContent = (v && typeof v === 'object') ? JSON.stringify(v, null, 2) : rawText;
    } catch (e) {
      pre.textContent = rawText; // не JSON (heartbeat тощо) - як є
    }
    return pre;
  }
  function prettyLabeled(label, timeStr, rawText) {
    const frag = document.createDocumentFragment();
    const lab = document.createElement('div');
    lab.className = 'log-pretty-label';
    lab.textContent = `${label} · ${timeStr}`;
    frag.appendChild(lab);
    frag.appendChild(prettyBlock(rawText));
    return frag;
  }

  // Ручка зміни висоти .log-pretty - Pointer Events, не нативний CSS
  // `resize` (той на iOS Safari не працює тачем узагалі). setPointerCapture
  // прив'язує подальші move/up до САМОЇ ручки, незалежно від того, куди
  // фізично зʼїхав палець/курсор - document-рівневих слухачів не треба.
  // Стартова висота - поточна відрендерена (getBoundingClientRect), а не
  // CSS max-height - працює однаково, чи вміст був "своєю" висотою, чи вже
  // раз розтягнутий користувачем раніше. maxTotal - висота, за якою body
  // вже показує ввесь вміст без власного скролу (body.scrollHeight) - ручка
  // тепер overlay (CSS, position:absolute), не власний flex-рядок, тому
  // додавати її висоту зверху не треба (padding-bottom body вже несе запас
  // під неї). Рахується ОДИН раз на pointerdown (не на кожен pointermove -
  // зайвий reflow), далі drag просто клемпиться нею - розтягнути блок
  // більше, ніж є реального вмісту, не можна.
  function attachResizeHandle(pretty, body) {
    const handle = document.createElement('div');
    handle.className = 'log-pretty-resize';
    handle.title = 'потягнути - змінити висоту блока';
    let startY = 0;
    let startH = 0;
    let maxTotal = Infinity;
    handle.addEventListener('pointerdown', (ev) => {
      ev.preventDefault(); // не тягнути виділення тексту під час драгу
      handle.setPointerCapture(ev.pointerId);
      startY = ev.clientY;
      startH = pretty.getBoundingClientRect().height;
      maxTotal = body.scrollHeight;
      handle.classList.add('dragging');
    });
    handle.addEventListener('pointermove', (ev) => {
      if (!handle.classList.contains('dragging')) return;
      pretty.style.maxHeight = 'none'; // інакше CSS max-height:320px ріже ріст
      const h = Math.max(60, startH + (ev.clientY - startY));
      pretty.style.height = Math.min(h, maxTotal) + 'px';
    });
    handle.addEventListener('pointerup', (ev) => {
      handle.classList.remove('dragging');
      handle.releasePointerCapture(ev.pointerId);
    });
    pretty.appendChild(handle);
  }
  // Спільний шлях наповнення .log-pretty (одиночне повідомлення й
  // mergeReply) - завжди чистить і заново кладе вміст у .log-pretty-body +
  // ручку одним викликом, щоб жодне місце не забуло причепити ручку після
  // innerHTML=''. Body - окремий скрольований елемент (не сам .log-pretty) -
  // саме це розводить вміст і ручку по різних flex-дітях (CSS вище).
  function setPrettyContent(pretty, ...nodes) {
    pretty.innerHTML = '';
    const body = document.createElement('div');
    body.className = 'log-pretty-body';
    for (const n of nodes) body.appendChild(n);
    pretty.appendChild(body);
    attachResizeHandle(pretty, body);
  }

  function evictOldestRow() {
    const old = logRows.shift();
    if (old._reqId !== undefined && pendingRequests.get(old._reqId) === old) {
      pendingRequests.delete(old._reqId);
    }
    old.remove();
  }

  function mergeReply(reqRow, replyTime, replyRaw, replyParsed) {
    reqRow.classList.remove('dir-out');
    reqRow.classList.add('dir-io', replyParsed.ok === false ? 'reply-err' : 'reply-ok');

    const line = $('.log-line', reqRow);
    const dirEl = $('.log-dir', line);
    dirEl.className = 'log-dir dir-io';
    dirEl.textContent = DIR_LABEL.io;

    const dtMs = Math.round(performance.now() - (reqRow._reqT0 || performance.now()));
    const statusText = replyParsed.ok === false ? `error: ${replyParsed.error || '?'}` : 'ok';
    $('.log-payload', line).textContent = `id ${replyParsed.id} · ${statusText} · ${dtMs} ms`;

    // Pretty з одного повідомлення (запиту, залогованого раніше) стає
    // pretty з ДВОХ підписаних частин - request/reply - у тому самому
    // елементі, той самий click-toggle (line нижче), що вже навішаний.
    const pretty = $('.log-pretty', reqRow);
    setPrettyContent(pretty,
      prettyLabeled('→ request', reqRow._reqTime, reqRow._reqRaw),
      prettyLabeled('← reply', replyTime, replyRaw));
  }

  function logEvent(dir, topic, payloadText, note) {
    if (logPaused) return; // показ призупинено - подія не записується (не буферизується на потім)
    const el = $('#log');
    const t = new Date().toLocaleTimeString();
    const raw = payloadText != null ? payloadText : (note || '');

    let parsed = null;
    if (payloadText != null) {
      try {
        const v = JSON.parse(payloadText);
        if (v && typeof v === 'object') parsed = v;
      } catch (e) { /* не JSON - heartbeat тощо, лишається простим текстом */ }
    }

    if (dir === 'in' && parsed && parsed.id !== undefined && pendingRequests.has(parsed.id)) {
      const reqRow = pendingRequests.get(parsed.id);
      pendingRequests.delete(parsed.id);
      mergeReply(reqRow, t, raw, parsed);
      return;
    }

    const row = document.createElement('div');
    row.className = 'log-row dir-' + dir + (parsed ? ' has-json' : '');

    // shortTopic() ховає повторюваний devices/<client-id>-префікс за
    // "<client-id>" (розділ нижче, біля reqTopic/replyTopic) - повний топік
    // лишається в title (hover), нічого не втрачено, лише не в кожному рядку.
    const topicShort = topic ? shortTopic(topic) : '';
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML =
      `<span class="log-expand">${parsed ? '▸' : ''}</span>` +
      `<span class="log-t">${t}</span>` +
      `<span class="log-dir dir-${dir}">${DIR_LABEL[dir] || '?'}</span>` +
      `<span class="log-topic"${topic ? ` title="${esc(topic)}"` : ''}>${esc(topicShort)}</span>` +
      `<span class="log-payload">${esc(raw)}</span>`;
    row.appendChild(line);

    if (parsed) {
      const pretty = document.createElement('div');
      pretty.className = 'log-pretty';
      pretty.hidden = true;
      setPrettyContent(pretty, prettyBlock(raw));
      row.appendChild(pretty);
      line.addEventListener('click', () => {
        pretty.hidden = !pretty.hidden;
        $('.log-expand', line).textContent = pretty.hidden ? '▸' : '▾';
      });
    }

    if (dir === 'out' && parsed && parsed.id !== undefined) {
      row._reqId = parsed.id;
      row._reqTime = t;
      row._reqRaw = raw;
      row._reqT0 = performance.now();
      pendingRequests.set(parsed.id, row);
    }

    // Вставка - за поточним порядком показу; logRows.push() лишається
    // хронологічним завжди (коментар при оголошенні logRows вище).
    if (logNewestFirst) el.insertBefore(row, el.firstChild);
    else el.appendChild(row);
    logRows.push(row);
    if (logRows.length > LOG_MAX_LINES) evictOldestRow();
  }

  // --- вкладки (system-info/wifi-status/ecoflow-status/log) - видимі й
  // перемикаються незалежно від стану з'єднання, той самий каркас, що й у
  // порталі (nav button.active / section.active), а не дві різні "сторінки"
  // до і після конекту. ---
  const tabButtons = $$('nav button');
  const tabSections = $$('main > section');
  function activateTab(name) {
    for (const b of tabButtons) b.classList.toggle('active', b.dataset.tab === name);
    for (const s of tabSections) s.classList.toggle('active', s.dataset.tab === name);
  }
  for (const b of tabButtons) b.addEventListener('click', () => activateTab(b.dataset.tab));

  // --- стан панелей команд ---
  const panels = {};
  for (const cmd of COMMANDS) {
    const el = $(`.cmd-section[data-cmd="${cmd}"]`);
    panels[cmd] = {
      el,
      out: $('.out', el),
      status: $('.cmd-status', el),
      refreshBtn: $('.btn-refresh', el),
      autoToggle: $('.auto-toggle', el),
      pendingId: null,
      backoffFactor: 1,
      timer: null,
    };
    // data-persist - програмно, не в статичній розмітці: ключ ("auto-<cmd>")
    // іде з того самого COMMANDS, тому 5-та команда в майбутньому підхопить
    // персист автоматично, без правки розмітки під неї (розділ "Персист
    // UI-чекбоксів" нижче).
    panels[cmd].autoToggle.dataset.persist = 'auto-' + cmd;
  }
  // Саме тут, не раніше - усі data-persist (і статичні, і щойно виставлені
  // programmatically рядком вище) уже на місці, wireAllPersistedCheckboxes()
  // (розділ "Персист UI-чекбоксів" вище) підписує їх усі одним проходом.
  wireAllPersistedCheckboxes();

  function setPanelStatus(cmd, text, cls) {
    const p = panels[cmd];
    p.status.textContent = text;
    p.status.className = 'cmd-status' + (cls ? ' ' + cls : '');
  }

  // Рендер-функції (esc/kv/RENDERERS/...) підключені окремим <script
  // src="render.js"> вище - той самий код прогонить headless test/render.test.js
  // (Node, без DOM). Сирий JSON лишається поруч у <details> в самому
  // renderReply() - рендер не показує все (напр. partitions/params на
  // портальному боці).

  // Остання відома відповідь кожної команди - System-картки Network/EcoFlow
  // (render.js: renderSystemInfo(data, extra)) читають wifi-status/
  // ecoflow-status, не роблячи власного другого MQTT-запиту (той самий
  // принцип, що statusRows() у порталі малює і вкладку Wi-Fi, і System-картку
  // з ОДНОГО /api/wifi/status). lastSystemInfo - чи взагалі вже приходив
  // system-info (renderSystemPanel() нічого не малює, поки нема бодай одного).
  let lastSystemInfo = null;
  let lastWifiStatus = null;
  let lastEcoflowStatus = null;
  let lastMqttStatus = null;

  function buildPanelHtml(cmd, data, extra) {
    let html;
    try {
      html = extra !== undefined ? RENDERERS[cmd](data, extra) : RENDERERS[cmd](data);
    } catch (e) {
      return `<p class="muted">render error: ${esc(e.message)}</p>`;
    }
    return html + `<details class="raw"><summary>raw JSON</summary><pre>${esc(JSON.stringify(data, null, 2))}</pre></details>`;
  }

  // Розгорнуті пристрої EcoFlow (System-картка) - сканується з DOM ПЕРЕД
  // кожною перемальовкою (той самий патерн, що ecoSysOpenDetails у порталі):
  // innerHTML= нижче знищує й перестворює вузли, тому "open" на <details>
  // сам по собі не переживає перемальовку - треба явно прочитати й повернути.
  function renderSystemPanel() {
    if (!lastSystemInfo) return; // ще жодної відповіді system-info - нема що перемальовувати
    const openSerials = new Set(
      Array.from(panels['system-info'].out.querySelectorAll('.sys-eco-device[open]'))
        .map((el) => el.dataset.sn));
    panels['system-info'].out.innerHTML = buildPanelHtml('system-info', lastSystemInfo,
      { wifi: lastWifiStatus, ecoflow: lastEcoflowStatus, ecoflowOpenSerials: openSerials, mqtt: lastMqttStatus });
  }

  function renderReply(cmd, msg) {
    const p = panels[cmd];
    if (msg.ok) {
      if (cmd === 'wifi-status') lastWifiStatus = msg.data;
      else if (cmd === 'ecoflow-status') lastEcoflowStatus = msg.data;
      else if (cmd === 'mqtt-status') lastMqttStatus = msg.data;
      else if (cmd === 'system-info') lastSystemInfo = msg.data;

      if (cmd === 'system-info') {
        renderSystemPanel();
      } else {
        p.out.innerHTML = buildPanelHtml(cmd, msg.data);
        // wifi-status/ecoflow-status/mqtt-status теж тримають відповідні
        // System-картки свіжими - без чекання наступного system-info-поллу.
        renderSystemPanel();
      }
      setPanelStatus(cmd, `ok (id ${msg.id})`, 'ok');
      p.backoffFactor = 1;
    } else {
      setPanelStatus(cmd, `error: ${msg.error || 'unknown'}`, 'err');
      p.backoffFactor = Math.min(p.backoffFactor * 2, AUTO_BACKOFF_MAX);
    }
  }

  // --- топіки ---
  let conn = null; // {host, port, prefix, username, password, clientId} - активне з'єднання
  function reqTopic(cmd) { return `${conn.prefix}/devices/${conn.clientId}/api/${cmd}`; }
  function replyTopic(cmd) { return `${conn.prefix}/devices/${conn.clientId}/api/${cmd}/reply`; }
  function statusTopic() { return `${conn.prefix}/devices/${conn.clientId}/status`; }
  // Лог (logEvent) показує топік у кожному рядку - сьогодні всі підписки й
  // публікації скоуплені на ОДИН пристрій (reqTopic/replyTopic/statusTopic
  // вище), тому <prefix>/devices/<client-id> - це 99% символів, не
  // інформація. shortTopic() ховає той самий повторюваний префікс за
  // "<client-id>" (сам clientId, не слово "device" - той самий
  // ідентифікатор, що й у формі підключення/f-client, легше зіставити з
  // кількома пристроями, якби колись знадобилось), лишає лише змінний хвіст
  // (api/system-info, status тощо) - повний топік і далі доступний через
  // title (hover) у .log-topic.
  function shortTopic(topic) {
    if (!conn) return topic;
    const prefix = `${conn.prefix}/devices/${conn.clientId}`;
    const short = `<${conn.clientId}>`;
    if (topic === prefix) return short;
    if (topic.startsWith(prefix + '/')) return short + topic.slice(prefix.length);
    return topic;
  }

  function requestCmd(cmd) {
    if (!client || !client.connected) return;
    const p = panels[cmd];
    const id = Math.floor(Math.random() * 1e9);
    p.pendingId = id;
    setPanelStatus(cmd, 'loading...', '');
    const payload = JSON.stringify({ id });
    client.publish(reqTopic(cmd), payload);
    logEvent('out', reqTopic(cmd), payload);
  }

  function scheduleAuto(cmd) {
    const p = panels[cmd];
    clearTimeout(p.timer);
    if (!p.autoToggle.checked) return;
    const wait = AUTO_BASE_MS * p.backoffFactor;
    p.timer = setTimeout(() => {
      requestCmd(cmd);
      scheduleAuto(cmd);
    }, wait);
  }

  for (const cmd of COMMANDS) {
    panels[cmd].refreshBtn.addEventListener('click', () => requestCmd(cmd));
    panels[cmd].autoToggle.addEventListener('change', () => {
      if (panels[cmd].autoToggle.checked) {
        requestCmd(cmd);
      }
      scheduleAuto(cmd);
    });
  }

  // --- попап підключення ---
  const connWrap = $('.conn-wrap');
  const connPopover = $('#conn-popover');
  const connActionBtn = $('#btn-conn-action');
  const navEl = $('nav');
  const mainEl = $('main');
  // Поля форми - readonly, поки з'єднання активне: редагувати host/port/...
  // "під живим з'єднанням" однаково нічого не змінює (client уже підключений
  // зі старими значеннями), а виглядає так, ніби зміна щось робить. Спершу
  // Disconnect - тоді форма знову редагована. btn-forget/btn-conn-action -
  // не тут: це самі дії керування з'єднанням, вони мають лишатись активними.
  const connFields = $$('.conn-popover input');
  function setConnFieldsDisabled(disabled) {
    for (const el of connFields) el.disabled = disabled;
  }
  function openPopover() { connPopover.hidden = false; }
  function closePopover() { connPopover.hidden = true; }
  function togglePopover() { connPopover.hidden = !connPopover.hidden; }
  // Клік поза попапом закриває його - той самий очікуваний патерн, що й
  // ▾-меню порталу, інакше форма лишається висіти, поки її не закриють
  // повторним кліком по тій самій кнопці.
  document.addEventListener('click', (ev) => {
    if (connPopover.hidden) return;
    if (connWrap.contains(ev.target)) return;
    closePopover();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !connPopover.hidden) closePopover();
  });

  // --- з'єднання ---
  let client = null;
  let connState = 'off'; // 'off' | 'connecting' | 'on'

  function setConnState(state) {
    connState = state;
    const dot = $('#conn-dot');
    const label = $('#conn-label');
    dot.className = state === 'off' ? '' : state;
    label.textContent = { off: 'disconnected', connecting: 'connecting...', on: 'connected' }[state];
    for (const cmd of COMMANDS) panels[cmd].refreshBtn.disabled = state !== 'on';

    // Вкладки System/Wi-Fi/EcoFlow/Log мають сенс лише з живими даними -
    // поки не connected, показувати їх порожніми ("-" у кожній) створює
    // враження, що сторінка чекає на якесь диво. Замість цього - взагалі
    // ховаємо nav/main, лишається тільки шапка з попапом підключення.
    navEl.hidden = state !== 'on';
    mainEl.hidden = state !== 'on';

    // Поля форми - readonly під активним з'єднанням (розділ вище,
    // setConnFieldsDisabled): змінити host/port/... на льоту й так нічого не
    // означає, поки client не переперепідключений - спершу Disconnect.
    setConnFieldsDisabled(state === 'on');

    // Один видимий контрол на дію: connect/disconnect - та сама кнопка,
    // підпис і поведінка змінюються з станом, а не дві кнопки, з яких
    // одна завжди задизейблена. Попап відкривається сам, коли з'єднання
    // немає (перше завантаження сторінки і будь-яке розірвання з'єднання -
    // той самий випадок, форма підключення завжди під рукою), і ховається,
    // коли з'єднання встановлено, звільняючи місце під вкладки.
    if (state === 'off') {
      connActionBtn.textContent = 'Connect';
      connActionBtn.disabled = false;
      openPopover();
    } else if (state === 'connecting') {
      connActionBtn.textContent = 'Connecting...';
      connActionBtn.disabled = true;
    } else {
      connActionBtn.textContent = 'Disconnect';
      connActionBtn.disabled = false;
      closePopover();
    }
  }

  function disconnect() {
    for (const cmd of COMMANDS) {
      clearTimeout(panels[cmd].timer);
      panels[cmd].autoToggle.checked = false;
    }
    if (client) {
      client.end(true);
      client = null;
    }
    setConnState('off');
    $('#device-state').textContent = '';
  }

  function connect() {
    conn = readForm();
    if (!conn.host || !conn.clientId) {
      alert('Host і device client-id обов’язкові');
      return;
    }
    saveConn(conn);

    const url = `ws://${conn.host}:${conn.port}`;
    logEvent('info', null, null, `connecting to ${url} as '${conn.username}', device '${conn.clientId}'`);
    setConnState('connecting');

    client = mqtt.connect(url, {
      username: conn.username,
      password: conn.password,
      clientId: 'sapi-web-' + Math.random().toString(16).slice(2, 10),
      reconnectPeriod: 4000,
      connectTimeout: 8000,
    });

    client.on('connect', () => {
      setConnState('on');
      logEvent('info', null, null, 'connected');
      client.subscribe(`${conn.prefix}/devices/${conn.clientId}/api/+/reply`);
      client.subscribe(statusTopic());
      // Відновлення персистентних UI-контролів - ПІСЛЯ підписки, ПЕРЕД
      // безумовним циклом нижче (розділ "Персист UI-чекбоксів" вище):
      // "Auto" без живого client однаково нічого не зробив би, а зроблений
      // ДО subscribe() ризикував би загубити відповідь на власний запит
      // (publish раніше за subscribe на топік reply). Може дати один зайвий
      // дублікат requestCmd() для команд з увімкненим Auto (change-обробник
      // усередині сам робить один запит, а безумовний цикл нижче - ще
      // один) - прийнятно, не вартий спеціального обходу заради економії
      // одного MQTT-повідомлення раз на конект.
      applyPersistedToggles();
      for (const cmd of COMMANDS) requestCmd(cmd);
    });

    client.on('reconnect', () => setConnState('connecting'));
    client.on('close', () => setConnState('off'));
    client.on('error', (err) => logEvent('err', null, null, err.message || err));

    client.on('message', (topic, payloadBuf) => {
      const text = payloadBuf.toString();
      logEvent('in', topic, text);

      if (topic === statusTopic()) {
        $('#device-state').textContent = `device: ${text}`;
        return;
      }
      for (const cmd of COMMANDS) {
        if (topic !== replyTopic(cmd)) continue;
        let msg;
        try {
          msg = JSON.parse(text);
        } catch (e) {
          setPanelStatus(cmd, 'invalid JSON from device', 'err');
          return;
        }
        const p = panels[cmd];
        // Ехо id - ігноруємо застарілу відповідь (напр. після ручного
        // Refresh поки чекали авто-тік), а не показуємо, що прийде першим.
        if (p.pendingId !== null && msg.id !== p.pendingId) return;
        p.pendingId = null;
        renderReply(cmd, msg);
        return;
      }
    });
  }

  // Індикатор стану - лише перемикач видимості попапу, незалежно від
  // з'єднання: розрив з'єднання - дія попапу (кнопка Disconnect нижче), а
  // не одного кліку по пілюлі - випадковий клік по шапці більше не рве
  // з'єднання без жодного проміжного кроку.
  $('#conn-toggle').addEventListener('click', togglePopover);
  connActionBtn.addEventListener('click', () => {
    if (connState === 'off') connect();
    else if (connState === 'on') disconnect();
  });
  $('#btn-forget').addEventListener('click', () => {
    forgetConn();
    fillForm({});
    logEvent('info', null, null, 'saved connection forgotten');
  });
  $('#btn-clear-log').addEventListener('click', () => {
    logRows.length = 0;
    pendingRequests.clear();
    $('#log').innerHTML = '';
  });

  // Короткий git-sha, з яким зібрана ЦЯ сторінка (revision.js, той самий
  // коміт, що й прошивка). Порівняння з живим "revision" пристрою (discovery,
  // фаза 2) тут ще нема - discovery-канал на платі не реалізований, це лише
  // видима мітка білда SAPI.
  if (typeof SAPI_EXPECTED_REVISION !== 'undefined') {
    $('#sapi-revision').textContent = 'build ' + SAPI_EXPECTED_REVISION;
  }

  setConnState('off');

  // Автологін - лише якщо є збережене підключення (host+client-id) І
  // користувач сам увімкнув чекбокс "Auto-connect on load" минулого разу
  // (дефолт - вимкнено, fillForm() вище) - тиснемо Connect самі, без
  // очікування ручного кліку. Попап усе одно щойно відкрився
  // (setConnState('off') вище) - користувач бачить "Connecting...", а не
  // миттєвий стрибок одразу у вкладки без пояснення, і на невдалому
  // конекті попап лишається відкритим із формою, як і зараз.
  const savedConn = loadConn();
  if (savedConn.host && savedConn.clientId && savedConn.autoLogin === true) {
    connect();
  }
})();
</script>
</body>
</html>
