<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 portal</title>
<style>
:root {
  --bg: #14171c; --panel: #1c2027; --line: #2b313b; --text: #e6e9ef;
  --muted: #8b94a3; --accent: #4da3ff; --ok: #4cc38a; --warn: #e0a33e; --err: #e5534b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .spacer { flex: 1; }
#devstate { color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 4px; padding: 8px 16px 0; }
nav button { background: none; border: 1px solid transparent; border-bottom: none;
  color: var(--muted); padding: 7px 14px; border-radius: 6px 6px 0 0; cursor: pointer; font: inherit; }
nav button.active { background: var(--panel); border-color: var(--line); color: var(--text); }
main { padding: 0 16px 24px; }
section { display: none; background: var(--panel); border: 1px solid var(--line);
  border-radius: 0 8px 8px 8px; padding: 16px; }
section.active { display: block; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
h2:first-child { margin-top: 0; }
button.act { background: var(--accent); border: none; color: #06121f; padding: 7px 14px;
  border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; }
button.act.ghost { background: none; border: 1px solid var(--line); color: var(--text); font-weight: 400; }
button.act:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
input, select { background: var(--bg); border: 1px solid var(--line); color: var(--text);
  padding: 7px 10px; border-radius: 6px; font: inherit; }
input:focus, select:focus { outline: 1px solid var(--accent); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; }
/* Дві однакові стрічки: повний лог на Console і вивід команди на Commands. */
#log, #run-out { background: #0e1116; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
  overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#log { height: 55vh; }
#run-out { height: 22vh; }
#log .e, #run-out .e { color: var(--err); } #log .w, #run-out .w { color: var(--warn); }
#log .d, #run-out .d { color: var(--muted); } #log .cmd, #run-out .cmd { color: var(--accent); }
#cmd, #run-cmd { flex: 1; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#cmd-filter { width: 100%; }
/* Перелік команд: 70 рядків, тому щільно і під власним скролом, а не на всю
   сторінку. Клікабельний увесь рядок - кнопка на кожному додавала б 70 рамок. */
#cmd-box { max-height: 34vh; overflow-y: auto; margin-top: 8px;
  border: 1px solid var(--line); border-radius: 6px; }
#cmd-table td { padding: 2px 10px; border-bottom: none; vertical-align: baseline; }
#cmd-table tr { cursor: pointer; }
#cmd-table tr:hover { background: #ffffff0f; }
#cmd-table td.n { width: 1%; white-space: nowrap; color: var(--accent);
  font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#cmd-table td.d { color: var(--muted); font-size: 12px; }
/* Пара "запустити / видалити" виглядає й поводиться як одна кнопка. */
.chip { display: inline-flex; }
.chip button:first-child { border-radius: 6px 0 0 6px; }
.chip button:last-child { border-radius: 0 6px 6px 0; border-left: none;
  padding: 7px 10px; color: var(--muted); }
#toast { position: fixed; right: 16px; bottom: 16px; background: var(--panel);
  border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px;
  padding: 10px 14px; max-width: 60vw; display: none; }
.muted { color: var(--muted); }
@media (max-width: 560px) { dl { grid-template-columns: 1fr; } th.opt, td.opt { display: none; } }
</style>
</head>
<body>
<header>
  <h1>ESP32 portal</h1>
  <span id="devstate">connecting…</span>
  <span class="spacer"></span>
  <span id="heap" class="muted"></span>
</header>

<nav>
  <button data-tab="wifi" class="active">Wi-Fi</button>
  <button data-tab="commands">Commands</button>
  <button data-tab="console">Console</button>
</nav>

<main>
<section id="tab-wifi" class="active">
  <h2>Status</h2>
  <dl id="wifi-status"></dl>

  <h2>Actions</h2>
  <div class="row">
    <button class="act" id="btn-scan">Scan networks</button>
    <button class="act ghost" id="btn-reconnect">Reconnect</button>
    <button class="act ghost" id="btn-hotspot">Start hotspot</button>
    <button class="act ghost" id="btn-hotspot-stop">Stop hotspot</button>
  </div>

  <h2>Networks in range</h2>
  <table id="scan-table"><tbody><tr><td class="muted">Press “Scan networks”.</td></tr></tbody></table>

  <h2>Saved profiles</h2>
  <table id="profiles">
    <thead><tr><th>SSID</th><th class="opt">Priority</th><th class="opt">Signal</th><th>State</th><th></th></tr></thead>
    <tbody></tbody>
  </table>
</section>

<section id="tab-commands">
  <h2>Run</h2>
  <form class="row" id="run-form">
    <input id="run-cmd" list="cmd-list" autocomplete="off" placeholder="command with arguments, e.g. net device wifi list">
    <button class="act" type="submit">Run</button>
    <button class="act ghost" type="button" id="btn-save-shortcut">Save as shortcut</button>
  </form>

  <h2>Shortcuts</h2>
  <div class="row" id="shortcuts"></div>

  <h2>Output <span id="run-state" class="muted" style="font-size:.75em; font-weight:400"></span></h2>
  <div id="run-out"></div>

  <h2>Available commands <span id="cmd-count" class="muted" style="font-size:.75em; font-weight:400"></span></h2>
  <input id="cmd-filter" placeholder="filter…" autocomplete="off">
  <div id="cmd-box"><table id="cmd-table"><tbody></tbody></table></div>
</section>

<section id="tab-console">
  <h2>Log <span id="feed" class="muted" style="font-size:.75em; font-weight:400; cursor:pointer"></span></h2>
  <div id="log"></div>
  <h2>Command</h2>
  <form class="row" id="cmd-form">
    <input id="cmd" list="cmd-list" autocomplete="off" placeholder="type a command, e.g. list">
    <datalist id="cmd-list"></datalist>
    <button class="act" type="submit">Run</button>
  </form>
  <p class="muted" id="cmd-hint">Output appears in the log above. Prompt history: ↑ / ↓.</p>
</section>
</main>

<div id="toast"></div>

<script>
"use strict";

const $ = (sel) => document.querySelector(sel);

function toast(text, kind) {
  const el = $("#toast");
  el.textContent = text;
  el.style.borderLeftColor = kind === "err" ? "var(--err)" : kind === "ok" ? "var(--ok)" : "var(--accent)";
  el.style.display = "block";
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.style.display = "none"; }, 4000);
}

async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 401) { toast("Authentication required", "err"); throw new Error("unauthorized"); }
  const body = await res.json().catch(() => null);
  if (!res.ok) throw new Error((body && body.error) || ("HTTP " + res.status));
  return body;
}

function form(fields) {
  const body = new URLSearchParams();
  for (const [k, v] of Object.entries(fields)) body.set(k, v);
  return { method: "POST", body, headers: { "Content-Type": "application/x-www-form-urlencoded" } };
}

// Мутації сервер виконує не одразу, а в loop() - тому кожна відповідає
// номером задачі, а результат забираємо опитуванням /api/job.
async function job(path, options) {
  const started = await api(path, options);
  if (!started || !started.jobId) return started;

  for (let i = 0; i < 40; i++) {
    await new Promise((r) => setTimeout(r, 300));
    const state = await api("/api/job?id=" + started.jobId);
    if (state.status === "done") return state.result;
    if (state.status === "expired") throw new Error("Job result expired");
  }
  throw new Error("Job timed out");
}

/* ---------------- tabs ---------------- */

document.querySelectorAll("nav button").forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b === btn));
    document.querySelectorAll("section").forEach((s) =>
      s.classList.toggle("active", s.id === "tab-" + btn.dataset.tab));
    // Свіжий знімок одразу при відкритті - щоб вкладка не показувала старе,
    // поки не настане наступний тік.
    if (btn.dataset.tab === "wifi") refreshWifi();
    if (btn.dataset.tab === "commands") refreshShortcuts();
  };
});

/* ---------------- wi-fi ---------------- */

function signal(rssi) {
  if (!rssi) return "–";
  const bars = rssi > -60 ? 4 : rssi > -70 ? 3 : rssi > -80 ? 2 : 1;
  return "▮".repeat(bars) + "▯".repeat(4 - bars) + " " + rssi + " dBm";
}

function renderStatus(s) {
  const ap = s.ap || {};
  $("#devstate").textContent = s.connected ? s.ssid + " · " + s.ip
    : ap.active ? "hotspot " + ap.ssid : s.state;
  $("#wifi-status").innerHTML = [
    ["State", s.state],
    ["SSID", s.ssid || "–"],
    ["IP address", s.ip || "–"],
    ["Signal", s.connected ? signal(s.rssi) : "–"],
    ["MAC", s.mac],
    ["Auto reconnect", s.autoReconnect ? "on" : "off"],
    ["Hotspot", ap.active ? ap.ssid + " · " + ap.ip + " · " + ap.clients + " client(s)" : "off"],
  ].map(([k, v]) => "<dt>" + k + "</dt><dd>" + escapeHtml(String(v)) + "</dd>").join("");
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function renderProfiles(list) {
  const body = $("#profiles tbody");
  if (!list.length) {
    body.innerHTML = '<tr><td colspan="5" class="muted">No saved profiles.</td></tr>';
    return;
  }
  body.innerHTML = list.map((c) => `
    <tr>
      <td>${escapeHtml(c.ssid)}${c.hasPassword ? "" : ' <span class="muted">(open)</span>'}</td>
      <td class="num opt">${c.priority}</td>
      <td class="opt">${c.rssi ? signal(c.rssi) : '<span class="muted">not in range</span>'}</td>
      <td>${c.enabled ? "enabled" : '<span class="muted">disabled</span>'}</td>
      <td class="num">
        <button class="act ghost" data-connect="${c.id}">Connect</button>
        <button class="act ghost" data-forget="${c.id}">Forget</button>
      </td>
    </tr>`).join("");
}

function renderScan(networks) {
  const body = $("#scan-table").querySelector("tbody");
  if (!networks.length) {
    body.innerHTML = '<tr><td class="muted">Nothing found.</td></tr>';
    return;
  }
  networks.sort((a, b) => b.rssi - a.rssi);
  body.innerHTML = networks.map((n) => `
    <tr>
      <td>${n.hidden ? '<span class="muted">&lt;hidden&gt;</span>' : escapeHtml(n.ssid)}
          ${n.inUse ? ' <span style="color:var(--ok)">•</span>' : ""}
          ${n.known ? ' <span class="muted">saved</span>' : ""}</td>
      <td class="opt">${n.security}</td>
      <td class="opt num">ch ${n.channel}</td>
      <td>${signal(n.rssi)}</td>
      <td class="num">${n.hidden ? "" : `<button class="act ghost" data-join="${escapeHtml(n.ssid)}" data-open="${n.security === "OPEN"}">Join</button>`}</td>
    </tr>`).join("");
}

// Опитувальник, який НЕ накладається сам на себе: наступний запит іде лише
// після того, як завершився попередній. Через setInterval вкладка накопичувала
// десятки паралельних fetch'ів з однаковим ?since= - плата не встигала
// відповідати, а сторінка сипала ще й ще. Плюс пауза, коли вкладка невидима:
// фонові вкладки не мають нічого вантажити.
function poller(fn, ms, isActive) {
  let stopped = false;
  let failures = 0;
  const tick = async () => {
    if (stopped) return;
    let delay = ms;
    if (!document.hidden && (!isActive || isActive())) {
      try {
        await fn();
        failures = 0;
      } catch (e) {
        // Відступ при збоях. На слабкому лінку (тут це буває: 20% сигналу -
        // і половина запитів не доходить) наполегливе опитування з тим самим
        // періодом лише додає платі роботи, якої вона й так не встигає.
        failures = Math.min(failures + 1, 3);
        delay = ms * (1 << failures);
      }
    }
    if (!stopped) setTimeout(tick, delay);
  };
  tick();
  return { stop() { stopped = true; } };
}

const onWifiTab = () => $("#tab-wifi").classList.contains("active");

// Тільки стан - його й опитуємо періодично.
async function refreshWifiStatus() {
  renderStatus(await api("/api/wifi/status"));
}

// Список профілів у NVS сам собою не міняється, тому окремо і НЕ по таймеру:
// лише при відкритті вкладки й після дій, що його змінюють.
async function refreshWifi() {
  try {
    renderStatus(await api("/api/wifi/status"));
    renderProfiles(await api("/api/wifi/connections"));
  } catch (e) { /* мережа пристрою могла впасти - наступний тік спробує знову */ }
}

$("#btn-scan").onclick = async (ev) => {
  ev.target.disabled = true;
  ev.target.textContent = "Scanning…";
  try {
    const result = await job("/api/wifi/scan", { method: "POST" });
    if (result && result.ok) renderScan(result.networks);
    else toast((result && result.message) || "Scan failed", "err");
  } catch (e) { toast(e.message, "err"); }
  ev.target.disabled = false;
  ev.target.textContent = "Scan networks";
};

$("#btn-reconnect").onclick = () => runAction("/api/wifi/reconnect", { method: "POST" });
$("#btn-hotspot").onclick = () => runAction("/api/wifi/hotspot", form({ action: "start" }));
$("#btn-hotspot-stop").onclick = () => runAction("/api/wifi/hotspot", form({ action: "stop" }));

async function runAction(path, options) {
  try {
    const r = await job(path, options);
    toast((r && r.message) || "Done", r && r.ok === false ? "err" : "ok");
  } catch (e) { toast(e.message, "err"); }
  refreshWifi();
}

document.addEventListener("click", (ev) => {
  const join = ev.target.closest("[data-join]");
  if (join) {
    const ssid = join.dataset.join;
    const password = join.dataset.open === "true" ? "" : prompt("Password for “" + ssid + "”:");
    if (password === null) return;
    runAction("/api/wifi/connections", form({ ssid, password, connect: "true" }));
    return;
  }
  const connect = ev.target.closest("[data-connect]");
  if (connect) { runAction("/api/wifi/connect", form({ id: connect.dataset.connect })); return; }

  const forget = ev.target.closest("[data-forget]");
  if (forget && confirm("Remove this profile?")) {
    runAction("/api/wifi/connections?id=" + forget.dataset.forget, { method: "DELETE" });
  }
});

/* ---------------- commands ---------------- */

// Перелік команд не міняється між перезавантаженнями пристрою, тому
// вантажиться один раз на старті сторінки, а фільтр працює локально: слати
// запит на кожну натиснуту літеру заради двох десятків рядків - зайва робота
// для плати.
let commands = [];

function renderCommands() {
  const q = $("#cmd-filter").value.trim().toLowerCase();
  const list = q
    ? commands.filter((c) => (c.name + " " + c.description).toLowerCase().includes(q))
    : commands;

  $("#cmd-count").textContent = q ? list.length + " of " + commands.length : commands.length + " total";

  const body = $("#cmd-table tbody");
  if (!list.length) {
    body.innerHTML = '<tr><td class="d">Nothing matches.</td></tr>';
    return;
  }
  body.innerHTML = list.map((c) => `
    <tr data-pick="${escapeHtml(c.name)}">
      <td class="n">${escapeHtml(c.name)}</td>
      <td class="d">${escapeHtml(c.description)}</td>
    </tr>`).join("");
}

async function loadCommands() {
  try {
    commands = await api("/api/commands/list");
    // Той самий список - ще й автодоповненням для обох полів вводу.
    $("#cmd-list").innerHTML = commands
      .map((c) => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.description)}</option>`)
      .join("");
    $("#cmd-hint").textContent =
      commands.length + " commands registered. Output appears in the log above. History: ↑ / ↓.";
    renderCommands();
  } catch (e) { /* необов'язкове */ }
}

function renderShortcuts(list) {
  const box = $("#shortcuts");
  if (!list.length) {
    box.innerHTML = '<span class="muted">No shortcuts yet — type a command above and press “Save as shortcut”.</span>';
    return;
  }
  box.innerHTML = list.map((s) => `
    <span class="chip">
      <button class="act ghost" data-run="${escapeHtml(s.command)}" title="${escapeHtml(s.command)}">${escapeHtml(s.name)}</button>
      <button class="act ghost" data-drop-shortcut="${s.index}" title="Remove shortcut">×</button>
    </span>`).join("");
}

async function refreshShortcuts() {
  try { renderShortcuts(await api("/api/commands/shortcuts")); } catch (e) { /* наступне відкриття вкладки спробує знову */ }
}

// Команда виконується не тут, а в loop() пристрою, тому відповіді "готово"
// не буде й бути не може: результат - це рядки, які приїдуть у стрічку логу.
// Тоста про "queued" немає навмисно: вивід і так з'являється на очах - і в
// панелі Output, і в консолі. Лишились тільки помилки.
async function runCommand(cmd) {
  // Вивід збираємо з тієї самої стрічки, що й консоль: другого каналу для
  // відповіді на пристрої немає і не треба. Вмикаємо ПЕРЕД запитом - відлуння
  // "> cmd" приходить першим рядком і має потрапити в панель.
  //
  // trim() тут не косметика: позначку кінця ми звіряємо з рядком команди
  // посимвольно, а пристрій свій рядок обрізає.
  cmd = cmd.trim();
  $("#run-out").textContent = "";
  $("#run-state").textContent = "running: " + cmd;
  captureCmd = cmd;
  captureOutput = true;
  armCaptureTimeout();

  try {
    await api("/api/commands/exec", form({ cmd }));
    // Під SSE підганяти не треба: вивід приїде сам, і то швидше.
    if (sse === null || sse.readyState !== EventSource.OPEN) setTimeout(pollLog, 200);
  } catch (e) {
    endCapture("");
    toast(e.message, "err");
  }
}

// Панель виводу збирає рядки від запуску команди й до її КІНЦЯ - не "до
// тиші". Кінець приходить у самій стрічці: CommandQueue друкує парний до луни
// рядок "< <команда> (N ms)" після того, як команда відпрацювала. Без нього
// панель дописувала б усе, що трапиться далі, - крон, телеметрію, мережеві
// події - під заголовком нашої команди.
//
// Таймаут лишається лише як страховка: якщо позначка не прийде (пристрій
// перезавантажився на 'reboot', стрічка обірвалась), збирання не має тривати
// вічно.
const CAPTURE_TIMEOUT_MS = 60000;

// Рядок журналу: "[I][cmd    ] < heap (12 ms)".
const END_MARKER = /^\[.\]\[[^\]]*\] < (.*) \((\d+) ms\)$/;

let captureOutput = false;
let captureCmd = "";
let captureTimer = null;

function endCapture(label) {
  captureOutput = false;
  clearTimeout(captureTimer);
  $("#run-state").textContent = label;
}

function armCaptureTimeout() {
  clearTimeout(captureTimer);
  captureTimer = setTimeout(() => endCapture("stopped: no end marker"), CAPTURE_TIMEOUT_MS);
}

$("#cmd-filter").oninput = renderCommands;

$("#run-form").onsubmit = (ev) => {
  ev.preventDefault();
  const cmd = $("#run-cmd").value.trim();
  if (cmd) runCommand(cmd);
};

$("#btn-save-shortcut").onclick = async () => {
  const cmd = $("#run-cmd").value.trim();
  if (!cmd) { toast("Type a command first", "err"); return; }
  const name = prompt("Shortcut name:", cmd.split(" ")[0]);
  if (name === null) return;
  try {
    const r = await job("/api/commands/shortcuts", form({ name, command: cmd }));
    toast((r && r.message) || "Saved", r && r.ok === false ? "err" : "ok");
  } catch (e) { toast(e.message, "err"); }
  refreshShortcuts();
};

$("#tab-commands").addEventListener("click", async (ev) => {
  // Клік по назві команди не запускає її: майже всі беруть аргументи, тому
  // назва лише потрапляє в поле вводу, а запуск - окремою дією.
  const pick = ev.target.closest("[data-pick]");
  if (pick) {
    const input = $("#run-cmd");
    input.value = pick.dataset.pick + " ";
    input.focus();
    return;
  }

  const run = ev.target.closest("[data-run]");
  if (run) { runCommand(run.dataset.run); return; }

  const drop = ev.target.closest("[data-drop-shortcut]");
  if (drop && confirm("Remove this shortcut?")) {
    try {
      const r = await job("/api/commands/shortcuts?index=" + drop.dataset.dropShortcut,
                          { method: "DELETE" });
      toast((r && r.message) || "Removed", r && r.ok === false ? "err" : "ok");
    } catch (e) { toast(e.message, "err"); }
    refreshShortcuts();
  }
});

/* ---------------- console ---------------- */

let logCursor = null;
const history = [];
let historyPos = 0;

// Рядок журналу приходить як "[I][tag    ] text"; відлуння команди - як
// "[I][web    ] > cmd". Саме його і підсвічуємо акцентом.
function lineClass(line) {
  if (/^\[.\]\[[^\]]*\] > /.test(line)) return "cmd";
  if (line.startsWith("[E]")) return "e";
  if (line.startsWith("[W]")) return "w";
  if (line.startsWith("[D]")) return "d";
  return "";
}

// Скрол лишається внизу, лише якщо він там і був: інакше сторінка висмикувала б
// з-під пальця рядок, який зараз читають.
function appendTo(box, lines, limit) {
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  for (const line of lines) {
    const div = document.createElement("div");
    div.textContent = line;
    div.className = lineClass(line);
    box.appendChild(div);
  }
  while (box.childElementCount > limit) box.removeChild(box.firstChild);
  if (atBottom) box.scrollTop = box.scrollHeight;
}

function appendLog(lines) {
  appendTo($("#log"), lines, 500);
  if (!captureOutput) return;

  // У панель Output іде все до позначки кінця включно - і ні рядка після неї.
  // Чужі рядки, що встигли вклинитись ДО кінця команди, лишаються: вони
  // справді були в стрічці, поки команда працювала, і в serial видно те саме.
  const mine = [];
  let doneMs = null;
  for (const line of lines) {
    mine.push(line);
    const m = END_MARKER.exec(line);
    if (m && m[1] === captureCmd) { doneMs = m[2]; break; }
  }

  appendTo($("#run-out"), mine, 200);
  if (doneMs !== null) endCapture("done in " + doneMs + " ms");
  else armCaptureTimeout();
}

async function pollLog() {
  try {
    const data = await api("/api/console/log" + (logCursor === null ? "" : "?since=" + logCursor));
    if (logCursor !== null && data.from > logCursor) {
      appendLog(["… " + (data.from - logCursor) + " line(s) dropped, ring overflow …"]);
    }
    appendLog(data.lines);
    logCursor = data.next;
  } catch (e) { /* тихо: наступний тік спробує знову */ }
}

// SSE - основний шлях, опитування лишається відкатом: через AP-режим або
// кепський лінк потік може не піднятись. Обидва курсорні й ділять один logCursor
// (це той самий seq журналу), тому перемикання туди-сюди не дає ні дублів, ні
// дірок - за перекриття кожен просто не бачить нічого нового.
let sse = null;
let logPoller = null;

// Видно, звідки йде стрічка. Це не косметика: SSE - одне з'єднання й нуль
// запитів у спокої, опитування - запит щосекунди, і на платі це помітно.
function setFeed(mode) {
  $("#feed").textContent = mode;
}

function startPolling() {
  if (logPoller === null) {
    logPoller = poller(pollLog, 1000);
  }
}

function stopPolling() {
  if (logPoller !== null) { logPoller.stop(); logPoller = null; }
}

// Скільки разів поспіль пробувати підняти SSE, перш ніж лишитись на
// опитуванні. Браузер перепідключається сам кожні ~3 с, і на мертвому лінку це
// просто зайві з'єднання до плати.
const SSE_MAX_RETRIES = 3;
let sseFailures = 0;

function startStream() {
  if (!window.EventSource) {
    setFeed("polling (no EventSource)");
    startPolling();
    return;
  }

  sse = new EventSource("/api/console/stream");

  sse.onopen = () => { sseFailures = 0; setFeed("live (SSE)"); stopPolling(); };

  sse.onmessage = (ev) => {
    const id = Number(ev.lastEventId);
    // id поїхав НАЗАД - пристрій перезавантажився, seq почався з нуля. Мовчки
    // ігнорувати такі кадри не можна: консоль осліпла б до кінця сесії, поки
    // новий seq не дожене старий курсор.
    if (logCursor !== null && id < logCursor) logCursor = id;
    if (logCursor !== null && id > logCursor) {
      appendLog(["… " + (id - logCursor) + " line(s) dropped, ring overflow …"]);
    }
    appendLog([ev.data]);
    logCursor = id + 1;
  };

  // Перепідключається браузер сам (і надсилає Last-Event-ID), але поки він
  // мовчить, вкладка не має сліпнути - тому вмикаємо опитування. Коли потік
  // повернеться, onopen його вимкне.
  sse.onerror = () => {
    startPolling();
    if (++sseFailures >= SSE_MAX_RETRIES) {
      sse.close();
      sse = null;
      setFeed("polling (AJAX) — click to retry SSE");
      return;
    }
    setFeed("reconnecting… (polling)");
  };
}

// Індикатор клікабельний: якщо потік відвалився через мережу, підняти його
// назад можна без перезавантаження сторінки.
$("#feed").onclick = () => {
  if (sse !== null) return;
  sseFailures = 0;
  setFeed("connecting…");
  startStream();
}

$("#cmd-form").onsubmit = async (ev) => {
  ev.preventDefault();
  const input = $("#cmd");
  const cmd = input.value.trim();
  if (!cmd) return;

  input.value = "";
  history.push(cmd);
  historyPos = history.length;
  runCommand(cmd);
};

$("#cmd").onkeydown = (ev) => {
  if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") return;
  if (!history.length) return;
  ev.preventDefault();
  historyPos += ev.key === "ArrowUp" ? -1 : 1;
  historyPos = Math.max(0, Math.min(history.length, historyPos));
  ev.target.value = history[historyPos] || "";
};

/* ---------------- boot ---------------- */

async function pollStatus() {
  try {
    const s = await api("/api/status");
    $("#heap").textContent = "heap " + Math.round(s.freeHeap / 1024) + " KB";
  } catch (e) { /* ignore */ }
}

refreshWifi();
loadCommands();
refreshShortcuts();
startStream();

// Стан мережі - лише поки відкрита вкладка Wi-Fi; купа - раз на 10 с.
// Раніше обидва йшли кожні 3 і 5 секунд незалежно від того, чи їх видно.
poller(refreshWifiStatus, 5000, onWifiTab);
poller(pollStatus, 10000);
</script>
</body>
</html>
